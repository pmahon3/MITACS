topic: missing-content-thread
question: 'What content is missing from the iterated kappa_1 predictor that produces the coherence defect documented in v2 SETTLED + eigenmodes SETTLED MIXED?

  '
root:
  description: 'eigenmodes-v1 established that the defect (Sigma_h - iter_Sigma_h on Ontario weekday h=12) is diffuse across both eigendirections of C_1 (dominant_mode_share ~0.50), not concentrated in one mode. Synthetic VAR(1) cross-check ruled out projection ill-posedness. Weekday per-cell defect exceeds library-noise expectation, pointing at genuine dynamical asymmetry, not finite-sample noise. The next question is what the missing content IS - what dimensions of variation the demand-history embedding does not span that the data actually carries.

    '
  artifacts:
  - file: ../2026-05-26_multiscale-defect-eigenmodes/arbiter.yaml
    body_sha256: 0e8349a973db26b7f9f59ca72723708e34aca1c55ff247994d279d954a93fd54
  scope_limits: "This thread is about CHARACTERISING the missing content statistically, not about building a candidate v2 predictor. Backtest-style \"does adding X make the predictor better?\" experiments are downstream (seed \xA76.3); they belong to a separate thread if and when this one resolves with a specific candidate identified. Joint-MLE on richer parameterizations within the existing embedding (seed \xA76.4) is OUT OF SCOPE here - those address operator-class questions, not what-is-missing questions.\n"
