    marginal chi^2 across ~500 post-cutoff days (Q1''s CI on M1 chi^2 spanned roughly 1100-1700); (iii) substantive uncertainty about how much of the residual pathology is distributional vs non-distributional.
    The CI upper bound for effective_chi2 (900) stays inside R-B2; the lower bound (280) is just above the R-A2 boundary, so R-A2 is within forecast risk but not the central call. The CI on M3 (upper 1300)
    approaches Q1''s M1 baseline (1371), reflecting that mixture-2-Gaussian may not materially outperform Student-t (both are 1-shape-parameter-class families in different parameterizations).

    '
what_would_change_my_mind:
- If R-A2 fires (effective_chi2 <= 228.44), the non-distributional contributors (secular drift, iterated-mean bias, seam artifacts) are empirically subdominant in the marginal PIT - KDE absorbs more than
  I expected. The S5 / mitacs-clim-gap-nonstationary signal would be revealed as small in absolute chi^2 terms even if it's real, and the Q2B-class investigation could be deprioritized.
- If R-C2 fires (effective_chi2 > 2284.44), even KDE cannot help - the distributional-class programme as a whole is empirically wrong for marginal calibration. This would force a major thread reset and
  a pivot to non-distributional investigations.
- If KDE is NOT the preferred family (e.g., mixture_3 outperforms KDE), the assumption that nonparametric flexibility wins over richer parametric was wrong, and the residual structure may be smoother than
  I think (well-captured by 5 parameters; KDE bandwidth = Silverman is over-smoothing).
- If all three families produce nearly identical chi^2 within bootstrap CI overlap, the distributional class beyond Student-t is irrelevant and the residual gap is purely non-distributional - this would
  also support routing to Q2B-class investigations, but on stronger grounds than (b)/(c) above.
