what_would_change_my_mind:
- If effective_chi2 > 1000 (the upper range of R-B2), the proponent's non-distributional-contribution hypothesis is corroborated in absolute chi^2 terms and the counter-argument that S5 was a relative-ranking
  finding loses force.
- If KDE_chi^2 > 500 specifically while mixtures stay above 800, the failure mode is KDE-specific (bandwidth too wide, library too narrow, sampling noise too large at M = 200), not a corroboration of the
  proponent's non-distributional hypothesis. Different objection.
- If R-C2 fires (effective_chi2 > 2284), my disagreement with the proponent is moot - the distributional-class programme is wrong end-to-end.
opportunity_cost:
  alternative: A pre-experiment KDE-bandwidth sensitivity sweep would have been cheap (one extra fit per day-type with bandwidth = 0.5 x Silverman and 2 x Silverman) and would have hedged against the failure
    mode where Silverman over-smooths the actual Ontario residual law. Pinning bandwidth at Silverman per the production fitter default makes the verdict cheaper but more brittle to that one choice; if
    KDE narrowly misses R-A2, the analyst will want to ask whether bandwidth was the binding constraint, and that question cannot be answered without rerunning with different bandwidths (which post-hoc
    bandwidth tuning would void the pre-registration).
  ranking: complementary
  notes: 'The pre-registration is well-formed AS WRITTEN. The opportunity cost is a one-shot risk: the Silverman bandwidth choice is the single non-trivial hyperparameter and the experiment cannot sweep
    it post-hoc without invalidating the registration.'
