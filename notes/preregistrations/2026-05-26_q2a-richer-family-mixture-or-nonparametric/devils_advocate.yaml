strongest_argument: 'The proponent''s central claim - that ~half of the chi^2 = 1371 marginal pathology is non-distributional and survives kernel-family lift by construction - is built on a chain of inferences
  that the gate-validated cuts and KDE flexibility undercut.


  First, the cited non-distributional drivers (secular year-since-cutoff drift, iterated-mean bias at large h, day-anchor seam) all affect the PIT distribution by ALTERING THE EFFECTIVE LOCATION-AND-SCALE
  OF THE RESIDUAL at evaluation time. KDE is fit on residuals from a regression that already accounts for state-conditional location (via C_1) and scale (via the empirical residual spread). When the residual
  law is fit nonparametrically with ~5000 library samples and resampled via SMC, the resulting marginal includes whatever distributional shape the residuals empirically have - which DOES include the historically-observed
  effects of regime, season, hour-of-day, and library composition. The proponent is implicitly assuming KDE only models the within-library residual law and is naive about post-cutoff secular shifts; but
  at SMC-evaluation time the issue-time state x(t) carries the post-cutoff calendar features through C_1 implicitly. The post-cutoff PIT is bad under Student-t (1371) primarily because Student-t''s 1-parameter
  symmetric heavy tail cannot match the actual residual SHAPE - not because the iterated mean is biased (if it were, even the perfect distributional kernel would fail).


  Second, the proponent estimates the non-distributional fraction by appeal to S5 / S8c. But S5''s verdict was AMBIGUOUS with a tautology design hole; the legitimate calendar signals it found were ranked
  relatively, not absolutely. Year-since-cutoff being ''the strongest legitimate signal'' in PIT residuals means it''s the strongest of the calendar covariates tested, NOT that it dominates the absolute
  chi^2. S8d explicitly settled that heavy-tailedness lives in the kappa_1 INNOVATION not the climatology - this is exactly what KDE on the residual is fit to capture, and it has ~5000 effective samples
  to do so. Student-t hit 1371 with 1 free parameter; KDE has thousands of effective degrees of freedom. The reduction from 1371 to below 228 (a 6x factor) is well within KDE''s flexibility envelope.


  Third, the gate''s R-A2 cut at 228.44 is the worst-case across three weight-sweep variants under same-family null. The binding cell (V3_rho10, KDE, kurt=12) is the noisiest case in the gate; under Ontario''s
  actual residual distribution the same-family chi^2 will likely be lower than this conservative ceiling. The ''true'' KDE-fits-KDE noise floor on Ontario-scale data is closer to 50-100, leaving room for
  KDE to land at 150-200 and clear the bar.


  Net: R-A2 fires with effective_chi2 around 180, KDE binding. Mixture-2 and mixture-3 hit floors around 600-800 because their symmetric centred parametric form cannot capture residual skewness or multimodality,
  but KDE absorbs both.

  '
