verdict_reasoning: "Mechanical verdict per phase_a criteria: R-B2 fires. effective_chi2\
  \ =\n953.84 [685.23, 1356.92] sits in the registered ambiguous band\n(228.44, 2284.44].\
  \ R-A2 corroboration NOT cleared (4.2x above);\nR-C2 falsification NOT cleared (2.4x\
  \ below). Substantive and mechanical\nagree \u2014 this is the first arbiter verdict\
  \ in the workflow without\nmechanical/substantive gap (Q1 R-D vs R-C, eigenmodes-v1\
  \ O2 vs O3,\nP1 mechanical-AMBIGUOUS vs substantive-tautology). The registered\n\
  ambiguous band absorbed the realization cleanly.\n\nThree findings of substantive\
  \ importance the verdict carries:\n\n1. ALL THREE RICHER FAMILIES NEARLY IDENTICAL.\
  \ chi^2_M3 = 953.84,\n   chi^2_M4 = 965.81, chi^2_M5 = 966.60. The full M3-to-M5\
  \ spread is\n   13 chi^2 units, ~1.4% of any of the three. The 95% bootstrap CIs\n\
  \   overlap massively. The SIMPLEST richer family (M3, mixture-2-Gaussian,\n   3\
  \ shape parameters per day-type) BINDS as preferred. Both forecasters\n   predicted\
  \ KDE would be preferred (DA: \"KDE has thousands of effective\n   degrees of freedom...\
  \ well within KDE's flexibility envelope\";\n   proponent: \"non-parametric, library-size\
  \ ~5000 samples... will absorb\n   whatever distributional shape\"). Observed: KDE\
  \ is the WORST of the\n   three by 0.8 chi^2 units, indistinguishable from M3.\n\
  \n   This is the proponent's what_would_change_my_mind item #4 verbatim:\n   \"\
  If all three families produce nearly identical chi^2 within bootstrap\n   CI overlap,\
  \ the distributional class beyond Student-t is irrelevant\n   and the residual gap\
  \ is purely non-distributional - this would also\n   support routing to Q2B-class\
  \ investigations, but on stronger grounds\n   than (b)/(c) above.\" This condition\
  \ has materialized. The substantive\n   reading of R-B2 is therefore stronger than\
  \ its mechanical content:\n   not just \"richer families help but do not fully calibrate,\"\
  \ but\n   specifically \"additional distributional flexibility beyond a 2-component\n\
  \   symmetric mixture buys negligibly little, so the remaining gap is\n   unlikely\
  \ to yield to further distributional richness.\"\n\n2. DAY-TYPE ASYMMETRY DOMINATES\
  \ THE POOLED PATHOLOGY. Per-day-type\n   chi^2 recomputed from the pickle (see numerical_record):\n\
  \     weekday:   270-300       (close to gate ceilings; family-indistinguishable)\n\
  \     sunday:    545-575       (mid-range; family-indistinguishable)\n     saturday:\
  \  1165-1185     (~4x weekday; family-indistinguishable)\n   The pooled ~950 figure\
  \ is the n-weighted average of these. If\n   weekday alone were the population (n=8568\
  \ of 12000), pooled chi^2\n   would be in the 270-300 range \u2014 much closer to\
  \ the R-A2 corroboration\n   bar. Saturday is the binding problem; n=1728 of 12000\
  \ (~14%) but\n   contributes ~30% of the pooled chi^2. This corroborates eigenmodes-v1's\n\
  \   SETTLED finding (S2/S3) that weekday/weekend asymmetry is structural\n   rather\
  \ than library-noise. The asymmetric structure is family-invariant\n   under richer\
  \ parametric and non-parametric lifts, which means it is NOT\n   a distributional-shape\
  \ mismatch \u2014 consistent with finding #1.\n\n3. Q1 -> Q2A REDUCTION IS MARGINAL.\
  \ M0 (Gaussian) -> M1 (Student-t):\n   22329 -> 1371, a 16x reduction. M1 -> richer\
  \ family best: 1371 -> 954,\n   a 1.44x reduction. The first kernel-family lift\
  \ extracted most of the\n   distributional-class signal that's there to extract;\
  \ the second lift\n   (Student-t to mixture/non-parametric) extracts a fraction.\
  \ Diminishing\n   returns curve: extra parameters buy proportionally less. Combined\
  \ with\n   finding #1, the curve is essentially asymptoting at ~950 chi^2.\n\nCalibration:\
  \ proponent right on outcome category (R-B2 + their\nwhat_would_change_my_mind #4\
  \ verbatim) but wrong on quantitative central\nforecast (overshot CI upper bound\
  \ by 5.4%, observed effective_chi2 in\nthe upper end of their forecast spread).\
  \ DA wrong on outcome category,\nmagnitude (5x), CI (2.7x outside upper bound),\
  \ and family preference.\nProponent decisively closer to truth.\n"
