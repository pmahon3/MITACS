notes_for_arbiter: "Check R: PASS. All 17 phase_a dependent variables present in result.yaml\n\
  (14 in primary_result, 3 per-cell arrays in secondary_results). Primary\nmetric\
  \ definition matches phase_a verbatim. ci_method matches\n(paired_day_bootstrap\
  \ n=1000). Shape outcomes evaluable from numerics\nalone; primary_result.outcome_verdict\
  \ = R-C3 derivable independently.\n\nday_type stratification: per phase_a, the three\
  \ per_h_day_type_* arrays\nARE in variables.dependent and ARE reported (PASS). The\
  \ \"chi^2_after_fix[m]\nstratified by day_type\" phrase in phase_a's metric prose\
  \ is a registered\nSECONDARY observation, not in variables.dependent; recoverable\
  \ from the\npickle but not tabulated in result.yaml. Same posture as Q2A's per-day-type\n\
  chi^2 (Q2A Check R: PASS-WITH-NOTE). NOT a Check R deficiency.\n\nSubstantively\
  \ notable content the arbiter should surface (derivable from\nreported numerics\
  \ alone):\n  1. ALL three explained_shares well below the R-A3 dominance bar (0.50)\n\
  \     and the R-A3-or-R-B3 threshold (0.15). R-C3 fires by the strictest\n     interpretation:\
  \ no pre-registered mechanism captures even 15% of\n     the gap.\n  2. TWO of three\
  \ shares are NEGATIVE (variance_div = -0.114, seam =\n     -0.139). Negative share\
  \ = the mechanism's \"fix\" made chi^2 WORSE.\n     This is informative beyond mere\
  \ R-C3 firing: the pre-registered\n     mechanism candidates are not just inadequate,\
  \ two of them actively\n     degrade calibration when ablated as defined.\n  3.\
  \ The variance_cap (one-sided: only scales DOWN when iter > emp)\n     has a negative\
  \ share because the SMC ensemble variance is typically\n     LESS than the empirical\
  \ variance (visible in the two secondary_results\n     arrays - compare per_h_day_type_smc_ensemble_variance\
  \ to\n     per_h_day_type_empirical_variance, almost entirely SMC < empirical).\n\
  \     The mechanism as defined is dominated by under-dispersion. A\n     two-sided\
  \ variance rescale would be a different test.\n  4. The seam mechanism (REGISTERED\
  \ NULL per phase_a) confirms\n     non-trivially: the seam-domain row exclusion\
  \ makes the marginal\n     MORE pathological. Consistent with \"production already\
  \ handles\n     the seam properly; restricting aggregation on top adds noise.\"\n\
  \  5. Day-type pattern in per_h_day_type_empirical_mean_bias arrays:\n     saturday\
  \ has the deepest empirical bias trough (-0.997 at h=8)\n     and the longest sustained\
  \ negative-bias period; weekday and sunday\n     have shallower troughs. Strong\
  \ saturday signal, consistent with\n     Q2A Finding #2 (saturday 4x weekday chi^2).\n\
  \nProvenance note: result.yaml carries git_clean: false because the\ninline registry.stamp()\
  \ at script run time fired when the sibling\nCLAIM-GRADE .txt was freshly written\
  \ and untracked. Q2A used a\nseparate post-write stamping commit which is why Q2A's\
  \ result.yaml\nhas git_clean: true. The canonical cleanliness witness for the\n\
  artifact is the .txt's own make_result() header which records\ngit_clean: true at\
  \ git_sha 194468a (the script-fix commit, parent\nof the re-run commit eb34beb).\
  \ The .txt's inputs_fingerprint\n986abee0aaaad1bf... references the correct post-sign-fix\
  \ phase_a\nhash 91f69aeb (which result.yaml also references). Registry verify\n\
  reports chain verified post-eb34beb. result_from_clean_tree is true\nin substance;\
  \ the git_clean: false in result.yaml is the inline-stamp\npattern, not a tree-state\
  \ defect. Arbiter records\nresult_from_clean_tree: true with this caveat.\n\nArbiter\
  \ precondition fidelity_coverage_passed: true.\n"
