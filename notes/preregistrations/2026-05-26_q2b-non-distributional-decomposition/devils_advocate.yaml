what_would_change_my_mind:
- If mech_1 explained_share > 0.65 with tight CI (lower bound > 0.50), the z-space attenuation concern is empirically minor and the proponent's MW-space-to-z-space translation assumption holds. The day-type-asymmetry concern (failure mode 3) would also be subordinated since mech_1 evidently absorbs it at the aggregate.
- If R-A3 fires for mech_2 (mech_2 > 0.50 AND > 2x mech_1), the iterated-variance-divergence mechanism dominates and my prediction is wrong on direction (which mechanism dominates) but right on category (no, actually wrong on both; R-A3 vs R-B3). However, this would validate my underlying concern that the proponent under-weighted mech_2.
- If chi2_baseline_M3 self-consistency check fails (Q2B re-run does not match Q2A's 953.84 within bootstrap CI overlap), the verdict is BLOCKED regardless of outcome category. The disagreement on shares would be moot.
opportunity_cost:
  alternative: 'A z-space-to-MW-space sensitivity quantification of the clim-gap-nonstationary signal (one-shot computation: what is the empirical_mean_bias in z-space, computed directly from post-cutoff data, and how does its magnitude compare to the iterated SMC standard deviation at each (h, day_type)?) would have been cheap (no SMC propagation needed) and would have grounded the proponent''s translation assumption in a single empirical number. Pre-registering Q2B without this number means the proponent''s dominance forecast is speculative on a quantity easily measured.'
  ranking: complementary
  notes: The pre-registration is well-formed AS WRITTEN. The opportunity cost is a one-shot insight that would have informed forecast width without changing the experiment design; Q2B produces the empirical_mean_bias matrix as a side product, so the question is answered by Q2B's secondary outputs even if the central verdict is on explained_share.
