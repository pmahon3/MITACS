strongest_argument: 'The proponent''s central claim - that the +1000 MW MW-space gap translates to a dominant (~0.75) z-space mech_1 share - hinges on a translation step the proponent does not justify. The MW-space gap in mitacs-clim-gap-nonstationary is on the REGISTERED PREDICTOR (full demand iteration through forecast = mu + sigma*z_next). The Q2B kappa_1 marginal is in z-space, standardized against a FIXED pre-cutoff climatology that does not see the post-cutoff drift. The kappa_1 INNOVATION is the variable being PIT-evaluated, not the full demand forecast; a +1000 MW MW-space drift maps to a z-space first-moment offset of roughly 1000/sigma_clim ~ 0.3-0.5 standard deviations (sigma_clim ~ 2000-3000 MW depending on hour). This is non-trivial but attenuated relative to the proponent''s implicit assumption that the MW-space dominance translates 1-to-1 to z-space chi^2 dominance.


  Second, Q2A''s Finding #2 (Saturday chi^2 ~ 4x weekday chi^2, family-invariant across M1/M3/M4/M5) indicates day-type-specific structure that survives every distributional family tested. This structure could be EITHER a mean-bias asymmetry (Saturday''s empirical_mean_bias differs from weekday''s by more than mech_1''s per-day-type subtraction can absorb at the aggregate marginal level) OR a variance-divergence asymmetry (Saturday''s iterated SMC variance compounds differently due to lower-data-density library cells). Either way the day-type pattern is unlikely to be fully captured by mech_1 alone; mech_2 is plausibly capturing structurally distinct content.


  Third, the iterated heavy-tailed variance over h=24 under M3 mixture-2-Gaussian is non-trivial by construction. M3''s symmetric two-component centred mixture has higher per-step kurtosis than Gaussian; iterated over 24 steps the central limit pull toward Gaussian competes with the per-step kurtosis injection, and the resulting iterated marginal variance can substantially exceed the empirical (which is the actual residual against actuals, not against a forecast trajectory). Mech_2''s variance-cap is one-sided (only fires when sigma2_iter > sigma2_empirical), so when it fires it does real attribution work; I forecast it captures roughly 0.35 of the gap.


  Net: R-B3 fires with mech_1 ~ 0.40 and mech_2 ~ 0.35, neither dominant under the > 2x clause. Mech_3 ~ 0.02 (registered null holds; near zero but not exactly zero due to small library-composition noise at the seam boundary).'
