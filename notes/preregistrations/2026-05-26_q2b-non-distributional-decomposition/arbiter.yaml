verdict: R-C3
verdict_reasoning: "Mechanical verdict per phase_a.shape_outcomes.R-C3: R-C3 fires. max_m explained_share[m] = 0.109 (mean_bias)\
  \ < 0.15. None of the three pre-registered mechanisms (iterated mean trajectory bias subtraction, iterated variance one-sided\
  \ cap, day-anchor-seam aggregation-domain restriction) captures more than 15% of the gap between Q2A's settled chi^2_M3\
  \ baseline (953.84) and the R-A2 corroboration cut (228.44).\n\nSubstantive findings the verdict carries (the verdict is\
  \ R-C3 + the below; the negative-share content makes the substantive reading stronger than the mechanical reading rather\
  \ than weaker as in Q1 and P1):\n\n1. R-C3 FIRES ON POINT ESTIMATE BUT UNDERPOWERED ON THE LEADING MECH.\n   The 95% paired-day-bootstrap\
  \ CI on explained_share_mean_bias is\n   [-0.39, +0.74]. This CI spans all three outcome categories: it\n   includes R-C3\
  \ (below 0.15), R-B3 (in [0.15, 0.50]), AND R-A3\n   (above 0.50). The point-estimate verdict R-C3 is what the\n   pre-registered\
  \ criterion specifies, but a CI-based interpretation\n   alone cannot discriminate 'the pre-registered mechanism set is\n\
  \   wrong' from 'the pre-registered mechanism set is right and\n   underpowered.' The verdict rests on the conjunction of\
  \ (a) the\n   mean_bias point estimate sitting just below the 0.15 threshold,\n   AND (b) the two sign-determined negative\
  \ shares (variance_div CI\n   [-0.22, -0.01], seam CI [-0.17, -0.09]) which DO discriminate.\n   Per arbiter.md ('If the\
  \ proponent's forecast was within the\n   ambiguous region from the start, the experiment was underpowered'):\n   the proponent's\
  \ forecast (R-A3 at mech_1 share 0.75) was outside\n   the ambiguous region but the realized CI on mech_1 is broad. Future\n\
  \   ablation designs should either (i) tighten the CI (more days, more\n   particles, less noisy attribution definitions)\
  \ or (ii) define\n   mechanisms whose share is naturally sign-determined.\n\n2. NEGATIVE SHARES ON MECH_2 AND MECH_3 ARE\
  \ STRONGER THAN MERE\n   INADEQUACY. The mechanical R-C3 criterion ('no mechanism captures\n   > 15% of the gap') would\
  \ be satisfied by small-positive shares; the\n   realized variance_div share -0.114 and seam share -0.139 (both\n   sign-determined\
  \ at 95%) mean the corresponding ablation fixes\n   actively MADE CHI^2 WORSE. The mechanism candidates are not just\n \
  \  the wrong size, they are mis-specified at the construction level.\n   The mechanistic reasons:\n\n   (2a) variance_div:\
  \ per_h_day_type_smc_ensemble_variance <\n        per_h_day_type_empirical_variance at virtually every (day_type,\n    \
  \    h) cell. The SMC ensemble UNDER-disperses relative to actuals.\n        The mech_2 fix is a ONE-SIDED CAP (rescale\
  \ toward ensemble\n        mean only when sigma2_iter > sigma2_empirical). In a regime\n        where sigma2_iter < sigma2_empirical\
  \ at almost all cells, the\n        cap almost never fires correctly, and at the minority of cells\n        where it does\
  \ fire the data is in the tail where shrinking\n        an already-under-dispersed ensemble further degrades coverage.\n\
  \        The correct mechanism is a TWO-SIDED variance rescaling that\n        ALSO scales up when sigma2_iter < sigma2_empirical,\
  \ addressing\n        the dominant under-dispersion direction. The Q2B-as-specified\n        cap mechanism asks the wrong\
  \ question.\n\n   (2b) seam: REGISTERED NULL confirmed with sign. Production already\n        excludes seam-crossing iteration\
  \ via _complete_delivery_days;\n        layering an additional aggregation-domain row exclusion on the\n        already-clean\
  \ output removes valid PIT samples and adds\n        aggregation noise. Realized -0.139 confirms the production\n      \
  \  seam handling is correct and the layered diagnostic is\n        redundant. The seam result is not a finding about the\n\
  \        marginal pathology, it is a finding about diagnostic\n        construction (and ratifies the proponent's expectation\
  \ that\n        mech_3 ~ 0; the negative direction is a feature, not a bug).\n\n3. MECH_1 IS DIRECTIONALLY CORRECT BUT WEAKER\
  \ THAN EITHER FORECASTER\n   ANTICIPATED. The mean_bias share is the only positive of the three\n   and the only one above\
  \ zero in point estimate. The proponent's\n   clim-gap-nonstationary translation (MW-space +1000 MW gap maps to\n   z-space\
  \ first-moment offset absorbed by mech_1 subtraction) is\n   not refuted in DIRECTION, only in MAGNITUDE: mech_1 does real\
  \ work\n   (positive share) but the work is much smaller than the proponent's\n   0.75 dominance forecast. The DA's z-space\
  \ attenuation concern\n   (failure mode #1, likelihood 0.45) is the closer of the two\n   priors to truth: the MW-space\
  \ gap does not translate 1-to-1 to\n   z-space chi^2 dominance. The clim-gap-nonstationary signal\n   contributes < 15%\
  \ of the gap as bounded by aggregate per-(h, day_type)\n   subtraction; richer subtraction designs (state-dependent, smoothed,\n\
  \   weather-conditioned) may capture more but the aggregate ceiling at\n   ~0.11 share is a substantive upper bound on what\
  \ aggregate mean-bias\n   ablation alone can do.\n\n4. PIPELINE INTEGRITY CONFIRMED. The self-consistency baseline check\n\
  \   (Q2B M3 chi^2 = 961.96 vs Q2A settled M3 = 953.84) lands at\n   delta 8.12 well inside the 50.0 tolerance and inside\
  \ the Q2A\n   bootstrap CI [685, 1357]. The Q2B re-fit of Q2A's M3 baseline\n   reproduces the upstream settled number to\
  \ better than 1%. Q2A-Q2B\n   pipeline drift is not a concern; the Q2B verdict is not blocked\n   by upstream pipeline integrity.\n\
  \nCalibration: BOTH forecasters wrong on the outcome category (proponent\nR-A3, DA R-B3, realized R-C3). On mech_1 share\
  \ magnitude DA closer\n(residual 0.29 vs proponent 0.64); on outcome category neither was\nright but the proponent's what_would_change_my_mind\
  \ condition #2\n('If R-C3 fires...') explicitly named R-C3 as a possible reading and\nthat concession is now triggered.\
  \ The negative-share content is the\nsubstantive surprise: neither forecaster predicted that any mechanism\nablation would\
  \ actively degrade calibration, even though both could have\nanticipated the under-dispersion direction from the same SMC\
  \ ensemble\nvariance arrays that result.yaml reports as secondaries. This is a\ndecomposition-design lesson, not a forecasting\
  \ failure."
