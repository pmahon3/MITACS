  threshold_derivations: "Numeric thresholds (X=0.50 dominance, Y=0.15 null) are NOT derived from a synthetic gate (unlike Q2A's gate-derived 228.44 and 2284.44). They are set on non-data principled bases:\n\
    \  X=0.50: formal threshold for dominance (top mechanism > sum of all others); the > 2x next clause enforces clear separation from 50/50.\n  Y=0.15: generous noise floor above the seam mechanism's REGISTERED\
    \ NULL expected ~0 share. If mech_3 reads > 0.15 the production seam handling has a leak; the 0.15 floor is the same bar applied to mech_1 / mech_2 so R-C3 fires iff none of the three captures > 15%\
    \ of the gap.\nchi2_baseline = 953.84 from Q2A SETTLED finding (mitacs-q2a-richer-family, M3 point estimate).\nR-A2 corroboration cut = 228.44 from Q2A pre-registered gate (gate body_sha256 2bab514e...,\
    \ binding cell V3_rho10 KDE kurt=12, gate-validated under variant-max conservative rule).\nDenominator 725.40 = 953.84 - 228.44 is frozen for all explained_share computations including per-bootstrap-resample\
    \ evaluations."
