what_would_change_my_mind:
- If mech_1 explained_share < 0.30, the MW-space +1000 MW gap does not translate cleanly to z-space chi^2 contribution. The clim-gap-nonstationary signal is in MW-space and the kappa_1 marginal is in z-space; the proponent assumes a roughly direct translation, but the standardization step may attenuate it more than expected.
- If R-C3 fires (all shares < 0.15), none of the three pre-registered mechanisms is the right level of decomposition. The substantive non-distributional content lives in covariates outside the Q2B candidate set (weather, state-space dimension, day-type partition refinement) and the thread needs amendment for a richer mechanism set.
- If mech_2 explained_share > mech_1 explained_share, iterated variance divergence is doing more work than the proponent's first-moment-dominant prior expects. Picture (C) may have a second-moment failure mode the proponent under-weighted.
- If mech_3 explained_share > 0.10, production seam handling has a leak and the Q1/Q2A results need re-audit; the diagnostic is then informative beyond Q2B's primary verdict.
