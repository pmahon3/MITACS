  reasoning: 'Three lines of evidence converge on R-A3 with mech_1 dominant at share ~ 0.75 and chi2_after_mean_bias_fix ~ 409.


    (a) The prior cited in mitacs-clim-gap-nonstationary is load-bearing here: the post-cutoff actual-mu gap on the registered predictor is approximately +1000 MW HOUR-FLAT and growing through 2025-2026, with no recency-window choice closing it. This is a first-moment offset in the iterated forecast trajectory by construction; the operator''s sigma*z_next contribution carries the diurnal shape but cannot compensate for a flat MW-space bias of that magnitude. In z-space (kappa_1''s representation) this maps to a systematic mean offset of order sigma_iter*z (where sigma_iter is the iterated SMC standard deviation), which is precisely what mech_1''s empirical_mean_bias subtraction targets. Subtracting per-(h, day_type) empirical mean bias is an upper-bound attribution on this driver and should account for the majority of the residual chi^2 above the R-A2 cut.


    (b) Q1 (S8d, mitacs-q1-student-t-vs-gaussian) established that heavy-tailedness lives in the kappa_1 INNOVATION, not the seasonal climatology (M1 outperformed M2 in Q1). The iterated SMC variance under M3 mixture-2-Gaussian compounds the per-step kappa_1 innovation variance over horizon h; this is non-trivial but well-behaved (no random-walk explosion at h=24 since the C_1 drift is contractive in expectation). Mech_2''s variance cap targets only the upper tail of iterated variance dispersion; I forecast its share around 0.15 - it does real work where iterated variance modestly exceeds empirical, but does not dominate.


    (c) Production already excludes seam-crossing iteration via _complete_delivery_days (see processing/innovations/estimator.py line 763 docstring confirming day_anchor_hour mask kwarg was removed). Mech_3 layers a redundant aggregation-domain filter; its expected share is ~0 by construction. If it reads > 0.05, there is an undetected seam leak in production and the diagnostic is itself informative; I forecast 0.0 (no leak).'
