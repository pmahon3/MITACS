nodes:
  Q1:
    id: Q1
    name: student-t-vs-gaussian-on-marginal-PIT
    notes: "Secondary tests (informational, not part of the verdict):\n\n(a) Empirical\
      \ nu estimates per day-type. nu < 10 means\n    heavy-tailed is empirically\
      \ required and propagates to all\n    future kernel-family decisions.\n\n(b)\
      \ The Student-t analogue of D_RATIO at the v2 headline cell\n    (h=12, weekday),\
      \ computed by SMC particle propagation of\n    M1's kernel and Wasserstein-2\
      \ (or sample-based KL) between\n    iterated and directly-fit kernels. Tests\
      \ whether v2's\n    D_RATIO = 28.96 finding survives the kernel-family lift.\n\
      \    If D_RATIO_t shrinks to ~1, part of v2's signal was a\n    Gaussian-projection\
      \ artifact. If it stays >= 5, picture (C)\n    survives the lift and the seed's\
      \ working hypothesis is\n    independently corroborated.\n\nSynthetic gate:\
      \ a known Student-t-VAR system (generator\n(L, Q, nu_true) producing finite-variance\
      \ heavy-tailed data).\nM0 (Gaussian) should fail marginal PIT on the synthetic;\
      \ M1\nand M2 should pass. Calibrates the test's discriminating power\nbefore\
      \ any Ontario result is examined.\n"
    parent_branch: null
    parent_id: null
    phase_a_path: 2026-05-26_q1-student-t-vs-gaussian/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - M0_gaussian_baseline
      - M1_student_t_kernel_only
      - M2_student_t_full_commitment
      metric_class: "Three nested models compared on post-cutoff Ontario data:\n \
        \ M0: Gaussian (the registered predictor; null baseline)\n  M1: Student-t\
        \ kernel with one global nu per day-type;\n      location and scale fit as\
        \ for M0\n  M2: Student-t with full kernel-family commitment:\n      (mu_{m,h},\
        \ s_{m,h}, nu_{m,h}) fit per (month, hour-of-day)\n      bin via Student-t\
        \ MLE for the climatology, plus the M1\n      kernel for the operator.\nIteration\
        \ of M1/M2 kernels is via SMC particle propagation\n(M=200, matching existing\
        \ distributional_smc infrastructure).\nPrimary metric: chi^2_{10-bin} of the\
        \ post-cutoff marginal PIT\nunder each model.\n"
      outcome_categories:
      - R-A: marginal_PIT_chi2 <= 30 under M1 or M2 (Gaussian was the marginal problem;
          fixed by heavy-tailed kernel)
      - R-B: marginal_PIT_chi2 in (30, 500] under M1/M2 (Student-t helps but doesn't
          fully calibrate; richer family needed)
      - R-C: marginal_PIT_chi2 > 500 under both M1 and M2 (Student-t does not absorb
          S5; missing content not distributional class)
      - R-D: 'MLE pathological IFF the M1 (kernel) fit shows nu at boundary OR fewer
          than 50% of M2 bins have a meaningful nu (< 200); under this revised criterion
          Q1''s verdict would have read R-C (substantive). Original text (pre-amendment
          A1): ''MLE fit pathological (nu outside (2, 1000) or convergence failure);
          redesign''.'
      skeleton_thresholds_depend_on:
      - field: null
        rule: 'Q1 is the thread''s root; thresholds are pre-registered

          standalone (chi^2 thresholds 30 / 500 derived from

          critical-value scaling: 30 is roughly twice the 95%

          critical value of 16.92; 500 is the order-of-magnitude

          boundary between "improved" and "still pathological").

          '
        source: null
    status: settled
  Q2A:
    id: Q2A
    name: richer-family-mixture-or-nonparametric
    parent_branch: R-B
    parent_id: Q1
    phase_a_path: 2026-05-26_q2a-richer-family-mixture-or-nonparametric/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - mixture_2_gaussians
      - mixture_3_gaussians
      - kde_residual_law
      metric_class: 'If Q1 fires R-B (Student-t helps but doesn''t fully calibrate),

        the missing distributional flexibility is beyond a single nu.

        Test two richer families: (i) finite-mixture of Gaussians

        with state-dependent component weights; (ii) non-parametric

        predictive law via SMC with a kernel-density-estimated

        residual law.

        '
      outcome_categories:
      - R-A2: chi^2 < 30 under one of the richer families
      - R-B2: chi^2 in (30, 500] (further distributional richness still needed)
      - R-C2: chi^2 > 500 (the marginal pathology is non-distributional; loop back
          to state-space content)
    reopened_by_amendment: A1
    status: settled
  Q2B:
    id: Q2B
    name: non-distributional-marginal-pathology-investigation
    parent_branch: R-C
    parent_id: Q1
    phase_a_path: 2026-05-26_q2b-non-distributional-decomposition/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - iterated_mean_trajectory_bias
      - iterated_variance_divergence
      - day_anchor_seam_artifact
      metric_class: 'If Q1 fires R-C (Student-t does not absorb the marginal

        pathology at all), the chi^2 = 22329 has a non-distributional

        cause. Candidates: (i) the iterated mean is systematically

        biased (mean trajectory drifts from actuals so far that NO

        Gaussian or Student-t predictive scale could cover them);

        (ii) the iteration itself is divergent at large h (sample

        variance explodes); (iii) the cross-day-anchor seam masks

        a hidden cause. Test each via diagnostic decomposition of

        the iterated forecast trajectory vs actuals trajectory

        on a representative subset of post-cutoff days.

        '
      outcome_categories:
      - R-A3: one mechanism dominates and is fixable independent of kernel family
      - R-B3: multiple mechanisms contribute; no single fix suffices
      - R-C3: marginal PIT is irreducibly pathological; question reframes
    reopened_by_amendment: A2
    status: settled
  Q2D:
    closure_reason: "Closed under amendment A1. Mechanical advancement S1 routed Q1.R-D\
      \ -> Q2D (MLE redesign), but the substantive arbiter verdict was R-C: the M2\
      \ \u03BD-saturation that tripped the R-D criterion was the Student-t MLE's correct\
      \ response to approximately-Gaussian bin-level data, not estimator failure.\
      \ Q2D (MLE redesign) would have rebuilt a working estimator. The substantive\
      \ routing per the revised R-D criterion is R-C -> Q2A (richer family)."
    id: Q2D
    name: redesign-Q1
    parent_branch: R-D
    parent_id: Q1
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - student_t_mle_with_nu_bounded
      - student_t_bayesian_posterior_mean
      - student_t_method_of_moments_fallback
      metric_class: 'If Q1 fires R-D (MLE pathological), the Student-t fit was

        misconfigured. Redesign Q1 with corrected fit procedure

        (constraint on nu range, alternative MLE algorithm, or

        Bayesian regularization). This is a methodology amendment,

        not a substantive next step.

        '
      outcome_categories:
      - any_converges_returns_to_Q1_with_corrected_fit
    status: closed
