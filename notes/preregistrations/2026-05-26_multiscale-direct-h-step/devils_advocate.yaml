strongest_argument: "The directly-fit h-step factor C_h is an OLS coefficient relating z(t) to z(t+h) at the d=2 embedding. As h grows, z(t) and z(t+h) decorrelate (the AR(2) on z has all eigenvalues less than 1 \u2014 the production rebaseline confirms global OLS is what is run). The OLS slope collapses to zero plus noise at large h. Sigma_h correspondingly saturates at the unconditional variance of z. The iterated factor P_1^h Sigma_1 P_1^(h-1)^T does the same thing \u2014 but more slowly. So the iterated and directly-fit Sigma_h converge to the same number from different directions, and the seed's \"iteration underestimates\" prediction has the wrong sign at large h. At small h the iterated covariance may be larger than the direct one, not smaller. The seed's mechanism is plausible at intermediate h, but the sign of the inequality flips somewhere in the range. Empirically, M2 may be near 1, or even below 1.\n"
