reason_substantive: 'Mechanical and substantive verdicts AGREE on the R-B1B category firing. The substantive picture STRENGTHENS the mechanical reading (hence the `_SUBSTANTIVE_FAVORABLE` suffix): the realized
  data is MORE INFORMATIVE than R-B1B alone suggests, in a direction the mechanical category cannot capture.


  The central substantive finding: Z2 (time_of_day) delivered 290.29 chi^2 of cumulative reduction above Q1A''s Z_c carryforward — 40.07% of the remaining gap-to-close to R-A1B, and 218× Q1A''s reduction
  in absolute chi^2 units. Cumulative CI [8.06, 484.42] is sign-determined positive at 95% (lower bound positive, albeit narrowly). Reproduction checks at BOTH anchors (Q2A no-Z baseline and Q1A Z_c-only
  baseline) are EXACT — the fitting machinery is bit-identical at the endpoints. The inline synthetic gate validates per-cell parameter recovery + per-cell PIT chi^2 on a known Z2-conditional DGP, and the
  false-Z2 companion check confirms collapse to the Z_c-only marginal under randomized Z2 labels (so the machinery does not artificially shrink chi^2 from a noise label). The 290 chi^2 closure is a real
  signal, not an artifact.


  The framework-reading sharpening (binding): joint S9+S10+S11+S12 was read in Q1A''s arbiter and S3 thread notes as "within-data sigma-algebra-enrichment levers are empirically bounded at the ~0.18%-of-gap
  scale." Q1B refutes that reading AS-STATED. The sharpened reading: SINGLE-AXIS within-data sigma-algebra enrichment IS bounded near zero (Q1A delivered 0.18%); JOINT multi-axis within-data conditioning
  recovers MEANINGFULLY MORE (Q1B delivered 40.1% on top of Q1A''s carryforward). Full closure to R-A1B is NOT achieved within the time-index alone (cumulative point 662 is 2.9x above R-A1B cut 228; lower
  CI 468 is 2.05x above), so the identifiability obstruction at the FULL CLOSURE level remains a candidate reading; but the within-data lever space is RICHER than single-axis P1 ranking suggested. Cross-axis
  joint stratification is the within-data direction the framework reading should now incorporate.


  Per-cell chi^2 decomposition exactly corroborates P1 at finer resolution. Q1A''s dominant saturday__zc6 cell (chi^2 = 1634) splits across time_of_day strata as morning_ramp (967.28) > evening (399.77)
  > afternoon (328.09) — sum 1695, comparable to Q1A''s 1634. The morning_ramp sub-stratum within saturday__zc6 alone exceeds the pooled Q1B marginal (662.22) by 46%, meaning the chi^2 mass is concentrated
  in a single (day_type, Z_c, Z2) cell at finer resolution than P1''s axis-by-axis range analysis exposed. P1''s alpha_L = 0.61 stratum is structured by within-day phase; the M3 family''s capacity is bound
  within saturday__zc6 at the morning_ramp axis specifically. This is genuinely new structure exposed by the joint (Z_c, Z2) sigma-algebra that single-axis P1 ranking could not isolate.


  Head-to-head is a NEAR-TIE matching DA''s SHAPE prediction (chi2_diff = +33.78, paired SE = 44.71, |diff|/SE = 0.756 < 1.0; CI [-53.19, +124.47] straddles zero). Per phase_a.metric NEAR-TIE rule, the
  head-to-head sub-finding records "NO STATISTICALLY-DISCERNIBLE WINNER between Z2_b and Z2_c". Z2_c (4-level categorical per P1''s production binning) wins at point estimate by +33.78 chi^2; this matches
  proponent''s WINNER DIRECTION (Z2_c) and contradicts DA''s WINNER DIRECTION (Z2_b) at point but neither side''s direction is statistically distinguishable from no-ranking. The result is therefore a mixed
  scoring across forecast surfaces (see calibration_record below).'
