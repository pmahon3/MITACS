verdict_reasoning: 'Mechanical verdict per phase_a.shape_outcomes: R-B1B fires unambiguously (better_chi2 = min(chi2_Z2_b=696.0, chi2_Z2_c=662.22) = 662.22, paired-day bootstrap 95% CI [468.09, 944.45];
  both point estimate and the full CI sit inside the registered (228, 2284] band — lower CI bound 468 is ~2.05x clear of R-A1B on the low side, upper CI bound 944 is ~2.42x clear of R-C1B on the high side).
  proponent forecast R-A1B at 180 [90, 450]; DA forecast R-B1B at 948 [620, 1340]. R-B1B wins on the registered outcome category; this matches DA mechanically. Per arbiter.md taxonomy mapping this would
  label DEVILS-ADVOCATE-CONFIRMED on outcome-category, but per workflow precedent (Q2A R-B2, Q2B R-C3, Q1A R-B1A) the verdict label is the registered outcome category itself: R-B1B.


  Substantive findings (the verdict is R-B1B + the below; within-bucket detail is what makes outcome_substantive = R-B1B_SUBSTANTIVE_FAVORABLE):


  1. R-B1B FIRES UNAMBIGUOUSLY, NOT BORDERLINE. Both point (662.22) and full CI [468.09, 944.45] sit inside the (228, 2284] band — ~2.05x clear of R-A1B on the low side and ~2.42x clear of R-C1B on the
  high side. proponent''s R-A1B is decisively falsified: forecast chi2_min point 180 vs realized 662.22 is a 3.68x overshoot relative to forecast, and the entire forecast CI [90, 450] sits entirely below
  the realized lower CI bound 468. DA''s R-B1B outcome category is mechanically correct, but DA''s point forecast 948 also overshoots realized 662 by 43% and the realized CI [468, 944] sits almost entirely
  below DA''s forecast CI [620, 1340] (only the upper tails overlap). The realized value falls IN THE GAP between proponent''s and DA''s point forecasts (proponent 180 < realized 662 < DA 948); neither
  side''s forecast bracket contains it.


  2. Z2 DELIVERED A MATERIAL CUMULATIVE REDUCTION — 218× LARGER THAN Q1A''S. This is the substantively central finding. The Z_c-only baseline reproduces EXACTLY at q1b_zc_only_chi2 = 952.5167 vs Q1A settled
  952.5167 (|diff| = 3.3e-5, 9 orders of magnitude below tolerance). Adding Z2 (time_of_day, 4-level Z2_c) drops it to 662.22. Cumulative improvement above Z_c = 290.29 chi^2 units [8.06, 484.42]. The share
  of the gap-to-close from Q1A''s carryforward baseline = 290.29 / (952.5167 - 228) = 290.29 / 724.5167 = 0.4007 = 40.1%. The share from the Q2A no-Z baseline (953.84) = (953.84 - 662.22) / (953.84 - 228)
  = 291.62 / 725.84 = 0.4018 = 40.2%. For comparison, Q1A''s Z lever closed 0.18% of the gap (1.33 chi^2 units); Q1B''s Z2 lever closed 40.1% of the gap remaining after Q1A''s carryforward (290.29 chi^2
  units). This is 218× Q1A''s reduction in absolute chi^2 units, and ~220× as a share-of-gap. The S3 state-history pre-flag of EXHAUSTED-UNRESOLVED was premised on Q1B delivering "similar 0.18%-of-gap magnitudes"
  to Q1A; that premise is empirically contradicted. The pre-flag should be DOWNGRADED — Q1B''s realization is materially different from Q1A''s and the EXHAUSTED-UNRESOLVED reading is not the most natural
  substantive interpretation of this result.


  3. THE HEAD-TO-HEAD IS A NEAR-TIE (matching DA''s SHAPE prediction). chi2_diff = +33.78 with paired SE = 44.71 and CI [-53.19, +124.47] straddling zero. |chi2_diff| / SE = 0.756 < 1.0; per phase_a.metric
  NEAR-TIE rule, the head-to-head sub-finding records "NO STATISTICALLY-DISCERNIBLE WINNER between Z2_b and Z2_c". Z2_c (4-level categorical per P1''s time_of_day production binning) wins at point estimate
  by 33.78 chi^2 units, matching proponent''s WINNER DIRECTION (Z2_c). DA predicted Z2_b would win by 9 chi^2 — direction WRONG at point, but DA explicitly predicted near-tie shape (chi2_diff CI [-95, +75]
  straddling zero), which IS the realized regime. The shape matches DA exactly; the point-direction matches proponent. This is a clean instance of the workflow''s recurring decomposition pattern.


  4. PER-CELL CHI^2 DECOMPOSITION IS STRUCTURALLY COHERENT WITH P1 AT FINER RESOLUTION. Q1A''s dominant cell saturday__zc6 contributed chi^2 = 1634 alone (n=1296). Q1B splits this cell across time_of_day
  strata: saturday__zc6__z21 (morning_ramp) chi^2 = 967.28 (n=360), saturday__zc6__z22 (afternoon) chi^2 = 328.09 (n=432), saturday__zc6__z23 (evening) chi^2 = 399.77 (n=504). Sum = 1695.14, comparable
  to Q1A''s 1634 (the small overshoot is expected for joint stratification where cells get sharper assignments). The morning_ramp sub-stratum DOMINATES the within-cell chi^2 (967.28 vs 328.09 / 399.77),
  exceeding the pooled marginal 662.22 by ~46%. P1''s alpha_L = 0.61 stratum is genuinely structured by within-day phase; the M3 family''s capacity is bound within the saturday__zc6 hot zone at the morning_ramp
  axis specifically — the joint (Z_c, Z2) sigma-algebra reveals genuine sub-structure that hour_of_week alone could not resolve. The substantive picture corroborates P1 at finer resolution: the hot zone
  is NOT homogeneous across time_of_day strata.


  5. THE FRAMEWORK READING NEEDS SHARPENING. Joint S9+S10+S11+S12 was read (in Q1A''s arbiter and S3 thread notes) as "within-data sigma-algebra-enrichment levers are empirically bounded at the ~0.18%-of-gap
  scale." Q1B''s 40% closure refutes that reading AS-STATED, but does not refute the underlying identifiability obstruction picture. The sharpened reading: SINGLE-AXIS within-data sigma-algebra enrichment
  IS bounded near zero (Q1A); JOINT multi-axis within-data conditioning recovers MEANINGFULLY MORE — up to ~40% in two axes. FULL closure to R-A1B (228) is not achieved within the time-index — the cumulative
  point estimate 662 is still 2.9× above the cut, and the cumulative CI lower bound 468 is 2.05× above. Joint S9+S10+S11+S12 remains applied evidence for the identifiability obstruction at the full-closure
  level (auxiliary information may still be needed for full chi^2 closure), but the within-data lever space is RICHER than single-axis P1 ranking suggested. Cross-axis joint stratification is the within-data
  direction the framework reading should now incorporate.


  6. WHICH READING (A) OR (B)? Two competing substantive interpretations: (a) Joint multi-axis conditioning recovers structure that single-axis cannot; the within-data lever space was UNDER-EXPLORED. (b)
  The 290 chi^2 closure could be a per-cell over-fitting artifact masked by the false-Z2 companion (which verified that randomized Z2 labels collapse — but that test verifies the fitting MACHINERY, not
  over-fitting on TRUE Z2 labels). ADJUDICATION: (a) is the substantive reading, with the following evidence: (i) reproduction checks at both anchors are EXACT (Q2A 0.0033 |diff|; Q1A 3.3e-5 |diff|) — the
  machinery is bit-identical at the endpoints; (ii) the inline synthetic gate validates per-cell parameter recovery within tolerance AND per-cell PIT chi^2 well below ceiling on a known Z2-conditional DGP;
  (iii) the false-Z2 companion check confirms collapse to Z_c-only marginal under random labels, so the fitting machinery does not artificially shrink chi^2 from a noise label; (iv) the per-cell chi^2 ordering
  tracks P1''s alpha_L gradient at finer resolution (saturday__zc6 morning_ramp > evening > afternoon; sunday__zc7 morning_ramp dominates) — structure consistent with P1''s settled within-stratum ordering
  at the binding (hour_of_week) axis. The 290 chi^2 closure is a real signal, not an artifact. Reading (b) is empirically secondary; the per-cell sum=5019 vs pooled marginal=662 is the expected feature
  of joint stratification (cells get sharper assignments under the finer σ-algebra), not over-fitting in the noise sense.


  7. PROPONENT FORECAST IS DIRECTION-CORRECT ON WINNER (Z2_c) AND ON OUTCOME-CATEGORY-DIRECTION (R-A1B over R-B1B in the "informative direction") but DECISIVELY OVERSHOOTS ON MAGNITUDE. Proponent point
  180 vs realized 662 is a 3.68x overshoot; entire forecast CI [90, 450] sits below realized lower CI bound 468 — proponent''s R-A1B outcome category is decisively falsified. Proponent''s structural argument
  (within-cell orthogonality / M3 family-capacity relief via finer partition) is QUALITATIVELY CORROBORATED by the per-cell decomposition (morning_ramp IS the dominant sub-stratum within saturday__zc6,
  exactly as proponent predicted in their evidence_chain claim #3-#4), but proponent OVER-PREDICTED the magnitude of relief: the family capacity is RELIEVED ONLY PARTIALLY by the finer partition, not relieved
  completely. Per-stratum Z2_c chi^2 ordering: proponent forecast {overnight 15, evening 40, morning_ramp 60, afternoon 65} summing to 180. Realized per-stratum decomposition is harder to summarize at the
  same granularity (Z2_c levels mix across day_type + Z_c), but the dominant single cell is saturday__zc6__morning_ramp at 967.28 — orders of magnitude above proponent''s forecast morning_ramp pooled contribution.


  8. DA FORECAST IS POINT-DIRECTION-WRONG ON WINNER (predicted Z2_b; realized Z2_c at point) but SHAPE-CORRECT ON NEAR-TIE (predicted |diff| < SE; realized 0.756 SE) and OUTCOME-CATEGORY-CORRECT (predicted
  R-B1B; realized R-B1B). DA''s point forecast 948 overshoots realized 662 by 43% and the realized CI [468, 944] sits almost entirely below DA''s CI [620, 1340]. DA''s argument ("within-data σ-algebra-enrichment
  levers are asymptotically bounded; time_of_day is structurally coarser than hour_of_week so contributes ~Q1A magnitude") is qualitatively WRONG on magnitude (Q1B delivered 218x Q1A) but DA''s OUTCOME
  CATEGORY R-B1B is the mechanical match, validated unambiguously. DA''s rank-1 specific failure mode ("structural redundancy: time_of_day is a strictly coarser partition of within-day position than hour_of_week;
  Z_c already marginalizes over time_of_day within each cell") is empirically refuted: the joint (Z_c, Z2_c) sigma-algebra delivers 290 chi^2 of reduction that single-axis Z_c could not. The marginalization
  argument was theoretically natural but empirically wrong; the joint stratification does NOT degenerate to its single-axis components.


  9. THE SIXTH NAMED-FAILURE-MODE INSTANCE (NEW SHAPE VARIANT). Workflow precedent: 4th-named- failure-mode = registered criterion fires on legitimate-but-unanticipated data structure. Prior shapes (S8/Q1:
  R-D mechanical / R-C substantive; S9/Q2A: M3=M4=M5 chi²-indistinguishable; S10/Q2B: two sign-determined NEGATIVE shares; S11/P1: hour_of_week-not-season binding; S12/Q1A: near-tie head-to-head with DA
  Z_c forecast nearly exact at 0.3% residual). Q1B''s shape: MIXED SCORING DECOMPOSITION across forecast surfaces. Outcome category matches DA (R-B1B); near-tie shape matches DA; near-tie magnitude bracket
  exceeded by both forecasters; winner- direction matches proponent (Z2_c at point); per-cell within-stratum ordering matches proponent qualitatively but at magnitudes neither side predicted; cumulative-reduction
  magnitude (290 chi^2) sits ORDERS OF MAGNITUDE from both side''s implicit priors (proponent expected 772 chi^2 closure to R-A1B; DA expected ~5 chi^2 of Q1A-scale movement). The realized cumulative reduction
  is in a previously-uncharted regime that neither pre-registration anticipated. This is the sixth instance and the new shape variant is: "mechanical category matches one side, shape matches one side, direction
  matches the other side, magnitude matches NEITHER side; realized data sits in a regime neither side''s implicit prior contained."


  10. ROUTING: per phase_a.shape_outcomes.R-B1B.interpretation + thread branching_rules.Q1B.R-B1B = null. R-B1B does NOT auto-advance the thread state machine (no successor node mapped). Per thread root.closure_rule,
  "Q1A.R-B1A + Q1B.R-A1B with cumulative > 0.80 → RESOLVED" — Q1B did NOT fire R-A1B (it fired R-B1B), and the cumulative share = 290.29 / 724.5167 = 0.40 is BELOW the 0.80 closure threshold. The thread
  does NOT auto-resolve. CRITICAL FLAG for the thread-coordinator: the EXHAUSTED-UNRESOLVED pre-flag in S3 state-history was premised on Q1B''s magnitude being similar to Q1A''s 0.18%-of-gap; Q1B''s realized
  40%-of-gap (218x larger) REFUTES that premise. EXHAUSTED-UNRESOLVED should NOT auto-fire here; the appropriate substantive read is that the within-data lever space has more directions than single-axis
  P1 ranking suggested. The thread-coordinator''s post-arbiter decision space is to amend the thread with a third within-data Z (e.g., demand_quantile or season as third axis in joint stratification), OR
  spawn a new thread targeting cross-axis joint stratification more systematically, OR pivot to the temperature/exogenous-Z arm (still framework-prescribed for full closure). The arbiter records R-B1B mechanically
  + the cumulative-share 0.40 sub-finding + the framework-reading sharpening; the coordinator advances state with the realized data, NOT with the contradicted pre-flag.'
