  [468.09, 944.45]. Both the point estimate and the full CI lie inside (228, 2284] — lower CI bound 468 is 2.05x clear of R-A1B (cut at 228), upper CI bound 944 is 2.42x clear of R-C1B (cut at 2284). R-B1B
  fires unambiguously in both point and CI senses. R-A1B (corroboration: <=228) NOT cleared by any margin (realized lower CI 468 > 228); R-C1B (falsification: >2284) NOT cleared (realized upper CI 944 <
