notes_for_arbiter: "Check R: PASS. All 18 phase_a dependent variables present in the\n\
  result artifact (result.yaml sidecar + experiment/results/q1b_z2_conditioning.txt).\n\
  Primary verdict statistic better_chi2 = 662.2233333333334 matches phase_a metric\n\
  definition exactly. ci_method matches (paired_day_bootstrap n=1000, 95% percentile).\n\
  Shape outcomes evaluable: R-B1B fires unambiguously (better_chi2 in (228, 2284],\n\
  both CI bounds inside the same band). Code-path PRODUCTION-PATH; inline synthetic\n\
  gate cleared; BOTH reproduction checks exact to 4+ decimal places.\n\nSubstantively\
  \ notable content the arbiter should surface (all derivable from\nreported numerics\
  \ alone):\n\n  1. R-B1B fires unambiguously - this is the registered ambiguous band,\
  \ NOT the\n     R-C1B falsification cut. better_chi2 = 662.22 is ~2.9x clear of\
  \ R-A1B (228) and\n     ~3.4x clear of R-C1B (2284). Both the lower CI bound (468)\
  \ and upper CI bound\n     (944) sit inside the R-B1B band. The verdict is comfortably\
  \ inside the\n     ambiguous band, not borderline R-A1B nor borderline R-C1B.\n\n\
  \  2. NEAR-TIE between Z2_b and Z2_c. chi2_diff = +33.78 with CI [-53.19, +124.47]\n\
  \     straddling zero. Paired SE = 44.71 (run log); |diff| < 1-sigma. Z2_c is the\n\
  \     point-estimate winner but the head-to-head sub-finding records 'no statistically\n\
  \     significant ranking between Z2_b and Z2_c'. The point estimate happens to\n\
  \     favor Z2_c by +33.78.\n\n  3. Z2 CONDITIONING DELIVERS A MODEST MARGINAL REDUCTION\
  \ on top of Q1A's Z_c\n     carryforward. The Z_c-only baseline reproduces at q1b_zc_only_chi2\
  \ = 952.5167\n     within paired-bootstrap noise. The better Z2-conditioned candidate\
  \ sits at\n     662.22, a reduction of 290.29 chi^2 units (cumulative_chi2_improvement_above_Z_c).\n\
  \     This is ~40% of the 724.52 gap-to-close from Q1A's baseline 952.52 to the\n\
  \     R-A1B cut at 228, but does NOT clear R-A1B (better_chi2 sits at 662.22,\n\
  \     2.9x above the R-A1B cut). The reduction curve through the thread now reads:\n\
  \     M0 -> M1 = 16x (Q1); M1 -> M3 = 1.44x (Q2A); M3 -> M3+Z_c = 1.001x (Q1A);\n\
  \     M3+Z_c -> M3+Z_c+Z2 = 1.44x (Q1B). Q1B's marginal reduction is materially\n\
  \     larger than Q1A's 0.18%-of-gap; this is empirically a different reading\n\
  \     than the EXHAUSTED-UNRESOLVED pre-flag advisory anticipated.\n\n  4. CUMULATIVE\
  \ CHI^2 IMPROVEMENT CI: [8.06, 484.42]. Lower CI bound is positive\n     but barely\
  \ (8.06) - the improvement is sign-determined positive at the 95%\n     bootstrap\
  \ level but with a very wide range. The thread's closure_rule\n     (cumulative\
  \ > 0.80 fraction of the gap closed => RESOLVED) is NOT satisfied:\n     cumulative\
  \ point estimate share = 290.29 / 724.52 = 0.40, below 0.80. The\n     thread does\
  \ not auto-resolve.\n\n  5. PER-CELL chi^2 contributions for Z2_c are concentrated\
  \ in the hot-zone cells:\n     saturday__zc6__z21 (Sat afternoon, Z_c=6 = Sat hot-zone,\
  \ Z2=1 morning_ramp)\n     chi^2 = 967.28 (n=360) is the single dominant contribution;\
  \ saturday__zc6__z23\n     (Sat evening) chi^2 = 399.77; saturday__zc6__z22 (Sat\
  \ afternoon) chi^2 =\n     328.09. The 4-level Z2_c partition of the hot-zone Z_c=6\
  \ (Sat) cell into\n     {overnight, morning_ramp, afternoon, evening} REDUCES the\
  \ worst single-cell\n     contribution from Q1A's saturday__bin6 = 1634 to Q1B's\
  \ saturday__zc6__z21\n     = 967 (a 41% reduction in the worst cell). This is the\
  \ mechanism by which\n     Z2 delivers the 290 chi^2 cumulative improvement.\n\n\
  \  6. THE SUBSTANTIVE READING (the arbiter's job to render): mechanical R-B1B\n\
  \     fires; proponent's R-A1B is falsified (better_chi2 662.22 is 2.9x above the\n\
  \     R-A1B cut at 228; even lower CI bound 468 is 2.05x above 228). DA's R-B1B/\n\
  \     R-C1B forecast is mechanically correct on the outcome category. The\n    \
  \ EXHAUSTED-UNRESOLVED pre-flag from S3 anticipated 'similar 0.18%-of-gap\n    \
  \ magnitudes' to Q1A's 1.33 chi^2 reduction; the realized 290 chi^2 reduction\n\
  \     is materially larger (218x larger than Q1A's reduction), so the EXHAUSTED-\n\
  \     UNRESOLVED reading is NOT the most natural substantive interpretation of\n\
  \     this result. Z2 (time_of_day) IS a meaningful within-data \u03C3-algebra above\n\
  \     and beyond Z_c (hour_of_week); the thread does not exhaust on Q1B's\n    \
  \ realization.\n\n  7. ROUTING: per phase_a.shape_outcomes.R-B1B.interpretation\
  \ + branching_rules.\n     Q1B.R-B1B = null, no auto-advancement. The thread does\
  \ NOT resolve (closure\n     rule cumulative share 0.40 < 0.80) and does NOT exhaust\
  \ (Z2 delivered\n     meaningful reduction). Coordinator's post-arbiter decision\
  \ space includes\n     thread-amendment to add a third within-data Z (e.g., continuous\
  \ within-day\n     phase, or cross-axis (Z_c, Z2, demand_quantile) joint stratification),\n\
  \     OR a new thread targeting exogenous Z (temperature). The arbiter records\n\
  \     R-B1B mechanically; the coordinator advances state.\n\nArbiter precondition\
  \ fidelity_coverage_passed: true.\n\n\nProvenance note: this phase_fidelity_check_r.yaml\
  \ carries git_clean: false\nbecause the result.yaml sidecar and experiment/results/q1b_z2_conditioning.txt\n\
  are freshly written (untracked) at the time this file is stamped. Same\ninline-stamp\
  \ pattern documented in Q1A's, Q2B's and P1's Check R artifacts. The\ncanonical\
  \ cleanliness witness for the underlying run is the .txt's own\nmake_result() header\
  \ (inputs_fingerprint 7ec89f9eb1604cd1..., body_sha256\n67bb62f5b9e9b978..., git_sha\
  \ 1736e712065d130275dd8b0b8e7246717d952d6e). Registry\nverify reports 'chain verified'\
  \ after result.yaml's inline stamp. The git_clean:\nfalse in this Check R yaml is\
  \ the inline-stamp pattern, not a tree-state defect.\nArbiter records result_from_clean_tree:\
  \ true with this caveat.\n"
