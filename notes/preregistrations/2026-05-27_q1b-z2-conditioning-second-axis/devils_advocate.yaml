opportunity_cost:
  alternative: 'Skip Q1B and amend the thread to reopen Q1C (temperature/exogenous Z), or open a new thread directly targeting
    auxiliary information beyond the time index per framework programme disintegration_diagnostic.md. Joint S9+S10+S11+S12
    already establishes within-data levers are bounded; Q1B is forecast to corroborate that rather than refute it. Estimated
    cost of Q1C scaffolding: ECCC ingest + temperature-Z construction + per-(day_type, temperature_bin) M3 refits, ~3-5 analyst-days.
    Estimated payoff: temperature is the most-cited candidate Z per mitacs-clim-gap-nonstationary; clim-gap is hour-flat and
    weeks-flat (orthogonal to hour_of_week and time_of_day, by construction), so introducing exogenous Z is the framework-prescribed
    resolution path.'
  ranking: unclear
  ranking_note: Q1B is registered, cheap to run (re-uses Q1A's library + propagation seed; ~minutes of wall-clock), and provides
    an additional registered chi^2-side data point on the identifiability obstruction whether it fires R-A1B (refutes me)
    or R-B1B (corroborates me). The pre-registration discipline value of running Q1B is independent of the expected outcome
    - both my and the proponent's positions get graded, and the workflow produces another calibration data point. If R-B1B
