outcome: R-B1B
rationale_summary: Joint S9+S10+S11+S12 has already established that within-data sigma-algebra-enrichment levers are empirically
  bounded at the ~0.18%-of-gap scale. Q1A's hour_of_week Z (P1 range 0.575, the BINDING axis) shaved 1.33 chi^2 out of a 725.84
  gap; Q1B's time_of_day Z (P1 range 0.485, the SECOND-ranked axis, with WEAKER prior support) is structurally a coarser cut
  of within-day position that overlaps the hour_of_week partition already absorbed by the Z_c carryforward. Net cumulative
  improvement above Z_c should sit in the 1-5 chi^2 range, dominated by Z2's overnight-vs-rest contrast (the one piece of
  orthogonal information P1 isolated; alpha_L overnight 0.1125 vs daytime 0.475-0.598). Z2_b (binary, overnight indicator)
  wins the head-to-head at the point estimate by ~5-15 chi^2 because it captures the dominant orthogonal signal without paying
  small-cell EM variance on the 4-level partition (the (weekday, Z_c=5, morning_ramp) n=144 pool-fallback is the methodological
  tilt). The realized chi2_diff CI straddles zero (NEAR-TIE), so the head-to-head is mechanically Z2_b but substantively no-ranking;
  outcome is R-B1B at the high end of the band, ~947-952 cumulative chi^2.
