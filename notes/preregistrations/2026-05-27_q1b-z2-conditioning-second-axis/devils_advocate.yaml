strongest_argument: The chi^2-side identifiability obstruction is now applied-corroborated at three levels (S9 distributional
  class, S10 mechanism ablation, S11/S12 hour_of_week stratification); Q1B is the fourth within-data lever in the sequence
  and faces a structural ceiling on what time-indexed Z's can deliver. time_of_day is a STRICTLY COARSER partition of within-day
  position than hour_of_week. Q1A's Z_c (8-level hour_of_week) already crosses morning_ramp / afternoon / evening / overnight
  boundaries within each bin; the per-cell mixture-2-Gaussian fits Q1A produced are already marginalizing over time_of_day
  strata within each (day_type, Z_c) cell. Z2's refinement helps only to the extent that within-(day_type, Z_c)-cell non-Gaussian
  mass is heterogeneous across time_of_day strata at a magnitude exceeding the mixture-2-Gaussian family's capacity to absorb.
  The S9 evidence (M3=M4=M5 chi^2-indistinguishable) is that distributional-family capacity is BOUNDED within strata. Per
  Q1A's per-cell decomposition, saturday__bin6 at chi^2=1634 (P1 alpha_L 0.61) is the dominant mass; splitting that cell by
  time_of_day_4 generates four sub-cells (n approx 324 each in pre-cutoff; ~80-100 each in post-cutoff) where the EM-effective
  draw is marginal and mixture parameter estimates carry small-sample variance through the paired-bootstrap CI. The one piece
  of genuinely orthogonal information time_of_day adds over hour_of_week is the overnight-vs-rest contrast (P1 ranked overnight
  0.1125 vs daytime 0.475-0.598); Z2_b operationalizes exactly that contrast without paying granularity variance. The Z2_b
  lever should deliver 1-5 chi^2 of reduction on top of Z_c (Q1A-comparable magnitude); Z2_c at four levels reproduces most
  of Z2_b's gain (the overnight split dominates the daytime sub-splits per P1's clustering) but pays small-cell variance in
  the (weekday, Z_c=5, morning_ramp) pool-fallback footprint. Cumulative chi^2 lands around 947-952, comfortably in R-B1B
  at the high end of the band.
