l2_check:
  pass: true
  items_checked: 9
  items_passed: 8
  items_advisory:
  - name: amendment_note_pool_fallback_prediction_internal_inconsistency
    reason: |
      Phase_a's amendment_note (lines 14-34) makes an empirical
      prediction that "ONE post-cutoff cell — (weekday, Z_c=5,
      morning_ramp) at n=144 — falls below MIN_CELL_SIZE=200; that
      cell's post-cutoff propagation pools to its (day_type, Z_c)
      = (weekday, 5) parent per the registered pool-to-(day_type,
      Z_c) fallback rule." However, phase_a §metric step 2 (lines
      174-181) defines pool-fallback as firing on PRE-CUTOFF
      LIBRARY sample size, not post-cutoff cell size: "For
      (day_type, Z_c, Z2) cells with n < MIN_CELL_SIZE in the
      pre-cutoff library, POOL TO THE (day_type, Z_c) PARENT
      cell". The amendment_note's own empirical fact reports
      pre-cutoff min Z2_c cell at n=2364 — well above 200.
      Therefore at runtime, by phase_a §metric (the binding
      methodology), no pool-fallback will fire and
      pooling_fallback_log_Z2_b / pooling_fallback_log_Z2_c will
      be empty dicts. The amendment_note's last-sentence
      empirical-prediction is an internal inconsistency in
      phase_a — §metric governs and §metric's rule is correctly
      implemented in the script (lines 240-284 fit-side pre-cutoff
      threshold; lines 478-493 post-cutoff routing does the
      lookup, not a thresholded re-fit). The script is faithful
      to §metric; the empirical-fact paragraph in amendment_note
      mis-describes the fallback trigger. ADVISORY: arbiter
      should expect empty pooling_fallback_log_Z2_b and
      pooling_fallback_log_Z2_c, and read the amendment_note's
      last-sentence prediction as describing a routing event (a
      post-cutoff state that maps to a fit not present in the
      3-tuple cell), NOT a fit-side pool-fallback. The
      methodology-vs-prediction inconsistency is non-blocking and
      cosmetic; resolution at result-time is simply for the
      arbiter to note that pooling_fallback_log entries record
      ROUTING events (post-cutoff state mapping to the
      (day_type, Z_c) parent for fit lookup) rather than
      fit-side thresholded pooling, and that under the
      registered binning no fit-side pool-fallback fires.
  notes: |
    The procedure encoded in the script matches phase_a §metric
    and §stopping_criterion at every methodological step. One
    advisory item flagged: an internal inconsistency in phase_a
    between §metric (pool-fallback fires on pre-cutoff library
    sample size, NOT a fit-side defect at runtime) and the
    amendment_note's empirical-fact paragraph (which references
    post-cutoff cell counts as if they trigger pool-fallback).
    The script correctly implements §metric. No script defect;
    advisory only.
  items_audited:
    production_fitter:
      detail: |
        phase_a §metric step 1 specifies mixture_2_gaussian_mle_fit
        (processing/innovations/estimator.py:424). Script calls
        this production function at lines 348, 371, 398, 694, 779
        — never reimplemented. Code-path audit confirmed
        PRODUCTION-PATH.
      verdict: PASS
    library_construction:
      detail: |
        Two library-builder functions: _build_library_per_zc_z2_cell
        at line 240 (3-tuple cell key, day_type filter at anchor,
        Z derivation at predicted-hour = anchor + 1h, contiguity
        check on the (anchor, target) pair via
        target - anchor == 1h); and _build_library_per_zc_only at
        line 287 (Q1A's σ-algebra, used for the Z_c-only
        reproduction-check fit and the pool-fallback target). Both
        match Q1A's pattern (Q1A line 201-249 _build_library_per_z_cell)
        and Q2A's day_anchor seam exclusion (the
        target - anchor != 1h check). MIN_CELL_SIZE=200 enforced
        at lines 279 and 327.
      verdict: PASS
    SMC_propagation:
      detail: |
        N_PARTICLES = 200 per state (line 92). Two RNG-seeded
        propagation paths: reproduction-check #1 (line 1419-1426)
        seeds with SEED_BASE_Q2A + 100 + _TAG_SEED_OFFSET_M3 =
        20260657 (matches Q2A's M3 SMC seed exactly, replays the
        no-Z baseline); reproduction-check #2 (line 1449-1455)
        seeds with SEED_BASE_Q1A + 100 + _Z_SEED_OFFSET_Q1A_Z_c =
        20260700 (matches Q1A line 1201 with tag=Z_c and
        _Z_SEED_OFFSET["Z_c"]=73, replays Q1A's Z_c-branch SMC
        seed exactly). Head-to-head propagation (line 1510-1527)
        seeds per-tag with SEED_BASE + 100 + _Z2_SEED_OFFSET[tag]
        (Z2_b: 20260716, Z2_c: 20260724). Q1B's per-tag offsets
        (89, 97) are NEW (distinct from Q1A's _Z_SEED_OFFSET
        {Z_b:67, Z_c:73}) to avoid silent seed-aliasing between
        sibling experiments.
      verdict: PASS
    marginal_PIT_chi2:
      detail: |
        _marginal_pit_chi2 imported from Q2A
        (experiment.distributional_class_q2a.__main__, line 77)
        — 10-bin equiprobable Pearson chi^2 vs uniform, same
        convention as Q1, Q2A, Q2B, P1, Q1A. Applied at line
        1426 (repro #1), 1456 (repro #2), 1521 (per-Z2-candidate
        post-cutoff marginal), 1538 (per-cell chi^2 contribution),
        1576 (per-bootstrap-sample marginal). All five aggregation
        levels go through the imported production helper.
      verdict: PASS
    pool_fallback_target:
      detail: |
        phase_a §metric step 2: "POOL TO THE (day_type, Z_c)
        PARENT cell (NOT day_type-only). The (day_type, Z_c)
        parent is Q1A's settled per-cell M3 fit (carryforward
        sigma-algebra); pooling to day_type-only would silently
        undo Q1A's Z_c carryforward and contaminate the cumulative
        chi^2." Script implements cascading fallback at
        _pit_for_zc_z2_candidate lines 476-493: first lookup
        the (day_type, Z_c, Z2) cell fit; if missing, fall
        back to the (day_type, Z_c) parent (line 479); if STILL
        missing (an informational safety net for fits with no
        Z_c parent — should not fire under the registered cell
        counts), fall back to day_type-only as final tertiary
        fallback (line 488). fallback_log is keyed by (day_type,
        z_c_value, z2_value) and accumulates the count of
        routings; the (day_type, Z_c) parent is the L2 trap and
        is correctly the primary fallback target.
      verdict: PASS
    paired_day_bootstrap:
      detail: |
        N_BOOTSTRAP = 1000 (line 93). Implementation at lines
        1551-1597: builds the union of post-cutoff delivery_days
        across both candidates (line 1553-1555), groups
        per-candidate PIT tables by delivery_day (line 1557-1561),
        seeds the bootstrap RNG with SEED_BASE + _Z2_BOOT_OFFSET
        = 20268540 (line 1564-1566; _Z2_BOOT_OFFSET=8013, distinct
        from Q1A's _Z_BOOT_OFFSET=8011). PER RESAMPLE the SAME
        sampled_days index (line 1568-1569) is applied to BOTH
        Z2_b and Z2_c (line 1571-1577) — this is the paired
        structure: a single resample contributes one paired
        observation of (chi2_Z2_b, chi2_Z2_c, chi2_diff,
        better_chi2, cum_improvement). 95% percentile CIs are
        computed on each at lines 1587-1595.
      verdict: PASS
    near_tie_rule:
      detail: |
        phase_a §metric "NEAR-TIE if |chi2_Z2_b - chi2_Z2_c| <
        1.0 * paired-bootstrap SE of the difference (1 sigma of
        the paired difference distribution)". chi2_diff_se =
        np.nanstd(boot_chi2["diff"]) at line 1590 (matches Q1A's
        identical estimator at line 1275). _evaluate_outcome
        line 824-825: near_tie = abs(diff) < 1.0 * chi2_diff_se.
        On NEAR-TIE, the head-to-head reason string records
        "NEAR-TIE (no ranking)" and the verdict still fires on
        min(); the candidate with the lower point estimate
        retains the "winner" label per phase_a (lines 1142-1143
        of result.yaml carry both fields). Matches phase_a
        verbatim.
      verdict: PASS
    landslide_qualifier:
      detail: |
        phase_a §corroboration_criterion: "R-A1B fires AT
        LANDSLIDE STRENGTH on at least one candidate: better
        candidate's cumulative chi^2 point estimate <= 228 AND
        lower bootstrap 95% CI bound <= 228 (both clearing the
        cut simultaneously, analogous to Q1A corroboration_criterion
        and P1 R-A landslide reading)." Script lines 1088-1096:
        landslide_R_A1B is True iff outcome.verdict == "R-A1B"
        AND outcome.better_chi2 <= R_A1B_CUT AND
        ci_low_better <= R_A1B_CUT; None outside R-A1B. Matches
        phase_a verbatim and matches Q1A's analogous convention
        (per Q1A check_r, landslide is null outside the
        corroboration verdict).
      verdict: PASS
    synthetic_gate:
      detail: |
        phase_a §baselines.secondary specifies a synthetic
        recovery gate with two parts: (i) per-cell fitted (w, s1,
        s2) within tolerance, (ii) PIT chi^2 under full
        3-tuple-conditioned model approximately Uniform[0,1];
        plus a FALSE-Z companion. Script _run_inline_synthetic_gate
        at line 676-800: 4-stratum DGP (2 Z_c × 2 Z2),
        SYNTHETIC_GATE_N_LIB=2000 rows/cell, SYNTHETIC_GATE_M=100
        SMC particles, SYNTHETIC_GATE_CHI2_CEILING=60 per-cell.
        (a) parameter recovery within _SYNTH_PARAM_TOL=0.15 on
        w_r and relative tolerance on s2 — BLOCKING; (b)
        per-cell PIT chi^2 < 60 — BLOCKING; (c) false-Z2
        collapse companion (advisory, matches Q1A convention).
        BLOCKING gate cleared via assert at line 1348-1355 (gate
        FAIL exits with code 2 before any Ontario read). Matches
        phase_a verbatim.
      verdict: PASS

verdict: PASS

next_step_recommendation: |
  Run experiment with --emit-result. Command:

    .venv/bin/python -m experiment.q1b_z2_conditioning --emit-result

  Expected runtime: synthetic gate ~30s, then Ontario fits and SMC
  propagation. Required precondition for --emit-result: git tree is
  clean (experiment.provenance.make_result refuses to write a CLAIM-
  GRADE artifact on a dirty tree, per the strict refuse-on-dirty rule
  in CLAUDE.md). Commit the Q1B script and this check_p.yaml before
  the --emit-result invocation; then Check R audits the result.yaml
  + experiment/results/q1b_z2_conditioning.txt.

  Advisory carryforward to Check R / arbiter (non-blocking):
  pooling_fallback_log_Z2_b and pooling_fallback_log_Z2_c will both
  be empty under the registered fit-side pre-cutoff MIN_CELL_SIZE
  trigger (phase_a §metric step 2 is the binding rule). The
  amendment_note's last-sentence claim that one cell pools
  post-cutoff describes a routing event for a post-cutoff state
  whose 3-tuple cell is below threshold IN THE PRE-CUTOFF LIBRARY
  — which under the registered numbers (pre-cutoff min 2364) does
  not occur. If the runtime confirms empty pooling_fallback_log
  dicts, this is the expected result; the arbiter should not read
  empty logs as a defect.
