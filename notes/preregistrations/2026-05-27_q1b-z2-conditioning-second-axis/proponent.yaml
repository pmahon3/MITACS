confidence_note: Lower confidence than Q1A proponent's 0.55 to honor the Q1A arbiter's
  explicit calibration warning that Patra-Sen-localization-implies-chi^2-closure forecasts
  in the alpha_L range [0.5, 0.7] empirically correspond to chi^2 reductions of 0-2%,
  not 50-95%. The proponent argues R-A1B on a different structural mechanism than
  Q1A's premise (within-cell orthogonality / M3 family-capacity relief from finer
  cell partition, not localization-magnitude); the calibration warning is acknowledged
  and the confidence is tempered, not the position.
evidence_chain:
- claim: P1 R-A landslide identified time_of_day as the second-strongest axis at range
    0.485 [0.385, 0.578] (P1 arbiter); within-day structure overnight 0.1125 vs morning_ramp
    0.5825 vs afternoon 0.5975 vs evening 0.475 is a clean overnight-vs-rest contrast
    with a 5x span across day-time.
  source: memory/mitacs-p1-patra-sen-localization.md
- claim: 'Q1A per-cell decomposition: saturday__z6 = 1634 chi^2 (single cell exceeds
    pooled marginal 952.5 by 70%); mixture w2 = 0.20, scales s1 = 0.096 / s2 = 0.215
    - the M3 2-component family is at capacity within this 21-hour-wide cell.'
  source: memory/mitacs-q1a-z-conditioning.md
- claim: 'saturday__z6 spans Sat 07:00 - Sun 03:00 (effective overlap), which crosses
    all 4 P1 time_of_day strata: Sat 07:00-11:59 (morning_ramp), Sat 12:00-17:59 (afternoon),
    Sat 18:00-23:59 (evening), Sun 00:00-03:00 (overnight). M3''s 2 mixture components
    are insufficient to fit this 4-modal within-cell tail structure.'
  source: experiment/p1_patra_sen/__main__.py:81-96 (_time_of_day_label production
    binning) + Q1A arbiter saturday__z6 cell description.
- claim: 'Z2_c partition refinement: saturday__z6__overnight (P1 alpha_L 0.1125 cleanly
    Gaussian; n predicted ~150 post-cutoff but pre-cutoff library well above MIN_CELL_SIZE=200),
    saturday__z6__morning_ramp / afternoon / evening (heavy-tailed but within-cell
    homogeneous - all 3 strata have similar P1 alpha_L 0.48-0.60 within-stratum, so
    an M3 fit within each should not be at family capacity).'
  source: phase_a.yaml threshold_derivations + P1 arbiter time_of_day_axis_ranking.
- claim: 'Q1A Z conditioning lever reduced chi^2 by 0.18% of gap (1.33 of 725.84 chi^2
    units); proponent''s premise here is that this floor reflected an exhausted-within-cell-multimodality
    structure, NOT an exhausted distributional family per se. The Q1B finer partition
    tests this directly: if the M3 family genuinely cannot detect within-stratum non-Gaussianity
    (the DA/EXHAUSTED-UNRESOLVED reading), Q1B''s reduction will also asymptote at
    <2% of gap. If the family was constrained by within-cell heterogeneity (proponent''s
    reading), Q1B''s reduction can be much larger.'
  source: memory/mitacs-q1a-z-conditioning.md + memory/mitacs-q2a-richer-family.md
    (reduction curve).
- claim: 'Z2_c (4-level) is non-redundant with Z_c (8-level hour_of_week): Z_c separates
    DAY-of-week with bins spanning ~21 hours each (week-cyclical); Z2_c separates
    HOUR-of-day with bins spanning 5-7 hours each (day-cyclical). The cartesian product
    (Z_c x Z2_c) gives 32 cells partitioning the 168 weekly hours into ~5.25-hour
    blocks indexed by (week_phase, day_phase). This is a genuine refinement; (Z_c,
    Z2_c) isolates Mon-overnight from Mon-day in a way neither alone does.'
  source: phase_a.yaml metric + Q1A arbiter z_lever_marginal discussion.
- claim: 'Empirical pre-data cell counts (phase_a threshold_derivations as amended
    for P1 production binning): pre-cutoff (day_type x Z_c x Z2_c) 32 non-empty cells,
    min 2364 / max 8281 / median 7092 - pool-fallback never fires on fit side. Post-cutoff
    (day_type x Z_c x Z2_c) 32 non-empty cells, min 144 / max 504; ONE post-cutoff
    cell (weekday, Z_c=5, morning_ramp) at n=144 pools to its (day_type, Z_c) parent.
    This is a small evaluation-side footprint and the proponent does NOT bet on it
    affecting the marginal chi^2 reading.'
  source: phase_a.yaml amendment_note + threshold_derivations.
