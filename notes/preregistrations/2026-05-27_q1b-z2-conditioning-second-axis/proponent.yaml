what_would_change_my_mind:
- condition: 'Reproduction check #2 (sigma=(day_type, Z_c) alone reproduces Q1A''s
    952.5167) drifts by more than paired-bootstrap noise (|diff| > 5 chi^2 units).'
  interpretation: The cumulative-baseline anchor is incoherent; the Z2 reduction measurement
    is not directly comparable to Q1A's settled chi^2. The R-A1B reading would be
    re-interpreted under the new baseline. If reproduction reads ~10% high (say 1050),
    the proponent's point forecast shifts to ~250-300 and R-A1B becomes the borderline
    mechanical call rather than the central prediction.
- condition: better_chi2 > 600 (clear non-closure, halfway down the R-B1B band).
  interpretation: The proponent's within-cell orthogonality premise is falsified.
    Z2 is informative on P1's localization metric but does not deliver chi^2 closure
    on the M3 family lever; the DA/EXHAUSTED-UNRESOLVED reading is correct. The within-data
    sigma-algebra enrichment is empirically bounded at ~0.18%-of-gap order even with
    a second axis stacked on top; resolution requires exogenous Z (temperature) or
    a metric-side reframe (P2 calibration).
- condition: chi2_diff CI crosses zero (head-to-head NEAR-TIE).
  interpretation: The within-day alpha_L gradient (overnight vs daytime/evening) that
    the proponent bet on does NOT translate to chi^2 differentiation between Z2_b
    (binary) and Z2_c (4-level). The binary's collapse of morning_ramp/afternoon/evening
    does NOT cost chi^2 because the within-stratum tail structures are similar enough
    that M3 fits absorb them comparably. Parsimony would favor Z2_b in this case (same
    break-tie convention Q1A used). The proponent would update toward 'Z2 is helpful
    but the binary captures most of the signal' and lose ranking confidence on the
    head-to-head.
- condition: Per-stratum (Z2_c) chi^2 decomposition does NOT show morning_ramp + afternoon
    as dominant contributors (e.g., evening dominates, or overnight contributes >50).
  interpretation: The proponent's structural argument from P1's within-day alpha_L
    ranking is empirically refuted. If overnight contributes much chi^2, the near-Gaussian
    P1 reading was a per-stratum-pooled artifact, not a structural fact. If evening
    dominates while morning_ramp/afternoon don't, the within-day signal is in evening's
    tail (P1 alpha_L 0.475 < morning_ramp/afternoon) and the within-cell orthogonality
    argument is wrong about which sub-cells are at capacity. R-A1B may still fire
    mechanically but the substantive picture is unforecast.
- condition: Pooling-fallback fires on >= 3 cells in the pre-cutoff fit side (not
    just the post-cutoff (weekday, Z_c=5, morning_ramp) cell).
  interpretation: Phase_a threshold_derivations says NEVER on the fit side. If the
    bootstrap resampling drops multiple cells below MIN_CELL_SIZE=200, the per-stratum
    M3 fits in the affected cells collapse to (day_type, Z_c) parent (Q1A's cell)
    and undo most of Q1B's added partition. chi^2 would drift toward Q1A's 952.5167
    and R-A1B firing becomes implausible. The proponent's prior on stable fit-side
    cell counts is tight given the median 7092 / min 2364 in the deterministic pre-cutoff
    library, but bootstrap drops are random.
- condition: Per-cell mixture weights w2 stay above 0.30 in the predicted-dominant
    sub-cells (saturday__z6__morning_ramp, saturday__z6__afternoon, sunday__z6/z7__morning_ramp/afternoon).
  interpretation: If even after the finer partition the mixture's 'tail' component
    is the majority within sub-cells, the 2-component centred-Gaussian family is itself
    misspecified at the cell level - the within-cell tail structure is not 1-component-heavy
    + 1-component-tail but something the family can't represent (e.g. multi-modal,
    or skewed). chi^2 would be expected in R-B1B not R-A1B and the M4 (mixture-3-Gaussian)
    refit becomes the natural follow-up, not closure.
