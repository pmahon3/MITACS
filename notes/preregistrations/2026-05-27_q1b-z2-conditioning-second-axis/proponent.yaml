outcome: R-A1B
rationale_summary: 'The proponent argues R-A1B fires via WITHIN-CELL ORTHOGONALITY,
  not via P1 localization magnitude. Q1A''s per-cell decomposition showed saturday__z6
  (Q1A''s hottest hour_of_week cell) contributed chi^2 = 1634 alone, with mixture-2-Gaussian
  tail weight w2 = 0.20 and the family at capacity. The proponent''s claim: Z_c bins
  are ~21 hours wide and mix overnight/morning_ramp/afternoon/evening WITHIN a single
  cell. M3 has only 2 mixture components and cannot fit a 4-modal within-cell tail
  structure; saturday__z6 contains all 4 P1 time_of_day strata (overnight near-Gaussian
  + 3 heavy-tailed daytime/evening strata) compressed into a 2-component fit. Z2_c
  splits saturday__z6 into 4 sub-cells: saturday__z6__overnight (M3 fits a near-Gaussian,
  cleanly), saturday__z6__morning_ramp / afternoon / evening (M3 fits 2-component
  heavy-tailed in each, with within-sub-cell homogeneity that the marginal saturday__z6
  lacked). The chi^2 reduction is concentrated EXACTLY where Q1A''s hot cells lived;
  the family capacity is RELIEVED by the finer partition, not exhausted. The non-redundancy
  with Q_c is structural: hour_of_week separates Mon-day from Sat-day but lumps Mon-overnight
  with Mon-day; (Z_c, Z2_c) joint isolates Mon-overnight, Sat-morning_ramp, Sun-afternoon
  as distinct cells where the non-Gaussian mass is plausibly distributed differently.
  Z2_c wins over Z2_b because the binary collapse destroys the morning_ramp/afternoon/evening
  differentiation (P1 alpha_L 0.5825 / 0.5975 / 0.475 are close in magnitude but the
  sub-cells differ in n and in latent tail shape). The Q1A calibration warning is
  acknowledged: the proponent does NOT claim a tight Q1A-style CI; the CI is widened
  to honor the warning. Confidence 0.40.'
