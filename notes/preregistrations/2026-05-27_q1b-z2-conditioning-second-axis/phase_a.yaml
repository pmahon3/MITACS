hypothesis:
  counter: 'See devils_advocate.yaml. R-B1B or R-C1B: time_of_day''s marginal information ABOVE hour_of_week
    (Z_c) is bounded by the same family-capacity ceiling that bounded Q1A''s Z_c-conditioning lever. Joint
    S9+S10+S11+S12 already showed three within-data levers (richer distributional families, mechanism
    ablation, hour_of_week stratification) all empirically bounded at the ~0.18%-of-gap scale; a fourth
    within-data lever (time_of_day with weaker P1 prior support, range 0.485 vs hour_of_week 0.575) is
    structurally constrained to deliver no more than the same magnitude. Expected cumulative chi^2 lands
    in R-B1B at the high end of the band (similar magnitude to Q1A''s 952.5167) or in R-C1B if the finer
    stratification induces small-cell EM variance. The Z2 lever is exhausted territory; resolution requires
    auxiliary information beyond the time index.'
  proponent: See proponent.yaml. R-A1B fires (better-candidate cumulative chi^2 <= 228) via the multi-mechanism
    hypothesis registered in the thread skeleton (Q1B.phase_a_skeleton.metric_class; "if Q1A delivers
    R-B1A, Z2 may close the gap when combined with Z1"). The proponent argues R-A1B on its merits, not
    via P1's range ordering alone; specifically, time_of_day's overnight-vs-rest contrast carries structural
    information ORTHOGONAL to hour_of_week's weekend-vs-weekday partition, so the joint (Z_c, Z2) sigma-algebra
    captures within-bin tail heterogeneity that neither Z alone could resolve. M3-Z2_c (the 4-level categorical)
    is the better candidate because the within-day tail structure (overnight 0.1125 vs afternoon 0.5975
    in P1's alpha_L ranking) is itself non-trivial; the 4-bin granularity captures it where the binary
    collapses morning_ramp/afternoon/evening together.
metric: "PRIMARY: head-to-head between two M3-with-Z2 candidates against a SINGLE verdict cut, where the\
  \ conditioning sigma-algebra is enriched from sigma(day_type, Z_c) (Q1A's settled carryforward) to sigma(day_type,\
  \ Z_c, Z2). Both candidates re-fit M3 (production fitter mixture_2_gaussian_mle_fit in processing/innovations/estimator.py:424)\
  \ per (day_type, Z_c, Z2) cell. Z2 is derived from time_of_day per P1 R-A's second-strongest axis (P1\
  \ arbiter body_sha256 5eb024b72dbeb0148000fe3f5e44da316b00685a0d5b15dde8df2b66d0218067: time_of_day\
  \ range 0.485 [0.385, 0.578], with overnight 0.1125 vs afternoon/ morning_ramp/evening 0.475-0.598 -\
  \ clean overnight-vs-rest contrast per the P1 arbiter time_of_day_axis_ranking note). The verdict metric\
  \ is the marginal post-cutoff PIT chi^2 (10-bin equiprobable Pearson, same convention as Q1, Q2A, Q2B,\
  \ P1, Q1A):\n\n  chi^2_Z2_b = marginal PIT chi^2 under M3 with sigma(day_type, Z_c, Z2_b)\n  chi^2_Z2_c\
  \ = marginal PIT chi^2 under M3 with sigma(day_type, Z_c, Z2_c)\n\nTHE TWO Z2 CONSTRUCTIONS (PRE-LOCKED,\
  \ per user direction; mirrors Q1A's Z_b/Z_c pattern):\n\n  Z2_b (BINARY, overnight indicator): Z2_b\
  \ = 0 if h ∈ {1..6} else 1. With h ∈ {1..24} (Q1's pit_M1 convention; h is the delivery-clock hour),\
  \ Z2_b = 0 maps to overnight (clock_hour 0..5; matches P1's overnight stratum). Z2_b = 1 maps to the\
  \ day (clock_hour 6..23). This is the clean overnight-vs-rest contrast the P1 arbiter highlighted (overnight\
  \ 0.1125 essentially Gaussian vs daytime/evening 0.475-0.598).\n\n  Z2_c (4-LEVEL CATEGORICAL): Z2_c\
  \ uses P1's exact time_of_day binning per the source-of-truth in `experiment/p1_patra_sen/__main__.py`\
  \ lines 81-96 (production function `_time_of_day_label(h)` for h ∈ 1..24):\n     - overnight:    h ∈\
  \ {1..6}   (clock_hour 0..5)\n     - morning_ramp: h ∈ {7..11}  (clock_hour 6..10)\n     - afternoon:\
  \    h ∈ {12..17}  (clock_hour 11..16)\n     - evening:     h ∈ {18..24}  (clock_hour 17..23)\n  Mapped\
  \ to integer levels {0=overnight, 1=morning_ramp, 2=afternoon, 3=evening} for the (day_type, Z_c, Z2_c)\
  \ cell key. Note: the user task description literal ranges {1-6, 7-12, 13-18, 19-24} differed by one\
  \ hour from P1's production definition; per the user's stated intent (\"Matches P1's time_of_day axis\
  \ strata exactly\") and the thread's Q1B.skeleton_thresholds_depend_on rule (Z2 derived from P1.result),\
  \ P1's production definition is the source-of-truth and Z2_c uses {1..6, 7..11, 12..17, 18..24}. This\
  \ is documented in thread.threshold_derivations below as a methodology clarification (pre-data; resolves\
  \ a typo against P1's actual binning).\n\nFIT PROCEDURE (BOTH CANDIDATES):\n  1. Per (day_type, Z_c,\
  \ Z2) cell with n >= MIN_CELL_SIZE = 200 in the pre-cutoff library, run mixture_2_gaussian_mle_fit(X_cell,\
  \ Y_cell) to obtain per-cell (C_cell, params_cell, resid_cell). C_cell is the local OLS drift, params_cell\
  \ = {weights: (w1, w2), scales: (s1, s2)}.\n  2. For (day_type, Z_c, Z2) cells with n < MIN_CELL_SIZE\
  \ in the pre-cutoff library, POOL TO THE (day_type, Z_c) PARENT cell (NOT day_type-only). The (day_type,\
  \ Z_c) parent is Q1A's settled per-cell M3 fit (carryforward sigma-algebra); pooling to day_type-only\
  \ would silently undo Q1A's carryforward and contaminate the cumulative chi^2. The pooling fallback\
  \ is recorded per-cell in the result artifact; no silent re-stratification.\n  3. SMC propagation: M\
  \ = 200 particles per state (same as Q2A, Q1A), seed = Q2A's _TAG_SEED_OFFSET_M3 = 31 for paired comparison.\
  \ Residual sampler uses the per-(day_type, Z_c, Z2) cell mixture parameters of the cell the propagated\
  \ state belongs to (Z_c and Z2 evaluated at predicted-hour per Q1A's anchor + 1h convention; see experiment/q1a_z_conditioning/__main__.py\
  \ lines 172-186 for the production pattern).\n  4. Marginal PIT: aggregate u over all post-cutoff (day,\
  \ hour) pairs; 10-bin equiprobable Pearson chi^2.\n\nHEAD-TO-HEAD VERDICT RULE (PRE-LOCKED):\n\n  The\
  \ verdict fires on the BETTER (lower) of the two candidates' point estimate cumulative chi^2:\n  - better_chi2\
  \ = min(chi2_Z2_b, chi2_Z2_c)\n  - if better_chi2 <= 228:                     R-A1B (Z1+Z2 close the\
  \ gap; per branching_rules.Q1B.R-A1B = null, thread RESOLVED on the multi-Z path)\n  - if better_chi2\
  \ in (228, 2284]:                R-B1B (Z2 helps but doesn't close on top of Z_c; per branching_rules.Q1B.R-B1B\
  \ = null, no auto- advancement; coordinator decision space)\n  - if better_chi2 > 2284:            \
  \          R-C1B (Z2 redundant with Z_c or worse; routes to P2 per branching_rules.Q1B.R-C1B)\n\nTIE\
  \ / NEAR-TIE HANDLING (mirrors Q1A): candidates are NEAR-TIE if |chi2_Z2_b - chi2_Z2_c| < 1.0 * paired-bootstrap\
  \ SE of the difference (1 sigma of the paired difference distribution). On NEAR-TIE: the verdict uses\
  \ min(chi2_Z2_b, chi2_Z2_c) as above (mechanical), AND the head-to-head sub-finding records 'no ranking'\
  \ between Z2_b and Z2_c, AND the lower CI bound landslide check uses the candidate with the lower point\
  \ estimate. On NOT-NEAR-TIE: the head-to-head sub-finding records which candidate won and by how much\
  \ (chi^2 difference and its CI).\n\nVERDICT-CUT TRACEABILITY: the integer cuts 228 and 2284 are inherited\
  \ from the thread skeleton (resolution-paths-thread Q1B node outcome_categories, lines 207-209). They\
  \ are the rounded versions of Q2A's gate- validated cuts R-A2_cut = 228.44 and R-C2_cut = 2284.44 (see\
  \ Q2A phase_a's threshold_derivations). Q1B uses the thread skeleton's rounded integer values to honor\
  \ phase-fidelity Check P L1 exact-skeleton-match; a chi^2 falling in (228, 228.44] is treated as R-B1B\
  \ per the thread, even though under Q2A's gate it would be R-A2 - this is a deliberate conservative\
  \ tightening of the R-A1B cut by 0.44 (same convention Q1A used).\n\nSECONDARY / informational:\n  -\
  \ cumulative_chi2_improvement_above_Z_c = 952.5167 - better_chi2 (the gap-closure share metric per thread\
  \ root.closure_rule; a share > 0.80 indicates thread RESOLVED on the multi-Z path).\n  - Per-(day_type,\
  \ Z_c, Z2) cell mixture parameters (w1, w2, s1, s2) reported for each candidate, with paired-bootstrap\
  \ CIs.\n  - Per-cell chi^2 contribution decomposition (the cell key is the 3-tuple).\n  - Pooling-fallback\
  \ log: which cells dropped below MIN_CELL_SIZE = 200 and pooled to (day_type, Z_c) parent.\n  - chi^2\
  \ difference (chi2_Z2_b - chi2_Z2_c) and its 95% paired-bootstrap CI (for the head-to-head sub-finding).\n\
  \  - Reproduction check #1 (Q2A anchor): re-running M3 with sigma = (day_type) alone (no Z, no Z2) on\
  \ the pre-cutoff library reproduces Q2A's chi^2 = 953.84 within paired-bootstrap noise. End-to-end provenance\
  \ back to S9.\n  - Reproduction check #2 (Q1A anchor): re-running M3 with sigma = (day_type, Z_c) alone\
  \ (Q1A's carryforward, no Z2) reproduces Q1A's chi^2 = 952.5167 within paired-bootstrap noise. This\
  \ is the cumulative-baseline anchor; the Z2 reduction measurement only means what it claims if this\
  \ check passes.\n"
