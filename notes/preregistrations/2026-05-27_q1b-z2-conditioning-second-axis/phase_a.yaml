baselines:
  primary: 'Q1A''s settled M3 with sigma-algebra (day_type, Z_c) = 952.5167 (better_chi2_point from Q1A
    arbiter body_sha256 6b49d9136437c1905c6a48f4f8bf6511feeafc4ba7bc01124be6efb14c53ed7c; paired-day bootstrap
    95% CI [625.34, 1342.33]). This is the cumulative-baseline anchor: the R-A1B bar at 228 corresponds
    to a 99.7% reduction of the gap-to-close that Q1A left open (952.5167 - 228 = 724.5167 chi^2 units
    remaining after Q1A''s Z_c carryforward; the head-to-head candidates must reduce M3''s cumulative
    chi^2 from 952.5167 toward 228 by adding Z2 to the already-enriched (day_type, Z_c) sigma-algebra).
    NEAR-TIE CAVEAT on the Q1A carryforward: chi2_diff between Z_b and Z_c in Q1A was +33.5 with paired
    SE 56.84 (CI [-93, +143] straddles zero); Z_c is the parsimony-preferred point-estimate winner used
    as Q1B''s Z1 carryforward per phase_a.shape_outcomes.R-B1A.interpretation in Q1A''s phase_a, NOT a
    statistically- discriminated winner over Z_b. Q1B does NOT re-litigate the Q1A head-to-head; Z_c is
    fixed by the carryforward rule. Q2A''s M3 chi^2 = 953.84 (M3 with sigma(day_type) alone) and M0/M1
    are inspection-only context, not primary baselines for this verdict.

    SECONDARY METRIC the result artifact must report: cumulative_chi2_improvement_above_Z_c = 952.5167
    - better_chi2. This is the gap-closure share metric per the thread''s closure_rule (resolution-paths-thread
    root.closure_rule: share = (chi^2_baseline - chi^2_after_fix) / (chi^2_baseline - R-A2_cut), evaluated
    against Q1A''s carryforward baseline). The realized share interpreted against the closure_rule (>
    0.80 => thread RESOLVED on cumulative-multi-Z) is a sub-finding of the arbiter; the primary verdict
    is the categorical R-A1B / R-B1B / R-C1B mapping below.'
  secondary: 'Synthetic recovery gate (METHOD/DESIGN). Generate synthetic data with a known Z2-conditional
    mixture DGP that varies parameters across (Z_c_stratum, Z2_stratum) pairs (3-tuple cell key: day_type
    x Z_c x Z2). Two recovery checks: (i) per-cell fitted (w, s1, s2) within tolerance of ground truth;
    (ii) PIT u_PIT under the full-3-tuple-conditioned model is approximately Uniform[0,1] (chi^2 << R-A1B
    cut at 228). Companion FALSE-Z gate: regenerate the same data with Z2 randomly permuted (orthogonal
    to mixture parameters) and confirm chi^2 collapses to the Z_c-only baseline (so the per-stratum fit
    is not artificially shrinking chi^2 by overfitting a noise label). Confirm BOTH the recovery and the
    false-Z baseline before the Ontario diagnostic runs. ~30 sec wall-clock; runs every invocation as
    in-script self-test. Mirror Q1A''s synthetic gate structure exactly (per Q1A phase_a baselines.secondary);
    the only additions are the 3-tuple cell key and the Z_c-only false-Z baseline (instead of marginal
    mixture). Gate-validation rationale: if adding Z2 cannot close a known Z2-conditional gap in synthetic,
    any null result on Ontario data is consistent with implementation defect rather than a true substantive
    null.'
