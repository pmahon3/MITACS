ci_method:
  details: '1000 paired-day bootstrap resamples of post-cutoff days (pair = (delivery_day, day_type) preserving
    within-day correlation; same scheme as Q1, Q2A, P1, Q1A). Per resample: refit M3 per (day_type, Z_c,
    Z2) cell on the resampled rows for EACH of the two head-to-head candidates (M3-Z2_b and M3-Z2_c) sharing
    one resample for paired comparison; recompute the marginal post-cutoff PIT chi^2 per candidate. Report
    95% percentile CI on chi2_Z2_b, chi2_Z2_c, the difference (chi2_Z2_b - chi2_Z2_c), and cumulative_chi2_improvement_above_Z_c
    = 952.5167 - better_chi2.'
  type: paired_day_bootstrap
  width: 95 percent percentile interval
corroboration_criterion:
  numeric: 'R-A1B fires AT LANDSLIDE STRENGTH on at least one candidate: better candidate''s cumulative
    chi^2 point estimate <= 228 AND lower bootstrap 95% CI bound <= 228 (both clearing the cut simultaneously,
    analogous to Q1A corroboration_criterion and P1 R-A landslide reading).'
  reasoning: 'A single point estimate <= 228 with a CI straddling the cut is mechanical R-A1B but substantively
    borderline. Requiring the lower CI bound also clearing 228 is the landslide reading: the cumulative
    (Z_c, Z2) sigma-algebra closes the gap. If only the point clears (CI straddles), the arbiter records
    mechanical R-A1B with the "landslide-not-met" qualifier and the closure_rule (share > 0.80) is evaluated
    on the point estimate. The substantive bar is the landslide. The thread''s closure_rule on the multi-Z
    path (Q1A.R-B1A + Q1B.R-A1B with cumulative > 0.80 => RESOLVED) is automatically satisfied if R-A1B
    fires at landslide strength: (952.5167 - 228) / (952.5167 - 228) = 1.0 share, well above 0.80.'
data:
  cutoff_handling: 'Q1B re-fits M3 with the conditioning sigma-algebra enriched from sigma(day_type, Z_c)
    (Q1A''s settled carryforward) to sigma(day_type, Z_c, Z2), where Z2 is derived from time_of_day per
    P1 R-A''s second-strongest axis. Pre-cutoff library is used to fit per-cell mixture parameters (w,
    s1, s2) - same library Q1A''s M3 used, identical SMC propagation seed (_TAG_SEED_OFFSET_M3 = 31) so
    the unconditioned baseline reproduces Q2A''s 953.84 and the Z_c-only baseline reproduces Q1A''s 952.5167.
    Post-cutoff is used only for PIT chi^2 evaluation. No leakage: post-cutoff rows do not enter the per-cell
    mixture fits. The Z2 derivation is purely from the time index (delivery_day -> weekday, h -> hour)
    so no exogenous data is introduced; Q1B is on the same data footprint as Q1/Q2A/Q2B/P1/Q1A.'
  partition:
    dev: not used
    test: post-cutoff 2025-01-01 .. 2026-05-16 (same population as Q1, Q2A, Q2B, P1, Q1A)
    train: pre-cutoff library for per-(day_type, Z_c, Z2) M3 mixture refits; same library Q1A used
  source: 'Ontario IESO demand (cfg.paths.historical_csvs) + Q1''s post-cutoff PIT population. Specifically:
    (a) pre-cutoff library rebuilt via the same loaders Q1A used to fit M3 per (day_type, Z_c) (`load_actuals`,
    day_anchor 07:00, all rows up to spec.data_cutoff); (b) post-cutoff actuals for SMC particle propagation
    and PIT evaluation. The Z_c column is derived inline from the timestamp index per Q1A''s _hour_of_week_bin
    (h ∈ 1..24); the Z2 column (Z2_b and Z2_c) is derived inline from (delivery_day, h) per the time_of_day
    rule below. Q1A''s artifact (`experiment/results/q1a_z_conditioning.txt`, body_sha256 bf8eed242b65eafaa72ea058f2778d091ba87783cd664e6e2bdbc9df2df1c42f)
    is loaded only for sanity confirmation that the Z_c stratification reproduces Q1A''s per-cell mixture
    parameters (cross-check; not an input to the fit).'
falsification_criterion:
  numeric: 'R-C1B fires on BOTH candidates: cumulative_chi^2_Z2_b > 2284 AND cumulative_chi^2_Z2_c > 2284.'
  reasoning: 'R-C1B is the multi-Z falsification: time_of_day-derived Z2 ON TOP OF hour_of_week-derived
    Z_c does NOT close the gap (either cumulative point estimate falls beyond the R-C cut at 10x the R-A
    bar). Per branching_rules.Q1B.R-C1B this routes to P2 (synthetic Gaussian-DGP calibration), which
    interprets the persistent chi^2 as either a legitimate identifiability obstruction (no time-indexed
    Z within reach closes the gap) or that the chi^2 metric on the M3 family is not the right detector
    for whatever residual signal remains. Both candidates must fall in R-C1B; if only one does, the verdict
    is the better candidate''s outcome (head-to-head verdict rule, see shape_outcomes).

    Note on monotonicity: the cumulative chi^2 with Z2 added is NOT mathematically constrained to be lower
    than the Z_c-only chi^2; refitting per (day_type, Z_c, Z2) cell adds parameters but also reduces per-cell
    sample size and the chi^2 metric on the marginal PIT is not monotone in conditioning sigma-algebra
    (the post-cutoff chi^2 is a function of the propagated u_PIT distribution which depends on the per-cell
    EM fits, not directly on log-likelihood). It is possible in principle that adding Z2 INCREASES chi^2
    if the finer stratification destabilizes mixture fits in sparse cells (this is precisely what the
    MIN_CELL_SIZE = 200 pool-to-parent fallback guards against). The R-C1B band captures the "Z2 hurt
    or did nothing useful" case empirically.'
