research_question: Does enriching the M3 conditioning sigma-algebra from sigma(day_type, Z_c) (Q1A's settled
  carryforward) to sigma(day_type, Z_c, Z2), with Z2 derived from time_of_day per P1 R-A's second-strongest
  axis, reduce the post-cutoff marginal PIT chi^2 from Q1A's settled cumulative baseline of 952.5167 to
  <= 228 (Q2A R-A2 cut, integer-rounded per thread skeleton)? The head-to-head between Z2_b (binary overnight
  indicator) and Z2_c (4-level categorical, per P1 production binning) ranks the two pre-locked operationalizations
  of time_of_day under one verdict cut.
schema: phase_a
shape_outcomes:
  R-A1B:
    criterion: min(chi2_Z2_b, chi2_Z2_c) <= 228 (better candidate's cumulative chi^2 point estimate clears
      the Q2A R-A2 cut at integer-rounded 228)
    interpretation: 'time_of_day-derived Z2 ON TOP OF hour_of_week-derived Z_c closes the cumulative marginal
      chi^2 gap. The head-to-head sub-finding records which candidate won (with paired-bootstrap CI on
      the difference). Per thread branching_rules.Q1B.R-A1B = null and root.closure_rule (Q1A.R-B1A +
      Q1B.R-A1B with cumulative > 0.80 => RESOLVED), the resolution-paths-thread is RESOLVED on the multi-Z
      path. LANDSLIDE qualifier: if BOTH the better candidate''s point AND lower-bound 95% CI clear 228,
      the substantive reading is "the joint (Z_c, Z2) sigma-algebra is a sufficient conditioning for marginal
      calibration"; if only the point clears (CI straddles), mechanical R-A1B fires with "landslide-not-met"
      recorded.'
  R-B1B:
    criterion: min(chi2_Z2_b, chi2_Z2_c) in (228, 2284] (better candidate's cumulative point estimate
      is between cuts)
    interpretation: Z2 helps but does not close on top of Z_c. Per thread branching_rules.Q1B.R-B1B =
