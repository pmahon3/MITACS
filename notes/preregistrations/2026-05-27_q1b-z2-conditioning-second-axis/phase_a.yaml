stopping_criterion:
  reasoning: Pre-registration complete; verdict determined by realized cumulative chi^2 values against
    pre-locked cuts. No iteration, no parameter tuning, no Z2 construction revision after seeing data.
    The head-to-head structure is locked at two candidates (Z2_b binary, Z2_c 4-level categorical per
    P1 production binning); adding a third (e.g., continuous within-day phase variable, or a different
    time_of_day partition) after seeing the results would require a new dated entry per the append-only
    rule.
  rule: Run synthetic recovery + false-Z gate (per baselines.secondary); load pre-cutoff library + post-cutoff
    actuals; derive Z_c from (delivery_day, h) per Q1A's _hour_of_week_bin convention (h ∈ 1..24); derive
    Z2_b and Z2_c from (delivery_day, h) per the time_of_day binning in metric above (P1 production source-of-truth);
    fit M3 per (day_type, Z_c, Z2_b) and per (day_type, Z_c, Z2_c) with MIN_CELL_SIZE = 200 pool-to-(day_type,
    Z_c)-parent fallback; SMC-propagate post-cutoff under each candidate; compute marginal PIT chi^2 per
    candidate; paired-bootstrap CIs and difference CI; verify reproduction check 1 (Q2A 953.84) and check
    2 (Q1A 952.5167); verdict R-A1B / R-B1B / R-C1B per better_chi2 = min(chi2_Z2_b, chi2_Z2_c); emit
    result. STOP.
