    '
- name: nu_estimates_M2_climatology
  value:
    n_bins_fit: 288
    nu_min: 7.02
    nu_median: 300.0
    nu_max: 300.0
    n_bins_at_upper_boundary: 207
    n_bins_at_lower_boundary: 0
    histogram_nu_bins: '[54, 14, 6, 5, 1, 0, 1, 0, 1, 206]  (10 bins from 2.5 to 300)'
  notes: '207 of 288 climatology bins fitted nu at the upper boundary

    (300). This trips the R-D criterion as written in phase_a

    ("MLE pathological: nu > 200"). BUT: nu saturating at the

    upper bound is the Student-t MLE''s CORRECT response when the

    bin-level data is approximately Gaussian. With ~690 samples

    per (m, h) bin, the empirical demand distribution at that

    month-and-hour is close to Gaussian via CLT-like behaviour over

    weather variation. The phase_a criterion conflated "estimator

    broken" with "data is approximately Gaussian at this aggregation

    level" - a phase_a design hole, not an actual estimator

    failure. See arbiter.yaml for the substantive interpretation.

    '
