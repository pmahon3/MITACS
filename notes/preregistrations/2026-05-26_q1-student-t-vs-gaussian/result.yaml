- name: M1_better_than_M2_substantive_finding
  value:
    chi2_M1: 1371.6
    chi2_M2: 1754.1
    M1_better_by: 382.5
  notes: 'Substantively important: adding the Student-t climatology

    (M2''s extra parameters) makes the marginal PIT WORSE, not

    better. The bin-level demand distribution within (month,

    hour-of-day) cells is approximately Gaussian; M2 adds noise

    without capturing real signal. This refutes the proponent''s

    specific sub-prediction that "M1 ~ M2" (M2 marginally better)

    but supports the proponent''s core intuition that the kernel

    family is load-bearing, not the climatology. Heavy-tailedness

    lives in the kappa_1 innovation, not in the seasonal

    climatology - a meaningful refinement of where the missing-

    content programme should look next.

    '
- name: D_RATIO_t_vs_v2_shrinkage
  value:
    v2_D_RATIO_gaussian: 28.96
    Q1_D_RATIO_t_studt: 2.926
    shrinkage_factor: 9.9
  notes: 'v2 (SETTLED) reported D_RATIO = 28.96 under the Gaussian

    kernel at headline cell (h=12, weekday). Under the Student-t

    kernel at the same cell, D_RATIO_t = 2.93 [2.62, 3.24]. This

    is a 10x shrinkage. The honest reading: roughly 90% of v2''s

    headline magnitude was absorbing distributional-class

    misspecification rather than measuring genuine cross-scale

    coherence defect. v2''s SETTLED finding is NOT retracted (the

    defect exists; D_RATIO_t > 1 with tight CI clear of 1), but

    its interpretation requires an asterisk: the magnitude was

    kernel-family-conditional. D_RATIO_t = 2.93 sits below the

    v2 corroboration bar of 5; under the Student-t kernel, the

    relaxed-factorization defect is at the threshold of being

    indistinguishable from finite-sample noise.

    '
