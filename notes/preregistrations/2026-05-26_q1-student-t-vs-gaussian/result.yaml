  notes: 'Both forecasters predicted nu ~ 4.5 based on the

    mitacs-rebaseline-facts excess kurtosis 24-33 mapping

    kurt = 6/(nu-4). Observed: nu = 4.19/4.62/4.61. The kurtosis

