  reasoning: "Two-step:\n\n1. THREAD AMENDMENT: thread-coordinator should add an amendment\n   block to thread.yaml revising the R-D criterion. New criterion:\n   \"MLE pathological IFF the M1 (kernel) fit shows nu at boundary\n   OR fewer than 50% of M2 bins have a meaningful nu (< 200)\".\n   Under this revised criterion, Q1's verdict reads R-C (M2's\n   Gaussian-at-bin-level saturation is no longer pathological).\n   The branching_rules.Q1.R-D = Q2D remains (in case M1 itself\n   fails), but Q1's effective routing becomes R-C -> Q2A.\n\n2. AFTER AMENDMENT: Q2A (richer family) is the natural next\n   node. Q2A's phase_a_skeleton already names mixture and\n   non-parametric extensions. The substantive evidence motivating\n   Q2A:\n     - Student-t reduces chi^2 16x but not to <30\n     - the residual marginal is still U-shaped after the kernel\n       lift (M1 histogram still has substantial extreme-bin mass)\n     - a 2-component or 3-component Gaussian mixture, or a non-\n       parametric\
    \ KDE residual law, is the natural test of\n       \"what predictive class WOULD make the marginal flat.\"\n\n3. SEPARATE WORKFLOW LESSON: this is the third instance of\n   \"pre-registered criterion fires on legitimate-but-unanticipated\n   data structure\" (after eigenmodes-v1, P1). Add to\n   mitacs-session-lessons-corpus as a 4th named failure mode\n   distinct from the original 8 retraction categories. The arbiter\n   pattern handles it cleanly each time; recognise as the\n   workflow's correct answer, not a gap to engineer around.\n"
  proposed_phase_a: 'notes/preregistrations/2026-MM-DD_q2a-richer-family/phase_a.yaml

