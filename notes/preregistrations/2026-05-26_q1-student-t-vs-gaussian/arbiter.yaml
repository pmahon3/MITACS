verdict_reasoning: "Mechanical verdict per phase_a criteria: R-D fires. 207 of 288 M2\nclimatology bins fitted nu at the upper boundary (300), tripping\nthe \"MLE pathological: nu > 200\" rule. This is the third occurrence\nof \"pre-registered criterion fires on legitimate-but-unanticipated\ndata structure\" in the workflow's history (eigenmodes-v1: O2 fires\non near-tie; P1: tautology dominates candidate ranking; Q1: nu\nsaturation conflated with broken estimator).\n\nSubstantive interpretation: nu saturating at the upper bound is the\nStudent-t MLE's CORRECT response when the data is approximately\nGaussian. M2 fits Student-t to ~690 raw demand samples per (month,\nhour) bin; the CLT-like aggregation over weather variation within\nthe bin makes the empirical demand distribution at that month-and-\nhour approximately Gaussian. nu -> upper-bound IS the right answer\nfor ~70% of bins. The phase_a R-D criterion lumped this legitimate\nedge case with \"estimator broken\" \u2014 a phase_a design\
  \ hole.\n\nSubstantively (treating R-D as a criterion artifact), the verdict\nis R-C: min(chi^2_M1, chi^2_M2) = 1371 > 500. The Student-t kernel\nreduces marginal PIT chi^2 by 16x but does not absorb the marginal\npathology. The missing content is not just the kernel family.\n\nThree findings of structural importance:\n\n  1. nu predictions essentially exact. Both forecasters predicted\n     nu ~ 4.5 from the kurtosis mapping; observed 4.19 (weekday),\n     4.62 (saturday), 4.61 (sunday). The mitacs-rebaseline-facts\n     in-sample kurtosis 24-33 mapping holds out-of-sample on the\n     forecast-grade residual.\n\n  2. chi^2 magnitudes both wrong, neither close. Proponent forecast\n     chi^2_M1 = 18 (observed 1371; 76x over); DA forecast 250\n     (observed 1371; 5.5x over). DA closer but neither close. The\n     substantive verdict R-C wasn't on either side's slate.\n\n  3. D_RATIO_t = 2.93 [2.62, 3.24] under Student-t at the v2\n     headline cell. v2's D_RATIO under Gaussian was 28.96.\
  \ The 10x\n     SHRINKAGE means ~90% of v2's headline magnitude was absorbing\n     distributional-class misspecification, not measuring genuine\n     cross-scale coherence defect. Picture (C) is NOT refuted (the\n     defect exists; D_RATIO_t > 1 with CI clear of 1), but v2's\n     SETTLED interpretation requires an asterisk on magnitude:\n     the 29x figure was kernel-family-conditional. Under the\n     corrected kernel, the defect at (h=12, weekday) sits below\n     the v2 corroboration bar of 5.\n\n  4. M1 < M2 on marginal PIT chi^2. The bin-level seasonal\n     climatology IS approximately Gaussian; M2's extra parameters\n     add noise without capturing real signal. Heavy-tailedness lives\n     in the kappa_1 INNOVATION (the conditional residual given recent\n     state), not in the seasonal CLIMATOLOGY (the marginal demand\n     given month and hour-of-day). This refines the missing-content\n     programme: \"where is the heavy-tailedness\" is now answered.\n"
