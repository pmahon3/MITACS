    \ the iteration's\n    SMC particles add modest sampling noise).\n\n(c) On the secondary D_RATIO_t: v2's 29 was computed under the\n    Gaussian-to-Gaussian KL. Under Student-t-iterated-vs-direct\n    with Wasserstein-2, the distributional component of the\n    defect partly absorbs into the kernel-family change. I\n    forecast D_RATIO_t in (5, 15) - shrunk substantially from\n    29 but staying above the corroboration bar 5 (consistent\n    with picture (C) surviving the lift in attenuated form).\n"
