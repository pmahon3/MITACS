strongest_argument: "The proponent's calculation (kurt ~27 -> nu ~4.5) is correct for the\n*one-step* innovation but ignores how the iteration interacts with\nthe heavy tail. The iterated forecast over 24 hours convolves 24\none-step Student-t innovations. The proponent waves at the SMC\npropagation as if it transparently produces the right marginal -\nbut at large h the iterated distribution under heavy-tailed noise\nhas the following features the M0 baseline did NOT have to handle:\n\n(i) The variance of the iterated forecast at h = 24 grows roughly\n    linearly with h (under stationary linear AR with kappa < 1 and\n    finite-variance innovations: Var = sigma^2 * (1 - kappa^{2h}) /\n    (1 - kappa^2), bounded). But heavy-tailed innovations with\n    finite-variance-but-large-kurt produce iterated distributions\n    whose extreme tails grow faster than Gaussian. The marginal\n    forecast scale at h=24 may overshoot the actual h=24\n    distribution.\n\n(ii) The Student-t MLE on the one-step\
  \ residual implicitly assumes\n     the residuals are iid. They are not - the residuals from the\n     iterated kappa_1 fit have temporal correlation that the MLE\n     ignores. Effective sample size is smaller than n; nu estimates\n     biased.\n\n(iii) The marginal PIT integrates over all 24 hours x all 500 days.\n      It pools across a span where the iterated kernel's tail\n      behavior changes with h (heavier-relative-to-Gaussian at\n      small h, less so as iteration averages). The aggregate PIT\n      shape under M1 may be closer to a bimodal U-shape than a flat\n      line.\n\nNet: M1 reduces chi-square substantially (likely by 50-100x, from\n22329 to 200-500) but does not get below 30. This is exactly R-B.\n"
