what_would_change_my_mind:
- If marginal_PIT_chi2_M1 < 30 (R-A fires), the iid-violation and the across-h aggregation concerns are empirically irrelevant in this sample, and the proponent is right that one nu per day-type suffices.
- If R-D fires for a reason I didn't anticipate (e.g., the Student-t MLE on z is unstable at small nu), the experiment hasn't yet given a real answer; Q2D redesign needed.
