hypothesis:
  counter: 'Eval-window noise (the post-cutoff window has a fixed ~12,000 rows of paired-day bootstrap support that finer
    SMC propagation cannot enlarge) dominates the cumulative CI width; doubling N_PARTICLES changes the CI95 width by less
    than 20% in either direction, leaving the realized width in (357.27, 524.0] and firing R-B1B''. The substantive consequence
    is the same in either CI band: the user adjudication of the (a)/(b)/(c) amendment paths surfaced in Q1B''s S4 advance
    proceeds on substantive prior + structural reasoning rather than waiting for the SMC-tightening lever to deliver a narrower
    CI. See devils_advocate.yaml (stamped separately) for the full counter-forecast.'
  proponent: SMC particle-count noise is the dominant component of Q1B's cumulative_chi2_improvement_above_Z_c CI width; doubling
    N_PARTICLES from 200 to 400 (which halves SMC sampling variance per the 1/N central limit scaling) tightens the cumulative
    CI95 width to <= 357.27 chi^2 (<= 75% of Q1B's realized 476.358 chi^2), firing R-A1B'. See proponent.yaml (stamped separately)
    for the full forecast including the point-shift sub-prediction and what would change the proponent's mind.
metric: "PRIMARY: realized 95% CI WIDTH on cumulative_chi2_improvement_above_Z_c at the (day_type, Z_c, Z2_c) configuration\
  \ after re-running experiment/q1b_z2_conditioning/__main__.py with --n-particles 400.\n\n  cumulative_chi2_improvement_above_Z_c\
  \ = 952.5167 - better_chi2_Z2_c\n  (where 952.5167 is Q1A''s settled M3 sigma=(day_type, Z_c) chi^2 anchor;\n  see baselines.primary)\n\
  \nThe CI95 is computed by the existing paired-day bootstrap convention (1000 resamples, paired-day with within-day correlation\
  \ preserved, _Z2_BOOT_OFFSET=8013) shared with Q1B; doubling N_PARTICLES does NOT change the bootstrap scheme. Per resample:\
  \ re-run M3 per (day_type, Z_c, Z2_c) cell on the resampled rows; SMC-propagate post-cutoff under N=400 particles; recompute\
  \ marginal PIT chi^2; recompute cumulative chi^2 improvement above the Z_c-only baseline.\n\nVERDICT CUTS (PRE-LOCKED per\
  \ user direction; see thread.threshold_derivations for the algebra and source-artifact traceback):\n\n  R-A1B'' fires if:\
  \ realized CI95 width <= 357.27 chi^2 (<= 75% of Q1B''s realized 476.358 chi^2 width)\n  R-B1B'' fires if: realized CI95\
  \ width in (357.27, 524.0] chi^2 (mixed; SMC noise contributes but eval-window-noise is non-trivial)\n  R-C1B'' fires if:\
  \ realized CI95 width > 524.0 chi^2 OR |better_chi2_point - 662.223| > 50 chi^2 (widens, OR point shifts more than Monte-Carlo\
  \ noise allows; anomaly warranting investigation before further amendment)\n\nPOINT-STABILITY SUB-CRITERION (pre-locked;\
  \ PRIMARY-side qualifier on R-A1B'' and R-B1B'' verdicts): if |better_chi2_point - 662.223| > 50 chi^2 the verdict is R-C1B''\
  \ regardless of the CI width band, because a point shift larger than the script''s _REPRODUCTION_TOL_CHI2 indicates the\
  \ SMC doubling has not merely reduced variance but has shifted the realized estimate. The 50 chi^2 threshold matches the\
  \ existing experiment/q1b_z2_conditioning/__main__.py:134 _REPRODUCTION_TOL_CHI2, which is documented as ~1 sigma of Q2A''s\
  \ bootstrap distribution. Doubling SMC particles should leave the seeded point estimate within this 1-sigma envelope; a\
  \ shift > 50 chi^2 is an anomaly (seed dependence, library drift, or another methodological issue worth diagnosing).\n\n\
  SECONDARY / informational (the result artifact must report these alongside the primary verdict):\n  - cumulative_chi2_improvement_above_Z_c\
  \ full CI95 bounds (low, high), not just the width; for symmetry diagnostic against Q1B''s [+8.064, +484.423] (Q1B''s CI\
  \ was right-skewed; if N=400 symmetrizes it, that is itself informative about which bound is SMC-driven).\n  - better_chi2\
  \ full CI95 bounds + width (cross-comparison to Q1B''s [468.094, 944.452]; same 476.358 width by construction of the cumulative\
  \ metric, since cumulative = 952.5167 - better_chi2).\n  - chi2_Z2_b and chi2_Z2_c full point + CI95 (the script re-runs\
  \ both head-to-head branches at N=400; Z2_c is the verdict-relevant branch but Z2_b is informational and reported for completeness).\n\
  \  - chi2_diff (Z2_b - Z2_c) + CI95 at N=400 (head-to-head sub-finding; reported for whether the NEAR- TIE designation at\
  \ N=200 survives at N=400; not a verdict input).\n  - Per-(day_type, Z_c, Z2_c) cell mixture parameters + per-cell chi^2\
  \ contributions at N=400 (informational; cross-comparison to Q1B''s per-cell decomposition, in particular the dominant saturday__zc6__zr1\
  \ morning_ramp cell at chi^2=967 from Q1B).\n  - Reproduction-check values: repro_chi2_no_z (Q2A anchor) and repro_chi2_zc\
  \ (Q1A anchor), with N=400 SMC drift values relative to the settled Q2A 953.84 and Q1A 952.5167; see baselines.secondary\
  \ for the N-shift carve-out semantics (drift > tol is informative side-channel, NOT a failed gate -- but the existing assert\
  \ WILL halt execution; result.yaml must capture the value in execution_deviations regardless of pass/fail).\n"
