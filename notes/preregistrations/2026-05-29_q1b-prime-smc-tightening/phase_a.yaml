ci_method:
  details: '1000 paired-day bootstrap resamples of post-cutoff days (pair = (delivery_day, day_type) preserving within-day
    correlation; same scheme as Q1B, Q1A, Q2A, P1). _Z2_BOOT_OFFSET=8013 (Q1B''s bootstrap seed; held constant per variables.excluded).
    Per resample: refit M3 per (day_type, Z_c, Z2_c) cell on the resampled rows; SMC-propagate post-cutoff with N=400 particles;
    recompute marginal PIT chi^2 per candidate; recompute cumulative_chi2_improvement_above_Z_c = 952.5167 - better_chi2.
    Report 95% percentile CI on cumulative_chi2_improvement_above_Z_c, better_chi2, chi2_Z2_b, chi2_Z2_c, and the head-to-head
    chi2_diff. The bootstrap scheme is identical to Q1B; only N_PARTICLES in the SMC propagation step changes.'
  type: paired_day_bootstrap
  width: 95 percent percentile interval
corroboration_criterion:
  numeric: cumulative_chi2_improvement_above_Z_c CI95 width <= 357.27 chi^2 AND |better_chi2_point - 662.223| <= 50 chi^2
    (R-A1B' fires).
  reasoning: '357.27 = 75% of Q1B''s realized 476.358 chi^2 CI width. A 25% width reduction under N_PARTICLES doubling implies
    V_smc/V_total >= 0.875 (the SMC variance component must be at least 87.5% of total variance for total width to shrink
    to 75% under V_smc -> V_smc/2 from the 1/N scaling). This is the "SMC particle noise dominates" signal in its strong form.
    The point-stability sub-criterion conjunct prevents a misleading R-A1B'' where the CI tightens because the realized point
    shifted to a region with lower local variance (e.g., away from the saturday__zc6__zr1 cell at chi^2=967 that dominated
    Q1B''s per-cell decomposition); requiring |point - 662.223| <= 50 keeps the R-A1B'' verdict semantically attached to the
    variance reduction interpretation. Substantive consequence of R-A1B'': the tightened CI clears the way for clean adjudication
    of the (a)/(b)/(c) amendment paths surfaced in Q1B''s S4 advance, OR justifies a second denser tightening run (Q1B''''
    at N=800) before further substantive amendments -- but Q1B'''' would require a new dated entry per stopping_criterion
    below; it is NOT a continuation of Q1B''.'
data:
  cutoff_handling: Identical to Q1B per phase_a §data.cutoff_handling in ../2026-05-27_q1b-z2-conditioning-second-axis/phase_a.yaml.
    Pre-cutoff library fits per-cell mixture parameters (w1, w2, s1, s2); post-cutoff is used only for SMC propagation and
    marginal PIT chi^2 evaluation. No leakage. Q1B' does not change the cutoff or the partition; only N_PARTICLES.
  partition:
    dev: not used (the within-cell EM fit is deterministic; no held-out validation for hyperparameter tuning).
    test: post-cutoff actuals (post spec.data_cutoff) for SMC particle propagation + paired-day bootstrap + marginal PIT chi^2
      evaluation; identical to Q1B's post-cutoff window.
    train: pre-cutoff library (load_pre_cutoff_actuals at the spec.data_cutoff) for per-(day_type, Z_c, Z2_c) M3 mixture refits;
      identical to Q1B's library.
  source: Ontario IESO demand (cfg.paths.historical_csvs); identical loaders and identical partition as Q1B (load_actuals
    + zscore_transform + load_pre_cutoff_actuals at cfg.data.day_anchor_hours=07; same embedding_dims from spec[predictor][embedding_dims];
    same Z_c column derivation from (delivery_day, h) per Q1A's _hour_of_week_bin convention; same Z2_c column derivation
    from P1 production _time_of_day_label(h)). No new data source; no Z-column construction change.
falsification_criterion:
  numeric: cumulative_chi2_improvement_above_Z_c CI95 width > 524.0 chi^2 OR |better_chi2_point - 662.223| > 50 chi^2 (R-C1B'
    fires).
  reasoning: '524.0 = ~110% of Q1B''s realized 476.358 chi^2 CI width. Widening under denser SMC contradicts the basic SMC
    SE-scaling argument (SMC variance scales 1/N; doubling N should not increase total CI width unless library-fit drift,
    seed dependence, or another anomaly is introduced -- and Q1B'' holds library, seeds, and bootstrap convention fixed per
    variables.excluded). 110% admits paired-day bootstrap finite- sample noise without making R-C1B'' trivially unfireable
    (a strict width-must-not-grow threshold at 100.001% would be unfalsifiable in practice given bootstrap variance on the
    realized width itself). The point-stability sub-criterion (|better_chi2_point - 662.223| > 50) catches the orthogonal
    failure mode: SMC doubling has not merely reduced variance but has shifted the realized point, which indicates seed-dependence
    or library-fit drift worth diagnosing before any further amendment. The 50 chi^2 threshold is the script''s existing _REPRODUCTION_TOL_CHI2
    (~1 sigma of Q2A''s bootstrap distribution) inherited as the point-shift tolerance; doubling SMC particles should leave
    the seeded point within 1 sigma of the N=200 realization.'
