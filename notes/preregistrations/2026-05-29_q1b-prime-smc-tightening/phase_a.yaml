    adjudicates the (a)/(b)/(c) amendment paths surfaced in Q1B's S4 advance on substantive prior + structural reasoning rather
    than waiting for further CI narrowing. (a) = thread amendment adding a third within-data Z axis (P1's remaining axes season
    0.135 / demand_quantile 0.075; weaker prior support than Q1B's time_of_day 0.485 but cross-axis joint hypothesis newly
    validated by Q1B's 290 chi^2 cumulative reduction); (b) = spawn a new thread targeting cross-axis joint stratification
    systematically; (c) = pivot to temperature / exogenous-Z arm (Q1C reopening amendment or new thread per the framework-prescribed
    resolution paths in disintegration_diagnostic.md). Per thread branching_rules.Q1B'.R-B1B' = null, no auto-advancement
