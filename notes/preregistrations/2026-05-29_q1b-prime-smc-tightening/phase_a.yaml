baselines:
  primary: 'Q1B''s settled realized 95% CI WIDTH on cumulative_chi2_improvement_above_Z_c = 476.358 chi^2 (CI [+8.064, +484.423],
    settled point +290.293). Source artifact: ../2026-05-27_q1b-z2-conditioning-second-axis/result.yaml, primary_result.cumulative_chi2_improvement_above_Z_c_ci95
    (body_sha256 b3b1efa7d028cd6caa6220493847a5d2b8fa6de957814211df01df6294baaa6d). The cumulative-baseline reference for
    the metric itself is Q1A''s settled M3 sigma=(day_type, Z_c) chi^2 = 952.5167 (carryforward held constant per pre-commitment
    4); this is the unchanged anchor against which cumulative_chi2_improvement_above_Z_c is computed both at N=200 and at
    N=400. The R-A1B'' / R-B1B'' / R-C1B'' cuts are RELATIVE to Q1B''s 476.358 CI width (75% and 110% multipliers respectively);
    see thread.threshold_derivations for the algebra. Q1B''s realized point 662.223 (better_chi2_Z2_c) is the point-stability
    anchor for the sub-criterion.'
  secondary: "DUAL-ANCHOR REPRODUCTION CHECKS at N=400 (same gates as Q1B's §metric.SECONDARY reproduction-check #1 and #2;\
    \ the script's BLOCKING assertions at experiment/q1b_z2_conditioning/__main__.py:1434 and 1464 remain in force):\n\n \
    \ Check #1 (Q2A anchor): re-run M3 with sigma=(day_type) on the pre-cutoff library; SMC-propagate at N=400; expect repro_chi2_no_z\
    \ ~953.84 (Q2A's settled M3 chi^2). The tolerance is _REPRODUCTION_TOL_CHI2=50.0 (experiment/q1b_z2_conditioning/__main__.py:134).\n\
    \n  Check #2 (Q1A anchor): re-run M3 with sigma=(day_type, Z_c) on the pre-cutoff library; SMC-propagate at N=400; expect\
    \ repro_chi2_zc ~952.5167 (Q1A's settled M3 chi^2). Same tolerance 50.0.\n\nN_PARTICLES-SHIFT SEMANTICS AT N=400 (PRE-COMMITMENT\
    \ 3 CARVE-OUT, VERBATIM FROM USER DIRECTION + NODES.Q1B'.NOTES IN THREAD.YAML): the existing assertions at lines 1434\
    \ and 1464 call SMC with M=args.n_particles. At N=400 the SMC trajectories diverge from the seed-exact N=200 path (the\
    \ SEED_BASE_Q2A / SEED_BASE_Q1A seeds are held constant, but the M-particle ensemble sampled from the per-cell mixture\
    \ parameters differs in higher-order draws when M changes; reproduction is bit-identical only at fixed M). Drift could\
    \ be within the existing tol=50 chi^2 or above it. Phase_a treats the drift AS PART OF THE MEASUREMENT, not as a methodology\
    \ defect:\n\n  - If both reproduction checks PASS within 50 chi^2 of their respective anchors, the dual-anchor framing\
    \ survives at N=400 and the primary verdict (on cumulative CI width) is interpretable against Q1B's 476.358 anchor.\n\n\
    \  - If either reproduction check FAILS at N=400 (drift > 50), THAT ITSELF IS EMPIRICAL EVIDENCE that SMC variance at\
    \ N=200 was non-trivial in the parent Q1B / Q1A / Q2A fits -- informative SIDE-CHANNEL, NOT a failed gate.\n\n  CATCH-AND-REPORT\
    \ SEMANTICS (preregister's call per the thread node note's explicit grant of authority): the existing assert statements\
    \ at lines 1434 and 1464 ARE NOT CARVED OUT in this phase_a. Q1B' does NOT amend the production script. If the assert\
    \ halts execution, the preregister's intent is preserved as follows: (1) the realized repro_chi2_no_z and repro_chi2_zc\
    \ values printed by the script before the assert are captured (script lines 1428-1430 and 1458-1460 print the values),\
    \ (2) result.yaml's execution_deviations field records the assert halt with the realized values and the |diff| from each\
    \ anchor, (3) the primary verdict (CI width on cumulative_chi2_improvement _above_Z_c) is reported as MISSING in result.yaml\
    \ with explanation that the dual-anchor framing did not survive at N=400 (this is itself the side-channel finding), and\
    \ (4) the arbiter's verdict at that point is on the side-channel signal alone (the SMC variance at N=200 was non-trivial;\
    \ doubling N revealed it). If the assert PASSES (both |diff| <= 50), result.yaml reports the primary verdict normally\
    \ alongside the realized repro |diff| values (which are informative regardless of pass/fail). NOTE: the arbiter is not\
    \ bound by this phase_a to render R-A1B''/R-B1B''/R-C1B'' if the primary metric is MISSING; the side-channel verdict is\
    \ the legitimate alternative recourse and is pre-registered HERE rather than left to arbiter discretion.\n"
