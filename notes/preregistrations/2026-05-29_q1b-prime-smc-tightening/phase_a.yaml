research_question: Does Q1B's realized cumulative_chi2_improvement_above_Z_c CI95 width (476.358 chi^2 at N_PARTICLES=200)
  narrow under denser SMC propagation (N_PARTICLES=200 -> 400, all other methodology identical), or is the wide CI dominated
  by eval-window-noise (12,000-row post-cutoff window + paired-day bootstrap finite-sample variance) intrinsic to the data
  rather than to the estimator? The verdict metric is the realized 95% CI WIDTH on cumulative_chi2_improvement_above_Z_c at
  the winning (day_type, Z_c, Z2_c) configuration; the secondary point-stability sub-criterion confirms the SMC doubling has
  not destabilized the point estimate (a sign of seed dependence or another methodological anomaly).
schema: phase_a
stopping_criterion:
  reasoning: Scope creep at the empirical-CI-tightening level is the failure mode this phase_a prevents. The decision after
    Q1B' fires its verdict is the (a)/(b)/(c) amendment-direction adjudication surfaced in Q1B's S4 advance, NOT a Q1B'' at
    N=800. If R-A1B' fires and the user wants further tightening before substantive amendment, that is a legitimate new line
    of inquiry and gets a new dated entry; the append-only rule preserves the chain. If R-B1B' fires, the user adjudicates
    (a)/(b)/(c) on substantive grounds; another tightening run would be silent post-hoc adaptation (the user might continue
    running Q1B'' at higher N until the CI narrows by chance, an argmin-without- variance failure mode). If R-C1B' fires (widens
    or point-shift), the next step is diagnostic investigation of the anomaly, not another tightening run.
  rule: 'One run of experiment/q1b_z2_conditioning/__main__.py with --n-particles 400 is sufficient. The verdict (R-A1B''
    / R-B1B'' / R-C1B'') is determined by the realized CI95 width on cumulative_chi2_improvement_above_Z_c at the (day_type,
    Z_c, Z2_c) configuration plus the point-stability sub-criterion |better_chi2_point - 662.223| <= 50 chi^2. Re-running
    with a different SMC seed (changing SEED_BASE_Q2A / SEED_BASE_Q1A / _TAG_SEED_OFFSET_M3 / _Z_SEED_OFFSET_Q1A _Z_c / _Z2_SEED_OFFSET
    / _Z2_BOOT_OFFSET) or a different N_PARTICLES value (N > 400 to chase a narrower CI; N != 400 to spot-check) is a DEVIATION
    REQUIRING A NEW DATED ENTRY per the registry append-only rule, NOT a continuation of Q1B''. Specifically: a Q1B'''' at
    N=800 would be a NEW pre-registration (e.g., 2026-MM-DD_q1b-doubleprime- smc-tightening) referencing Q1B'' as predecessor,
    with its own phase_a / proponent / devils_advocate / result / arbiter chain. STOP.'
