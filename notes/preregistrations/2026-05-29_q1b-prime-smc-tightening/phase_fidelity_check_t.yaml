rule_1_metric_class:
  detail: "Skeleton (nodes.\"Q1B'\".phase_a_skeleton.metric_class) prescribes\n\"Empirical CI-tightening on Q1B's settled\n\
    cumulative_chi2_improvement_above_Z_c statistic. Single arm: re-run\nQ1B's winning (day_type, Z_c, Z2_c) configuration\
    \ with\nN_PARTICLES=400 (vs Q1B's 200). All other methodology identical\n(library, fitter, SMC seed convention, paired-day\
    \ bootstrap\nconvention, dual reproduction-check anchors). Verdict metric is the\nrealized 95% CI WIDTH on cumulative_chi2_improvement_above_Z_c.\n\
    Q1B's realized width was 476.358 chi^2 ([+8.064, +484.423]).\"\n\nPhase_a.metric \xA7PRIMARY (lines 133-139) specifies\
    \ \"realized 95% CI\nWIDTH on cumulative_chi2_improvement_above_Z_c at the\n(day_type, Z_c, Z2_c) configuration after\
    \ re-running\nexperiment/q1b_z2_conditioning/__main__.py with --n-particles 400\",\nwith the explicit metric formula\n\
    cumulative_chi2_improvement_above_Z_c = 952.5167 - better_chi2_Z2_c.\n\nMatch check:\n  - statistic: cumulative_chi2_improvement_above_Z_c\
    \ \u2713\n  - configuration: (day_type, Z_c, Z2_c) \u2713 (Q1B's settled winner)\n  - single arm: --n-particles 400 vs\
    \ Q1B's 200 \u2713\n  - bootstrap convention: paired-day, n=1000, same seed convention\n    per phase_a \xA7ci_method\
    \ (lines 60-69) \u2713\n  - reproduction-check anchors: Q2A 953.84 + Q1A 952.5167 \u2713\n    (phase_a \xA7baselines.secondary\
    \ lines 27-58)\n\nPhase_a adds verdict-relevant detail the skeleton sketched but did\nnot fully specify: a POINT-STABILITY\
    \ sub-criterion\n(|better_chi2_point - 662.223| <= 50 chi^2) that qualifies R-A1B'\nand R-B1B' by mapping point shifts\
    \ > 50 to R-C1B'. The skeleton\nhas this in its outcome_categories description for R-C1B'\n(\"CI width > 524.0 OR |better_chi2\
    \ point shift| > 50 chi^2\") so\nthe sub-criterion is skeleton-derived, not a phase_a novelty. The\nadditional methodological\
    \ detail (catch-and-report semantics at\nthe existing BLOCKING assertions at __main__.py:1434/1464, and\nthe side-channel\
    \ verdict carve-out) is permitted detail-addition;\nthe skeleton's nodes.\"Q1B'\".notes explicitly grants the\npreregister\
    \ discretion on this question (\"phase_a may carve out\na catch-and-report rather than carve out the assert itself\n(preregister's\
    \ call when filling phase_a)\").\n"
  rule: 'phase_a.metric must be a specific instance of the skeleton''s

    metric_class. Skeleton''s metric_class is empirical-CI-tightening on

    cumulative_chi2_improvement_above_Z_c CI95 width with N_PARTICLES

