rule_3_outcome_categories:
  detail: "Skeleton outcome_categories:\n  - R-A1B': CI width <= 357.27 (<= 75% of Q1B's 476.358; SMC noise\n    dominant)\n\
    \  - R-B1B': CI width in (357.27, 524.0] (mixed)\n  - R-C1B': CI width > 524.0 OR |better_chi2 point shift| > 50\n   \
    \ chi^2 (widens or shifts)\n\nPhase_a \xA7corroboration_criterion (lines 71-85, R-A1B'):\n  \"CI95 width <= 357.27 chi^2\
    \ AND |better_chi2_point - 662.223|\n  <= 50 chi^2\" \u2713 matches skeleton's <= 357.27, adds point-stability\n  sub-criterion\
    \ as conjunct (skeleton-derived, see Rule 1).\n\nPhase_a \xA7ambiguous_region (lines 2-16, R-B1B'):\n  \"CI95 width in\
    \ (357.27, 524.0] chi^2 AND |better_chi2_point -\n  662.223| <= 50 chi^2\" \u2713 matches skeleton's (357.27, 524.0],\n\
    \  adds point-stability conjunct.\n\nPhase_a \xA7metric verdict cuts (lines 141-146):\n  \"R-A1B' fires if: realized CI95\
    \ width <= 357.27 chi^2\"\n  \"R-B1B' fires if: realized CI95 width in (357.27, 524.0] chi^2\"\n  \"R-C1B' fires if: realized\
    \ CI95 width > 524.0 chi^2 OR\n                   |better_chi2_point - 662.223| > 50 chi^2\"\n  \u2713 matches skeleton\
    \ verbatim.\n\nADVISORY (non-blocking, internal-clerical): phase_a\n\xA7falsification_criterion (line 104) states\n  \"\
    CI95 width >= 524.0 chi^2 OR |better_chi2_point - 662.223|\n   > 50 chi^2 (R-C1B' fires)\"\nusing >= (non-strict) where\
    \ \xA7metric verdict cuts (line 145) and\n\xA7ambiguous_region range (line 15) both use > (strict) consistent\nwith the\
    \ skeleton's strict > at the R-C1B' lower bound. At width =\nexactly 524.0 with |point shift| <= 50, \xA7metric and \xA7\
    ambiguous_region\nfire R-B1B'; \xA7falsification_criterion fires R-C1B'. The \xA7metric\nblock is the authoritative verdict-cuts\
    \ statement (it is the\nfield the arbiter reads when rendering against pre-registered\ncriteria); \xA7falsification_criterion's\
    \ >= is a clerical typo that\ndoes NOT relocate the skeleton's R-B1B' / R-C1B' boundary (skeleton\nis strict >). Probability-zero\
    \ impact on any realized bootstrap\nwidth (continuous distribution), but the inconsistency is worth\na one-character normalization\
    \ (>= \u2192 >) before arbiter reads\nphase_a as the binding spec. ADVISORY, not BLOCKING; the skeleton-\nfacing surfaces\
    \ (\xA7metric, \xA7ambiguous_region) match the thread.\n\nNone of the skeleton's outcome categories are missing, redefined\n\
    in scope, or extended (no new R-D, etc.). The (a)/(b)/(c)\namendment-path adjudication referenced in \xA7ambiguous_region\
    \ is\nexplicitly NOT a verdict path; it is post-settlement user dispatch\nwork informed by but not governed by Q1B''s\
    \ outcome. The skeleton's\nbranching_rules.Q1B' = {R-A1B': null, R-B1B': null, R-C1B': null}\ncorrectly carries through:\
    \ none of the three outcomes auto-advance\nthe thread state machine, consistent with the non-gating-sibling\nstructure\
    \ introduced by amendment A2.\n"
  rule: 'phase_a.falsification_criterion / corroboration_criterion /

    ambiguous_region must specialize the skeleton''s outcome_categories

    exactly. Skeleton has R-A1B'' (CI width <= 357.27), R-B1B'' ((357.27,

