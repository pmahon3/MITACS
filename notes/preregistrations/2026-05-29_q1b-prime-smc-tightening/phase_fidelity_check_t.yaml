    \ as a condition.\n\n3. field: cumulative_baseline (skeleton-permitted detail-addition).\n   source_artifact: ../2026-05-27_q1a-z-conditioning-strongest-axis/result.yaml\n\
    \   source_value: 'primary_result.value.chi2_Z_c = 952.5167 (Q1A''s\n     settled M3 chi^2 with sigma=(day_type, Z_c)).'\n\
