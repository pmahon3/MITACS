what_would_change_my_mind:
- condition: realized CI width on cumulative_chi2_improvement_above_Z_c at N=400 <= 357.27 chi^2 (R-A1B' fires per phase_a
    corroboration_criterion)
  interpretation: 'My eval-window-dominance forecast is decisively falsified; V_smc/V_total >= 0.875 at N=200 and the proponent
    wins. The chi2_diff paired-SE decomposition I used as the eval-window-floor proxy was wrong (or the f~2.62 amplification
    factor from chi2_diff scale to chi2_Z2_c scale was a substantial under-estimate). Methodological calibration: SMC variance
    was the dominant component of Q1B''s wide CI; further tightening to N=800 might yield additional gains, and the R-A1B''
    tightened CI clears the way for clean (a)/(b)/(c) adjudication.'
- condition: '|better_chi2 at N=400 - 662.223| > 50 chi^2 (R-C1B'' fires per point-stability sub-criterion)'
  interpretation: My "modest point shift" forecast (22 chi^2 [5, 47]) is wrong; SMC seed-dependence or library-fit drift is
    non-trivial. This refutes the "SMC bias scales 1/M, modest" reading and indicates the SMC pipeline has instability worth
    diagnosing before any further amendment. The verdict is R-C1B' regardless of the CI band, so my R-B1B' forecast is mechanically
    wrong even if the CI width itself lands in R-B1B'.
- condition: realized CI width on cumulative_chi2_improvement_above_Z_c at N=400 > 524.0 chi^2 (R-C1B' fires per falsification_criterion
    CI-widening branch)
  interpretation: CI widens under denser SMC, which contradicts the basic 1/N SE-scaling argument. My forecast upper CI 1.01
    admits this barely (allows width up to 480 = share 1.008); a realized width > 524 (share > 1.10) indicates library drift,
    seed-dependence, or another anomaly. R-C1B' fires on CI grounds; my forecast was direction-correct (modest tightening,
    not R-A1B') but magnitude-wrong on the central tendency.
- condition: reproduction_check_no_z |diff from Q2A 953.84| > 50 chi^2 OR reproduction_check_zc |diff from Q1A 952.5167| >
    50 chi^2 (either blocking assert halts execution)
  interpretation: My reproduction-check drift forecasts (5 chi^2 each, CI [0, 35]) are wrong. The script halts and the primary
    verdict is MISSING; the arbiter renders on the side-channel signal (SMC variance at N=200 was non-trivial). This is BROADLY
    consistent with my "SMC variance non-zero but bounded" reading IF the side-channel verdict is "modest" (e.g., drifts ~50-100
    chi^2). It is INCONSISTENT with my reading if drifts are >> 100 chi^2 (which would suggest seed-dependence or library-fit
    issues rather than pure particle-count Monte-Carlo noise). My forecast is robust in interpretation if drifts are in [50,
    100]; not robust if drifts are >100.
- condition: V_smc/V_total estimated post-hoc from Q1B prime realized CIs (using the same chi2_diff paired-SE decomposition
    I used in the strongest_argument) is observed to be > 0.40
  interpretation: 'My variance-decomposition empirical proxy was wrong: chi2_diff paired SE 44.71 was NOT a clean eval-window-noise
    floor proxy; SMC noise does NOT cancel cleanly in the chi2_diff because the Z2_b and Z2_c branches are not propagated
    under bit-identical particle draws at N=400 (the seed structure I assumed does not hold under the M-particle resampling
    at higher M). My empirical anchor for the V_smc/V_total ratio collapses, and the forecast point 419 chi^2 may have been
    an under-estimate of the tightening. The R-B1B'' verdict may still fire, but my forecast was poorly calibrated on the
    central tendency.'
- condition: Q1A's historical CI on cumulative_chi2_improvement above the Q2A baseline at N=200 turns out to have been WIDER
    than Q1B's, not narrower (overturning my "joint-stratification subdivision drives wider CIs" argument)
  interpretation: My joint-stratification finite-sample noise argument (failure_mode rank 2) is wrong; Q1B's wider CIs are
    NOT a function of smaller per-cell n_post. Then the residual driver of Q1B's wider CIs is more likely the SMC pipeline's
    sensitivity to the deeper conditioning structure (more cells -> more independent SMC propagation paths -> more SMC variance
    not less). My forecast loses one of its two independent supporting arguments; central tendency may be poorly calibrated.
