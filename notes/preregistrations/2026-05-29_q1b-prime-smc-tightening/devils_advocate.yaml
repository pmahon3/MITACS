opportunity_cost:
  alternative: "Q1B' is a methodological tightening run, not a substantive lever. If the goal is \"decide between (a)/(b)/(c)\
    \ amendment paths from Q1B's S4 advance,\" the cheapest path is for the user to adjudicate on substantive prior + structural\
    \ reasoning, accepting Q1B's wide CI as substantively informative (it says \"joint multi-axis Z gets above zero at lower\
    \ CI but full closure does not fire\"). Q1B' is forecast to yield CI width 419 chi^2 [370, 480] \u2014 substantively the\
    \ same wide-CI reading; the adjudication inputs do not change. The opportunity cost is small (the run is minutes of wall-clock;\
    \ the pre-registration is in hand) but the substantive payoff is also small. The pre-registration discipline value is\
    \ genuine \u2014 registering a methodological-tightening null verdict before further substantive amendment is the right\
    \ shape \u2014 but it is not a critical-path experiment."
  ranking: clear
  ranking_note: Q1B'' is registered, cheap to run (re-uses Q1B''s library + seeds; only --n-particles changes), and provides
    a registered chi^2-side data point on whether Q1B''s wide CI is SMC-noise (proponent) or eval-window-noise (me). The pre-registration
    discipline value is independent of expected outcome. If R-A1B'' fires (refutes me, confirms proponent), Q1B''s wide CI
    was a methodological artifact and tighter CIs can be obtained by denser SMC; that''s a valuable methodological calibration
    finding. If R-B1B'' fires (confirms me), Q1B''s wide CI is substantive and the (a)/(b)/(c) adjudication proceeds on substantive
    grounds. If R-C1B'' fires (widens or point-shifts), the SMC pipeline has a stability anomaly worth diagnosing. All three
    outcomes have non-zero workflow value; my forecast is that R-B1B'' lands centrally and the workflow proceeds without further
    SMC tightening.
outcome: R-B1B'
rationale_summary: "The CI width on cumulative_chi2_improvement_above_Z_c is composed of SMC-propagation variance (V_smc,\
  \ scales 1/M) and eval-window noise (V_eval, fixed at the post-cutoff window + paired-day bootstrap convention). Empirically\
  \ decomposing Q1B's realized CIs using chi2_diff's paired SE 44.71 as the SMC-cancelling between-day variance proxy, V_smc/V_total\
  \ ~ 7% at N=200. The R-A1B' cut at 75% of 476.358 requires V_smc/V_total >= 87.5% \u2014 an extreme prior. Forecast: CI\
  \ width 419 chi^2 [370, 480], 88% of Q1B's anchor (CI lower bound 0.78 just misses the 0.75 R-A1B' cut, central mass and\
  \ upper CI in R-B1B', upper CI 1.01 misses the R-C1B' 1.10 widening cut). Point-shift forecast 22 chi^2 [5, 47], well within\
  \ the 50-chi^2 point-stability sub- criterion envelope. Reproduction-check drifts forecast 5 chi^2 each [0, 35], well within\
  \ the 50-chi^2 BLOCKING tolerance; NEAR-TIE flag survives. Q1A's same-N=200 narrower CIs (compared to Q1B's) are independent\
  \ corroborating evidence that the joint-stratification subdivision (Z_c x Z2 creating smaller per-cell n_post) drives Q1B's\
  \ wider CIs, NOT insufficient particle count. Doubling N=400 cannot add post-cutoff rows; it can only halve the small SMC\
  \ variance component. The substantive thread state (joint S9+S10+S11+S12+S13 bounded-lever picture) is unchanged by the\
  \ Q1B' verdict; the (a)/(b)/(c) amendment adjudication proceeds on substantive grounds regardless."
