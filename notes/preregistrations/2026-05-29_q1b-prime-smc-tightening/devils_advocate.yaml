strongest_argument: "The CI width on cumulative_chi2_improvement_above_Z_c is a composite of two variance sources with very\
  \ different scaling laws under N_PARTICLES doubling. The SMC-propagation variance component V_smc scales as 1/M (M = particle\
  \ count), so N=200 -> 400 halves V_smc. The eval-window-noise component V_eval is fixed by the post-cutoff window size (~12,000\
  \ hourly rows; ~500 paired days at N_BOOTSTRAP=1000) and is INVARIANT under any change to N_PARTICLES \u2014 paired-day\
  \ bootstrap on a fixed sample has irreducible day-to-day variance in the chi^2 statistic. The proponent argument requires\
  \ V_smc/V_total >= 0.875 for total CI width to shrink to <= 75% of Q1B's 476.358 (the R-A1B' cut). That is an extreme prior:\
  \ it asks for SMC particle noise to dominate ~7x over eval-window noise. The empirical signal cutting against it is paired\
  \ SE_chi2_diff = 44.71 chi^2 at Q1B's N=200 (result.yaml primary_result.chi2_diff_ci95 [-53.186, +124.470] -> width 177.65\
  \ / (2*1.96) = 45.32; consistent with the cited paired SE 44.71). The chi2_diff paired-bootstrap variance is purely between-day;\
  \ it has no SMC component (both Z2_b and Z2_c branches are propagated under the SAME particle draw per resample, so SMC\
  \ noise cancels in the difference). That 44.71 chi^2 paired SE is therefore a clean lower-bound proxy for the eval-window-noise\
  \ floor on a chi^2 statistic of this construction. Q1B's cumulative CI half-width is 476.358/2 = 238.179, which corresponds\
  \ to a marginal SE of ~121.5 (assuming normal-percentile CI). The eval-window floor is ~44.71 (chi2_diff SE) extended to\
  \ the chi2_Z2_c absolute scale by a factor accounting for the day-to-day variance amplification when summed over both branches\
  \ rather than differenced \u2014 call this factor f \\in [1.5, 3.0] (informed by Q1B's chi2_Z2_c_ci95 [479.78, 945.41] width\
  \ 465.62 vs chi2_diff CI width 177.66; ratio 2.62). So eval-window SE on chi2_Z2_c is ~ 44.71 * 2.62 = 117.1; total SE 121.5;\
  \ SMC SE component ~sqrt(121.5^2 - 117.1^2) = sqrt(14762.25 - 13712.41) = sqrt(1049.84) = 32.4. Implied V_smc/V_total =\
  \ 1049.84/14762.25 = 0.071, i.e. ~7%. Under N 200->400, V_smc -> V_smc/2 = 524.92, V_total_new = 524.92 + 13712.41 = 14237.33,\
  \ SE_new = 119.32, CI width new = 119.32 * (476.358 / 121.5) = 467.7. That is ~98.2% of Q1B's 476.358 \u2014 a 1.8% tightening,\
  \ squarely in R-B1B' and nowhere near the R-A1B' 357.27 cut. The forecast point estimate of 419 chi^2 builds in a 95% upper-end\
  \ prior for V_smc/V_total (allowing the empirical SE-decomposition to under-estimate V_smc); the central forecast is ~470\
  \ chi^2 (a near-null tightening). Q1A's same-N=200 narrower CIs are an independent corroborating signal: Q1B's extra Z2\
  \ layer subdivides cells further, leaving fewer post-cutoff rows per cell; that's a JOINT-stratification phenomenon, not\
  \ an SMC phenomenon, and doubling N=400 does NOT add post-cutoff rows."
