rationale_summary: 'The proponent argues R-A1B'' fires: SMC particle-count noise IS the dominant variance component in Q1B''s
  476.358 chi^2 CI width, and doubling N_PARTICLES from 200 to 400 will tighten the realized CI width to <= 357.27 chi^2.
  The argument is mathematical (1/N variance scaling), structural (Q1B''s per-fit CI shape and paired-bootstrap diagnostics
  suggest within-pair SMC variance dominates eval-window noise), and per-cell (the largest per-cell chi^2 contributors involve
  cells with library counts in the few-thousand range where SMC propagation is the dominant residual noise source). Point
  forecast: width 338 chi^2 (close to the sqrt(2) asymptotic floor of 337). CI95 [290, 395] straddles the R-A1B''/R-B1B''
  boundary at upper bound to honor calibration warnings. The point-stability sub-criterion is forecast comfortably inside
  the 50 chi^2 envelope (point 15 chi^2, CI [2, 38]) because SMC point bias scales 1/N (not 1/sqrt(N)) and the 12,000-row
  eval-window + 1000-resample bootstrap dominate the point''s sampling distribution. Reproduction checks #1 and #2 are forecast
  to PASS the existing asserts; if either FAILS at N=400, phase_a''s catch-and-report semantics convert the failure into informative
  side-channel evidence FOR the proponent''s position (SMC was contributing non-trivially at the parent layer). The substantive
  consequence of R-A1B'' firing: the tightened CI clears the way for clean user-side adjudication of the (a)/(b)/(c) amendment
  paths surfaced in Q1B''s S4 advance.'
