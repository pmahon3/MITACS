what_would_change_my_mind:
- condition: Realized cumulative_chi2_improvement_above_Z_c CI95 width > 400 chi^2.
  interpretation: 'The SMC-dominance forecast is falsified at the strong form. If the realized width lands above 400, V_smc/V_total
    < ~0.60 (since 400 = sqrt(1 - 0.5*0.6) * 476.358 = sqrt(0.7) * 476.358 = 398.6; equivalently the ratio 400/476.358 = 0.840
    implies sqrt(1 - 0.5*s) = 0.840 so s = 2*(1 - 0.706) = 0.59). The DA''s eval-window-dominance reading would be correct
    in this case: the 12,000-row post-cutoff window contributes more variance than SMC at N=200, and further SMC tightening
    cannot close it. The proponent would lose the discriminating verdict and the substantive consequence (clean adjudication
    of (a)/(b)/(c) amendments) shifts to the (b) or (c) path more than (a) per phase_a stopping_criterion.'
- condition: '|better_chi2_point - 662.223| > 50 chi^2 (point-stability sub-criterion fires R-C1B'').'
  interpretation: 'Phase_a locks: any point shift > 50 triggers R-C1B'' regardless of CI width. The proponent''s forecast
    (point 15, CI [2, 38]) is comfortably inside. A realized shift > 50 indicates SMC seed dependence is real and amendment
    A2''s framing of "doubling N narrows variance without shifting point" is wrong; SMC point bias at N=200 was non-trivial
    (point biased by > 50 chi^2) and the proponent''s point-bias-scales-1/N argument did not deliver the predicted small residual
    at N=400. The substantive read becomes: SMC contribution to Q1B''s reading was structural not just variance, and further
    tightening runs (Q1B'''' at N=800 per stopping_criterion) would be needed before clean adjudication.'
- condition: 'Reproduction-check #1 (Q2A anchor) drift > 50 chi^2 at N=400 (existing assert at line 1434 FAILS).'
  interpretation: 'Phase_a''s catch-and-report semantics fire: result.yaml reports the primary verdict as MISSING and the
    arbiter renders on the side-channel signal alone. The proponent''s position is corroborated at the side-channel layer
    (SMC was non-trivial at the no-Z parent layer); however, the primary metric verdict becomes uncomputable in the clean
    form. The proponent''s payoff is asymmetric in favor: the side-channel reading is the proponent''s position confirmed
    at a different inferential layer, even though the primary R-A1B''/R-B1B''/R-C1B'' verdict cannot be rendered.'
- condition: 'Reproduction-check #2 (Q1A anchor) drift > 50 chi^2 at N=400 (existing assert at line 1464 FAILS).'
  interpretation: 'Same logic as reproduction-check #1, but with a stronger implication: the cumulative-baseline anchor (Q1A
    settled 952.5167) was sensitive to SMC particle count at N=200. The cumulative_chi2_improvement_above_Z_c metric is computed
    against 952.5167 (held constant per pre-commitment 4); if the realized re-baseline at N=400 is meaningfully different,
    the cumulative improvement metric becomes ill-defined even in the side-channel reading. The proponent would lose ranking
    authority over the primary verdict and the substantive consequence shifts to requiring a re-baselining pre-registration
    (a Q1B'''' or similar at N=800 with the cumulative baseline itself re-measured at the higher N) before any further amendment
    to the thread.'
- condition: chi2_diff_ci95 width at N=400 NOT narrowed by >= 30% from Q1B's 177.66 chi^2 (Q1B chi2_diff_ci95 = [-53.19, 124.47]).
  interpretation: The proponent's structural argument that SMC dominates within-pair variance is partially falsified. chi2_diff
    is the head-to-head paired statistic; if its CI width doesn't narrow as expected under SMC doubling, the within-pair variance
    was NOT dominated by SMC at N=200, and instead the eval-window-noise contribution to within-pair variance was substantial.
    This is a softer falsifier than primary-metric failure (informational rather than verdict-relevant per phase_a variables.excluded),
    but it would update the proponent toward "SMC contributes but is not the sole dominant variance source" and lose confidence
    in the strong-form interpretation of R-A1B'.
- condition: Per-cell chi^2 contributions at N=400 redistribute substantially from Q1B's pattern (e.g., saturday__zc6__zr1
    drops below 700 chi^2, or a different cell becomes dominant).
  interpretation: The proponent's per-cell SMC-dominance argument is empirically refuted at the per-cell level. If SMC tightening
    at N=400 substantially redistributes the per-cell contributions, the per-cell chi^2 at N=200 was reflecting SMC propagation
    noise on the specific per-cell PIT empirical CDFs rather than genuine misspecification structure (and the structural reading
    of the contamination IS where P1 said weakens correspondingly). Marginal R-A1B' may still fire mechanically (the SMC argument
    survives at the pooled level), but the substantive picture (contamination concentrated in saturday__zc6__zr1 per Q1B's
    decomposition) becomes harder to defend as a sub-finding worth carrying forward to (a)/(b)/(c) adjudication.
- condition: Inline synthetic gate (the script's BLOCKING gate at experiment/q1b_z2_conditioning/__main__.py inline_synthetic_gate,
    lines ~1320-1410) FAILS at N=400.
  interpretation: The SMC propagation at N=400 has a methodological bug exposed only at the higher particle count (e.g., a
    numerical overflow in the cumulative weight normalization at large M, or an undetected boundary condition in the per-cell
    propagation). The primary verdict becomes uncomputable; arbiter would not render R-A1B'/R-B1B'/R-C1B' but rather flag
    the methodological failure. Proponent loses everything in this case; the script's production-path integrity is the precondition
    for both the primary verdict and the side-channel readings.
