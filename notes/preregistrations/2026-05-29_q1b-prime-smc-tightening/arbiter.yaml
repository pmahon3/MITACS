    honesty" calibration to Q1A''s warning) was correctly directed but still substantially over-confident on the central forecast.


    - devils_advocate: eval-window-noise-dominates-CI-width premise (V_smc/V_total ~ 0.07) was the pre-registered bet. The premise''s DIRECTION (eval-window dominates; SMC contributes but is bounded) is
