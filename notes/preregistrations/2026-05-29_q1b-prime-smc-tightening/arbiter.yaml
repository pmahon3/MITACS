    - PATTERN: when prior evidence (S9+S10+S11+S12+S13) points at joint within-data lever boundedness, methodological-side tightening levers (like SMC particle count) inherit the boundedness — there is
    no within-data lever to find that closes the residual gap (because the gap is in eval-window noise, which is intrinsic to data). Q1B'' is the workflow''s first methodological-side tightening experiment
    to fire NEGATIVELY on its own metric; future methodological-tightening forecasts should pre-register with the prior that within-data methodological levers are also bounded (consistent with the within-data
