verdict_reasoning: 'Mechanical verdict per phase_a.metric.verdict_cuts: R-B1B'' fires unambiguously. Realized cumulative_chi2_improvement_above_Z_c CI95 = [-34.576, +471.622]; CI WIDTH = 471.622 - (-34.576)
  = 506.198 chi^2 ∈ (357.27, 524.0]. Realized better_chi2 = 679.128; point-shift = |679.128 - 662.223| = 16.905 ≤ 50 (point-stability sub-criterion PASS). Combined: R-B1B'' fires on the CI-width band AND
  clears the point-stability conjunct. R-A1B'' (corroboration: width ≤ 357.27) NOT cleared (148.93 chi^2 above cut); R-C1B'' (falsification: width > 524.0 OR point-shift > 50) NOT cleared on either disjunct
  (width is 17.80 chi^2 below 524.0; point-shift is 33.10 chi^2 below 50). Proponent forecast R-A1B'' (width 338 [290, 395]); DA forecast R-B1B'' (width 419 [370, 480]). R-B1B'' matches DA on outcome category;
  the substantive within-band picture is materially different from DA''s implicit prior (see substantive findings below).


  Substantive findings (the verdict is R-B1B'' + the below; both mechanical and substantive verdicts ALIGN on R-B1B'', so there is NO mechanical/substantive gap; the substantive content sharpens the framework-level
  reading):


  1. R-B1B'' FIRES UNAMBIGUOUSLY BUT NEAR THE R-C1B'' BOUNDARY. Realized width 506.198 sits at 89.3% of the R-B1B'' band width (lower edge 357.27; upper edge 524.0; band midpoint 440.63). Lower-edge headroom
  = 148.93 chi^2; upper-edge headroom = 17.80 chi^2. The realized width is 8.4x closer to R-C1B'' than to R-A1B''. This is a structurally different R-B1B'' shape than Q1B''s settled R-B1B (which sat unambiguously
  interior to its (228, 2284] band, 2.05x clear of R-A1B on the low side and 2.42x clear of R-C1B on the high side per Q1B''s arbiter). Q1B'' fires R-B1B'' at the OPPOSITE end of its band — near the widening
  anomaly threshold.


  2. THE CI WIDENED, NOT NARROWED (CENTRAL NEW FINDING). Q1B realized width = 476.358 chi^2 at N=200; Q1B'' realized width = 506.198 chi^2 at N=400. Delta = +29.840 chi^2 (+6.26% WIDENING). Both forecasters
  predicted NARROWING under N doubling (proponent: 25%+ narrowing to ≤ 357.27; DA: 12% narrowing to 419). The realized DIRECTION-OF-MAGNITUDE on width change is OPPOSITE BOTH forecasts. Under the 1/N SMC
  variance scaling argument with V_total = V_smc + V_eval (V_smc → V_smc/2 under N: 200 → 400), a widening realization implies V_smc/V_total well below DA''s 7% lower-bound estimate AND decisively below
  the proponent''s 87.5% requirement. The +6.3% widening is within paired-bootstrap finite-sample noise on the realized width MEASUREMENT itself (phase_a''s 110%-cut at 524.0 acknowledges this as the R-C1B''
  lower-bound rationale), so the central-tendency direction is informative — the CI does NOT narrow under denser SMC because EVAL-WINDOW-NOISE DOMINATES the realized CI width, not SMC particle-level sampling
  variance.


  3. CUMULATIVE-REDUCTION POINT ALSO DECREASED. Q1B cumulative_chi2_improvement_above_Z_c point = +290.293 chi^2; Q1B'' cumulative point = +273.388. Delta at point = -16.905 chi^2 (-5.82%). SMC doubling
  not only widened the CI; it slightly REDUCED the realized closure on top. The DA''s mid-range V_smc estimate predicted a small downward point-shift due to SMC bias correction at higher M (DA forecast
  268 chi^2 cumulative; realized 273.388 is 5.4 chi^2 above DA''s point — closest single forecast surface DA hit). Proponent''s SMC-bias-scales-1/N argument expected point-shift ~15 chi^2 (small); realized
  16.905 is within both forecasters'' point-shift CIs but the DIRECTION of the cumulative-reduction shift (slightly DOWN at point) is consistent with DA''s SMC-bias-correction reading and contrary to proponent''s
  implicit "small symmetric residual" reading.


  4. PROPONENT''S OWN PRE-REGISTERED FALSIFICATION CONDITION TRIGGERED. Proponent.what_would_change_my_mind condition #1: "realized CI width > 400 chi^2 → SMC-dominance forecast falsified at strong form;
  V_smc/V_total < ~0.60." Realized 506.198 >> 400. Proponent registered "the DA''s eval-window-dominance reading would be correct in this case." Proponent''s strong-form forecast is REFUTED by proponent''s
  own pre-registered numeric condition; this is unambiguous, not requiring arbiter judgment.


  5. DA''S MODEST-SMC-VARIANCE READING SURVIVES BUT ON A DIFFERENT INFERENTIAL SURFACE THAN DA''S CI-WIDTH POINT FORECAST. DA''s strongest_argument empirical-decomposition (V_smc/V_total ~ 0.07 from Q1B''s
  chi2_diff paired SE = 44.71 as the eval-window-noise floor proxy) implied a ~98% width retention (realized 467 chi^2; 0.98 share of Q1B''s 476.358 anchor). Realized 506.198 (1.063 share) is HIGHER than
  DA''s central forecast of 419 (0.88 share) by 87.2 chi^2 (DA''s CI [370, 480] entirely below realized by 26.2 chi^2 at the upper bound). The substantive picture DA argued for (eval-window-noise dominates;
  SMC contribution bounded; modest tightening) is empirically confirmed AT THE DIRECTION-OF-DOMINANCE LEVEL (eval-window-noise IS the dominant variance component, refuting proponent''s strong-form SMC-dominance)
  but DA''s WIDTH POINT FORECAST is also falsified on the narrowing direction. Both forecasters got the magnitude direction wrong; both fall below the realized width at CI upper bound. DA''s outcome-category
  bet (R-B1B'') wins mechanically because the R-B1B'' band is wide enough to accommodate the realized widening AS WELL AS DA''s and proponent''s predicted narrowings; the band itself is the unfalsifiability
  zone for direction errors.


  6. POINT-SHIFT FORECASTS BOTH SUCCEED. Realized |better_chi2_point - 662.223| = 16.905. Proponent forecast 15 [2, 38]: realized inside CI; residual +1.905. DA forecast 22 [5, 47]: realized inside CI;
  residual -5.095. Both forecasters got point-stability right: SMC doubling did not destabilize the realized estimate; seed-dependence, library-fit drift, and other R-C1B'' failure modes are empirically
  ruled out. The script''s reproduction-check ASSERTS at lines 1442/1472 also PASSED (within tol=50) at N=400, consistent with point stability at the parent-fit layers as well.


  7. NEAR-TIE BETWEEN Z2_b AND Z2_c PRESERVED AT N=400. Q1B chi2_diff = +33.776 with paired SE = 44.71 (|diff|/SE = 0.756). Q1B'' chi2_diff = +24.107 with paired SE ≈ 38.73 (|diff|/SE = 0.622); CI [-48.154,
  +103.672] straddles zero. Z2_c remains the parsimony-preferred point-estimate winner. The diff distribution moved slightly toward zero (-9.67 chi^2 at point; paired SE narrowed by ~13.4%, consistent with
  marginal SMC contribution to within-pair variance). The NEAR-TIE STRUCTURAL PROPERTY of the head-to-head holds — SMC doubling did not resolve the Z2_b vs Z2_c ranking question. This matches DA''s shape
  forecast (NEAR-TIE preserved; DA predicted paired SE narrowing to ~32 from 44.71; realized 38.73 is between DA''s prediction and Q1B''s anchor).


  8. REPRODUCTION-CHECK DRIFT ASYMMETRY IS INFORMATIVE SIDE-CHANNEL (per phase_a.baselines.secondary). repro_chi2_no_z drift = 5.225 chi^2 (10.5% of tol=50); repro_chi2_zc drift = 44.595 chi^2 (89.2% of
  tol=50). Asymmetry ratio = 8.54x. The Z_c-stratified parent layer (Q1A''s carryforward anchor) is materially more SMC-noise-sensitive at N=200 than the no-Z pooled layer (Q2A''s anchor) — by ~8.5x. This
  is a finite-sample per-stratum effect: Z_c partitions reduce per-cell N from the full library to ~1000-7000-row sub-libraries; the within-stratum SMC particle resampling is less stable than the pooled
  SMC propagation is. Substantively: SMC variance IS non-trivial at the Z_c-stratified parent fit; doubling N revealed it (the drift would have been ~0 if SMC variance contributed nothing). DA''s "modest
  SMC variance" reading is corroborated at this side-channel layer; proponent''s "SMC dominates" reading is NOT corroborated (the no-Z layer drift is essentially zero, demonstrating that pooled SMC variance
  is small even at N=200; if SMC truly dominated the CI width, the no-Z baseline drift would also be material at N doubling).


  9. THE SEVENTH NAMED-FAILURE-MODE INSTANCE (NEW SHAPE VARIANT: BOTH FORECASTS DIRECTIONALLY FALSIFIED ON CENTRAL TENDENCY). Workflow precedent: 4th-named-failure-mode = registered criterion fires on legitimate-but-unanticipated
  data structure. Prior six shapes: (S8/Q1) R-D mechanical / R-C substantive; (S9/Q2A) M3=M4=M5 chi²-indistinguishable; (S10/Q2B) two sign-determined NEGATIVE shares; (S11/P1) hour_of_week-not-season binding;
  (S12/Q1A) near-tie head-to-head with exact DA point forecast; (S13/Q1B) mixed scoring decomposition across forecast surfaces. Q1B''''s NEW SHAPE: BOTH FORECASTERS PREDICTED NARROWING ON OPPOSITE STRONG-FORM
  PRIORS (proponent: SMC-dominates → strong narrowing; DA: eval-window-dominates with SMC contributing → modest narrowing). Realized: WIDENING (+6.3%). The mechanical R-B1B'' band fires because it is wide
  enough to absorb the disagreement (the band spans 357.27-524.0 covering both NARROWING-to-419 and WIDENING-to-506). NEITHER side''s direction-of-magnitude forecast on the verdict-metric is confirmed;
  BOTH are falsified. The outcome-category mechanical match for DA is necessary but not sufficient for substantive forecast confirmation. New shape variant label: "OUTCOME-CATEGORY MATCHES ONE SIDE (DA)
  BUT BOTH SIDES FALSIFIED ON DIRECTION-OF-MAGNITUDE; THE REGISTERED CATEGORY BAND ITSELF IS THE UNFALSIFIABILITY ZONE FOR DIRECTION ERRORS."


  10. FRAMEWORK READING (binding for kernel-family-agnostic theory memo + CLAUDE.md framework section at next refresh). Q1B'' confirms the user''s locked decision (d) framing: the wide Q1B CI [+8.06, +484.4]
  is INTRINSIC TO THE DATA, NOT TO THE ESTIMATOR. SMC-tightening (the methodological lever Q1B'' was designed to test) does not narrow the CI; it slightly widens it. The (a)/(b)/(c) amendment-direction
  adjudication surfaced in Q1B''s S4 advance must proceed on substantive grounds — within-data SMC tightening is empirically EXHAUSTED as a CI-narrowing mechanism. Joint S9+S10+S11+S12+S13 corpus EXTENDS:
  within-data tightening levers are bounded both SUBSTANTIVELY (single-axis vs joint multi-axis sigma-algebra enrichment, per S13) AND METHODOLOGICALLY (SMC particle count doubling does not narrow the realized
  CI). The identifiability obstruction reading (auxiliary information beyond the time index required for full closure) carries forward UNCHANGED; Q1B'' is the methodological-side confirmation of what S13
  established substantively. This is the workflow-level result Q1B'' was registered to produce; the negative-finding outcome was pre-flagged in phase_a §ambiguous_region.action as the most actionable for
  the user''s adjudication of (a)/(b)/(c).


  11. ROUTING: per thread branching_rules.Q1B'' = {R-A1B'': null, R-B1B'': null, R-C1B'': null}, no auto-advancement. Q1B'' is the non-state-machine sibling added by amendment A2 (parent_branch R-A under
  Q1B); per the amendment, settlement does NOT advance current_node_id (which remains null per S4 thread state-history, awaiting user adjudication of three-way amendment decision). The thread-coordinator
  dispatch is structurally similar to Q1B''s S4: Q1B''.status: active → settled; Q1B''.result: R-B1B''; current_node_id transition = none; thread_state_transition = node_settled_no_advance. NO SIBLINGS
  CLOSED. Q1A'' (parallel non-state-machine sibling per amendment A1) is unaffected by Q1B''''s state advancement. P2 remains reachable via Q1C.R-C1C. The user-side decision space for (a)/(b)/(c) is now
  informed by Q1B''''s empirical confirmation that the CI is intrinsic; the (a) third-within-data-Z-axis path is the most-aligned-with-S13''s-joint-multi-axis-finding next-step; (b) cross-axis joint stratification
  thread is the framework-reading-driven option; (c) temperature/exogenous-Z arm remains the framework-prescribed full-closure path. Q1B'' does not statistically rank them; the user adjudicates.'
