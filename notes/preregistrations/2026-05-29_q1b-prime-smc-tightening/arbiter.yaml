  below tol). R-A1B'' (corroboration: width ≤ 357.27 AND |point-shift| ≤ 50) NOT cleared on the CI-width conjunct (realized 506.198 > 357.27). R-C1B'' (falsification: width > 524.0 OR |point-shift| > 50)
  NOT cleared on either disjunct (realized 506.198 < 524.0 AND 16.905 < 50). R-B1B'' fires unambiguously and uniquely.'
reason_substantive: 'Mechanical and substantive verdicts AGREE on R-B1B'' firing. Unlike Q1B (where substantive content pulled toward _SUBSTANTIVE_FAVORABLE because the 290 chi^2 cumulative reduction was
  materially informative), Q1B''''s substantive content is BAND-NEUTRAL on direction (no suffix; verdict is plain R-B1B'') but FRAMEWORK-SHARPENING on interpretation (the verdict confirms what Q1B'' was
  registered to test: SMC-tightening lever does not narrow the CI; eval-window-noise dominates; (a)/(b)/(c) adjudication proceeds on substantive grounds).


  The CENTRAL substantive finding: the CI WIDENED slightly (+29.84 chi^2; +6.3%) rather than narrowing as both forecasters predicted. Both forecasters'' direction-of-magnitude forecasts on the verdict-metric
  are FALSIFIED at the central tendency (proponent predicted ≥25% narrowing to ≤ 357.27 chi^2; DA predicted ~12% narrowing to 419 chi^2; realized +6% widening to 506.198). The registered R-B1B'' band absorbs
  the disagreement because the band itself is wide enough to span both NARROWING-to-419 and WIDENING-to-506; the realized direction-of-magnitude error is INVISIBLE TO THE MECHANICAL VERDICT CATEGORY. This
  is the seventh named-failure-mode instance and the new shape variant: outcome-category mechanical match for DA, but BOTH SIDES falsified on direction-of-magnitude; the registered band itself is the unfalsifiability
  zone for direction errors.


  The framework-reading sharpening: Q1B'' confirms the user''s locked decision (d) framing. The wide Q1B CI on cumulative_chi2_improvement_above_Z_c [+8.06, +484.4] (width 476.358) is INTRINSIC TO THE DATA,
  NOT TO THE ESTIMATOR. Doubling SMC particles (a methodological-side tightening lever) does not narrow it; the residual variance is eval-window-noise (the fixed ~12,000-row post-cutoff window + paired-day
  bootstrap finite-sample noise on a chi^2 statistic of this construction). The within-data tightening levers are bounded both SUBSTANTIVELY (single-axis vs joint multi-axis sigma-algebra enrichment, per
  S13''s finding that joint delivers 40% but full closure does not fire) AND METHODOLOGICALLY (SMC particle count doubling does not narrow the realized CI). The (a)/(b)/(c) amendment-direction adjudication
  surfaced in Q1B''s S4 advance proceeds on substantive grounds; the empirical SMC-tightening lever is empirically EXHAUSTED.


  Reproduction-check side-channel: drift asymmetry (no_z 5.225 vs zc_only 44.595; 8.5x ratio) is informative. The Z_c-stratified parent fit IS more SMC-noise-sensitive at N=200 than the no-Z pooled fit
  (consistent with finite-sample per-stratum SMC variance contributing non-trivially at the per-cell level). DA''s "modest SMC variance" reading is corroborated at this layer; proponent''s strong-form SMC-dominance
  reading is NOT corroborated (if SMC truly dominated the realized CI, the no-Z drift would also be material at N=400, not the observed ~5 chi^2). The asymmetry sharpens the framework reading from S13:
  joint-stratification finite-sample noise is the residual within-data driver of CI width, not the SMC propagation step itself.


  Point-shift sub-criterion satisfied. |better_chi2 - 662.223| = 16.905, well within tol=50. SMC doubling did not destabilize the realized point estimate; R-C1B'' on the point-stability disjunct does not
  fire. Both proponent (15 [2, 38]) and DA (22 [5, 47]) forecasted point-shift correctly; the realized 16.905 falls inside BOTH CIs. This is the one forecast surface where both forecasters succeeded together.


  Near-tie head-to-head preserved at N=400 (chi2_diff = +24.107 with paired SE ≈ 38.73; |diff|/SE = 0.622; CI [-48.154, +103.672] straddles zero). The diff distribution moved slightly toward zero (-9.67
  chi^2 at point) and paired SE narrowed by ~13.4% (consistent with marginal SMC contribution to within-pair variance, validating part of DA''s structural argument about within-pair SMC contribution being
  non-trivial but bounded). Z2_c remains the parsimony-preferred winner.'
