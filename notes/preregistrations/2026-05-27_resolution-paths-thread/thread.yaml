    following Q2B''s convention. Specifically: Single Q1A.R-A1A with share > 0.80
    → RESOLVED (single dominant Z); Q1A.R-B1A + Q1B.R-A1B with cumulative > 0.80 →
    RESOLVED (multi-Z); Cumulative < 0.80 across all tested branches → EXHAUSTED-UNRESOLVED
    (P2 calibration provides closure framing).'
  description: 'The distributional-class-thread was declared exhausted on 2026-05-26
    (commit 543e3e8) following Q2B''s SETTLED R-C3 verdict (commit daad39f). Joint
    S9+S10 evidence (Q2A bounded the kernel-refinement lever; Q2B bounded the pre-registered
    same-Q non-distributional candidates with two sign-determined negative) is consistent
    with the identifiability obstruction — published theorem per Bergna et al. (2026
    Prop 1), Heckman-Singer (1984), Allahverdyan (2020), Andrews-Mallows (1974). See
    the theory-side framework note `~/Research/Mathematics/Resolvent_Framework/notes/unsorted/disintegration_diagnostic.md`
    (PARKED 2026-05-26) and its audit-correction note `disintegration_diagnostic_audit_correction.md`
    (2026-05-27). The framework prescribes three resolution paths to break the structured-noise
    / noisy-structure tie via auxiliary information: (i) candidate-Z testing; (ii)
    stratified covariate-dependent mixture decomposition diagnostic; (iii) synthetic
    Gaussian-DGP calibration. This thread tests these paths against Ontario κ_1 residuals.'
  scope_limits: 'This thread tests the σ-algebra-enrichment axis with auxiliary information.
    It does NOT re-test the distributional-class axis (closed by S9+S10). Results
    are attribution-grade (no deployable predictors); adding Z to the predictor changes
    the conditioning σ-algebra, so results are framed as σ-algebra adequacy / Bayes
    risk reduction, not as predictor improvements. The methods-novelty branch of path
    (ii) was determined dead by literature scout 2026-05-26 (notes/literature/2026-05-26_stratified-patra-sen-scout.md,
    commit 8f0f3f3 / 40b971b): Deb, Saha, Guntuboyina, Sen (2022, JASA, NPMLEmix)
    provides the canonical covariate-dependent generalization. This thread uses plain
    Patra-Sen (2016) per stratum with range-threshold verdict for P1 — sufficient
    for the registered verdict architecture without invoking NPMLEmix''s Mosek dependency.

    '
