nodes:
  P1:
    id: P1
    name: patra-sen-per-stratum-localization
    parent_branch: null
    parent_id: null
    phase_a_path: 2026-05-27_p1-patra-sen-per-stratum-localization/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - demand_quantile
      - time_of_day
      - season
      - day_type
      - hour_of_week
      metric_class: 'Plain Patra-Sen (2016) two-component mixture estimator α̂_L (lower
        95% bound on non-Gaussian mixture fraction) applied per stratum to the standardized
        residuals of Q1''s M1 predictor (Student-t kernel; the best κ_1-only predictor).
        Stratification across 5 axes: demand quantile (terciles), time-of-day (4 bins:
        overnight 00-05 / morning ramp 06-10 / afternoon 11-16 / evening 17-23), season
        (3 bins: winter Nov-Mar / summer Jun-Aug / shoulder Apr-May+Sep-Oct), day-type
        (3: weekday/saturday/sunday), and hour-of-week (collapsed to 8 bins; finer
        than day-type+time-of-day combined). Per axis: report α̂_L per stratum with
        1000 paired-day bootstrap CIs; compute range_axis = max(α̂_L) − min(α̂_L)
        across strata in that axis.

        '
      outcome_categories:
      - R-A: max over axes of range(α̂_L) > 0.20 (Z detectable from current data;
          the binding axis points at where Z is concentrated)
      - R-B: max range in (0.10, 0.20] (marginal variation; Z hint present but not
          localized)
      - R-C: max range < 0.10 (constant across all strata; Z orthogonal to current
          natural conditioning)
    status: settled
  P2:
    id: P2
    name: synthetic-gaussian-DGP-calibration
    notes: 'P2 is triggered when all live R-A branches (Q1A/B/C) fire R-C1A/B/C. Provides
      interpretation framework for the thread-EXHAUSTED-UNRESOLVED case: Ontario''s
      α̂_L excess above the synthetic floor would attribute the residual to structure
      even though no single Z closes the gap.

      '
    parent_branch: null
    parent_id: null
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - gaussian_floor
      - single_Z_recovery
      metric_class: 'Generate synthetic data with: (a) known-Gaussian DGP with matched
        autocorrelation; (b) known covariate-dependent mixture DGP with single-Z structure.
        Run plain Patra-Sen (per P1''s method) on both. Establish α̂_L floor under
        (a); confirm recovery under (b). Provides a reference baseline against which
        Ontario''s α̂_L excess can be attributed.

        '
      outcome_categories:
      - methodology_grade_calibration
    status: planned
  Q1A:
    id: Q1A
    name: Z1-conditioning-strongest-axis
    parent_branch: R-A
    parent_id: P1
    phase_a_path: 2026-05-27_q1a-z-conditioning-strongest-axis/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - strongest_Z_from_P1_R-A
      metric_class: 'Re-fit M3 (mixture-2-Gaussian) with the additional conditioning
        variable Z derived from P1''s strongest-signal stratification axis. Recompute
        marginal PIT χ² on post-cutoff data. Use Q2A''s gate-derived cuts.

        '
      outcome_categories:
      - R-A1A: χ² ≤ 228 (Q2A R-A2 cut; this Z closes the gap; specific Z identified)
      - R-B1A: χ² in (228, 2284] (Z helps but doesn't close; multi-Z needed)
      - R-C1A: χ² > 2284 (Z doesn't help; P1's signal was a false positive or the
          localization missed the actual Z)
      skeleton_thresholds_depend_on:
      - field: binding_axis_and_Z_construction
        rule: Q1A's specific Z is derived from P1's R-A binding axis at result time.
        source: P1.result
    result: R-B1A
    status: settled
  Q1A':
    id: Q1A'
    name: q1a-prime-sdr-ica-sibling
    parent_branch: R-A
    parent_id: P1
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - SIR
      - FastICA
      metric_class: 'Data-driven Z-recovery on κ̂_Q''s PIT residuals via SIR and FastICA
        (head-to-head). Input covariate matrix: the 4 non-hour_of_week P1 axes (demand_quantile,
        time_of_day, season, day_type) plus lagged demand (lag-1, lag-24). hour_of_week
        explicitly EXCLUDED from the input matrix — the discriminating empirical test
        is whether the methods recover an hour_of_week-aligned direction WITHOUT being
        pre-specified. For each method, identify the top component (highest eigenvalue
        for SIR; highest non-Gaussianity for FastICA), project hour_of_week onto a
        cyclic representation (sin/cos pair at the weekly fundamental frequency 2π/168),
        compute |Spearman ρ| between the top component''s loadings and the cyclic
        hour_of_week phase. 1000-rep paired-day bootstrap CIs on each ρ.

        '
      outcome_categories:
      - R-A1A': max(|ρ_SIR|, |ρ_FastICA|) ≥ 0.5 (P1's hand-specified hour_of_week
          IS recovered by at least one data-driven method; SDR/ICA validates the approach)
      - R-B1A': max(|ρ_SIR|, |ρ_FastICA|) in [0.3, 0.5) (partial recovery; methods
          sense the social-weekly structure but don't dominantly identify it)
      - R-C1A': max(|ρ_SIR|, |ρ_FastICA|) < 0.3 (hour_of_week NOT recovered; P1's
          hand-specified axis is either an artifact or below SDR/ICA's sensitivity
          floor)
      skeleton_thresholds_depend_on:
      - field: hour_of_week_cyclic_phase
        rule: cyclic representation computed at the weekly fundamental frequency 2π/168;
          precise sin/cos column construction is the phase_a author's call.
        source: P1.result (binding axis = hour_of_week; weekly fundamental from the
          21-hour bin structure used in P1)
    status: active
  Q1B:
    id: Q1B
    name: Z2-conditioning-second-axis
    notes: 'Predecessor-carryforward from Q1A.R-B1A (arbiter body_sha256 6b49d9136437c1905c6a48f4f8bf6511feeafc4ba7bc01124be6efb14c53ed7c):
      Z1 = Z_c (8-level hour_of_week stratification) is the parsimony-preferred point-estimate
      winner used as Q1B''s cumulative baseline. NEAR-TIE CAVEAT: chi2_diff = +33.5
      [-93, +143] straddles zero (paired SE 56.84 > |diff|); Z_b (binary weekend carve-out)
      and Z_c are statistically indistinguishable on the verdict-metric. Q1B''s phase_a
      author should NOT treat Z_c as definitively the right Z1; the head-to-head sub-finding
      records ''no statistically-discernible winner.'' SUBSTANTIVE PROVISO: the Q1A
      Z lever delivered 0.18% of the gap-to-close (1.3267 out of 725.8433 chi^2 units).
      P1 second-strongest axis is time_of_day at range 0.485 (vs hour_of_week 0.575),
      so the prior on Q1B closing the gap via the same within-data sigma-algebra-enrichment
      lever is even weaker than Q1A''s already-weak prior. Q1B''s phase_a should factor
      this in: either (a) the cumulative-Z1+Z2 multi-Z hypothesis becomes the binding
      test, or (b) the thread approaches EXHAUSTED-UNRESOLVED if Q1B also fires R-B1B/R-C1B
      (R-C1B routes to P2 synthetic calibration per branching_rules.Q1B.R-C1B). The
      temperature prior (clim-gap-nonstationary) remains candidate for the marginal
      pathology but is not in the thread''s live branches; thread amendment to reopen
      Q1C (or a new thread targeting temperature directly) is a natural next move
      if Q1B fires R-B1B/R-C1B.

      '
    parent_branch: R-A
    parent_id: P1
    phase_a_path: 2026-05-27_q1b-z2-conditioning-second-axis/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - second_strongest_Z_from_P1_R-A
      metric_class: 'As Q1A but with Z derived from P1''s second-strongest-signal
        axis. Tests multi-mechanism hypothesis: if Q1A delivers R-B1A (Z1 helps but
        doesn''t close), Z2 may close the gap when combined with Z1.

        '
      outcome_categories:
      - R-A1B: cumulative-with-Z1 χ² ≤ 228 (Z1+Z2 close gap together)
      - R-B1B: in (228, 2284]
      - R-C1B: '> 2284 (Z2 redundant with Z1)'
      skeleton_thresholds_depend_on:
      - field: second_Z_construction
        rule: Q1B's Z2 is the second-ranked axis from P1; Q1B's cumulative χ² is computed
          against Q1A's Z1-conditioned baseline.
        source: P1.result AND Q1A.result
    result: R-B1B
    status: settled
  Q1C:
    id: Q1C
    name: temperature-fallback-prior-supported-Z
    notes: 'Requires exogenous data source. ECCC (Environment and Climate Change Canada)
      historical hourly weather is free, but the data acquisition + alignment is a
      pre-experiment infrastructure cost that must land before Q1C''s phase_a is filled.

