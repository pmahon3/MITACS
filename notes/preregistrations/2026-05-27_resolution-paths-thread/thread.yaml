nodes:
  P1:
    id: P1
    name: patra-sen-per-stratum-localization
    parent_branch: null
    parent_id: null
    phase_a_path: 2026-05-27_p1-patra-sen-per-stratum-localization/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - demand_quantile
      - time_of_day
      - season
      - day_type
      - hour_of_week
      metric_class: "Plain Patra-Sen (2016) two-component mixture estimator \u03B1\u0302_L (lower 95% bound on non-Gaussian\
        \ mixture fraction) applied per stratum to the standardized residuals of Q1's M1 predictor (Student-t kernel;\
        \ the best \u03BA_1-only predictor). Stratification across 5 axes: demand quantile (terciles), time-of-day\
        \ (4 bins: overnight 00-05 / morning ramp 06-10 / afternoon 11-16 / evening 17-23), season (3 bins: winter\
        \ Nov-Mar / summer Jun-Aug / shoulder Apr-May+Sep-Oct), day-type (3: weekday/saturday/sunday), and hour-of-week\
        \ (collapsed to 8 bins; finer than day-type+time-of-day combined). Per axis: report \u03B1\u0302_L per stratum\
        \ with 1000 paired-day bootstrap CIs; compute range_axis = max(\u03B1\u0302_L) \u2212 min(\u03B1\u0302_L)\
        \ across strata in that axis.\n"
      outcome_categories:
      - R-A: "max over axes of range(\u03B1\u0302_L) > 0.20 (Z detectable from current data; the binding axis points\
          \ at where Z is concentrated)"
      - R-B: max range in (0.10, 0.20] (marginal variation; Z hint present but not localized)
      - R-C: max range < 0.10 (constant across all strata; Z orthogonal to current natural conditioning)
    status: settled
  P2:
    id: P2
    name: synthetic-gaussian-DGP-calibration
    notes: "P2 is triggered when all live R-A branches (Q1A/B/C) fire R-C1A/B/C. Provides interpretation framework\
      \ for the thread-EXHAUSTED-UNRESOLVED case: Ontario's \u03B1\u0302_L excess above the synthetic floor would\
      \ attribute the residual to structure even though no single Z closes the gap.\n"
    parent_branch: null
    parent_id: null
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - gaussian_floor
      - single_Z_recovery
      metric_class: "Generate synthetic data with: (a) known-Gaussian DGP with matched autocorrelation; (b) known\
        \ covariate-dependent mixture DGP with single-Z structure. Run plain Patra-Sen (per P1's method) on both.\
        \ Establish \u03B1\u0302_L floor under (a); confirm recovery under (b). Provides a reference baseline against\
        \ which Ontario's \u03B1\u0302_L excess can be attributed.\n"
      outcome_categories:
      - methodology_grade_calibration
    status: planned
  Q1A:
    id: Q1A
    name: Z1-conditioning-strongest-axis
    parent_branch: R-A
    parent_id: P1
    phase_a_path: 2026-05-27_q1a-z-conditioning-strongest-axis/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - strongest_Z_from_P1_R-A
      metric_class: "Re-fit M3 (mixture-2-Gaussian) with the additional conditioning variable Z derived from P1's\
        \ strongest-signal stratification axis. Recompute marginal PIT \u03C7\xB2 on post-cutoff data. Use Q2A's\
        \ gate-derived cuts.\n"
      outcome_categories:
      - R-A1A: "\u03C7\xB2 \u2264 228 (Q2A R-A2 cut; this Z closes the gap; specific Z identified)"
      - R-B1A: "\u03C7\xB2 in (228, 2284] (Z helps but doesn't close; multi-Z needed)"
      - R-C1A: "\u03C7\xB2 > 2284 (Z doesn't help; P1's signal was a false positive or the localization missed the\
          \ actual Z)"
      skeleton_thresholds_depend_on:
      - field: binding_axis_and_Z_construction
        rule: Q1A's specific Z is derived from P1's R-A binding axis at result time.
        source: P1.result
    result: R-B1A
    status: settled
  Q1A':
    id: Q1A'
    name: q1a-prime-sdr-ica-sibling
    notes: 'A3 (2026-05-29) closed Q1A'' as EXHAUSTED without running. Empirical FastICA design defect surfaced
      during exploratory synthetic-gate-build: the pre-registered selection rule (max |excess_kurtosis|) picks structurally-non-Gaussian
      binary day-type indicators (saturday, sunday columns in X) over the continuous cyclic signal that the cyclic-rho
      verdict statistic expects to recover. Multi-seed on amended synthetic showed FastICA selecting the binary
      columns (signal/null top |kurt| ratio ~1.0), giving bimodal rho_signal {~0.65, ~0.01} and rho_null at the
      X-cyclic-loading floor 0.55-0.71 -- the registered 0.70/0.30 cuts are unsatisfiable by construction. Per user
      adjudication 2026-05-29 (advisor-consulted), the close-without-running path was preferred over re-amending
      Q1A''s phase_a a second time in one session (lab-discipline rules flag the second-amendment smell). The FastICA
      defect IS the substantive deliverable -- a generalisable methodological finding about textbook ICA usage on
      heterogeneous X carrying both continuous-cyclic and binary-indicator columns -- and is captured in user-filesystem
      memory file `q1a-prime-fastica-selection-defect.md` (written 2026-05-29, durable independent of registry state).
      SIR-side production helper + synthetic recovery gate landed in commit 78b5069 and remain in-tree; SIR-side
      science (independent SDR-method consistency-check on P1''s binding hour_of_week axis) is preserved as a deferred
      follow-up that would require a new pre-registration thread, not a Q1A''-amendment restart. Non-gating per
      A1: branching_rules.Q1A'' unchanged (all three outcomes -> null); current_node_id and thread state unaffected.

      '
    parent_branch: R-A
    parent_id: P1
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - SIR
      - FastICA
      metric_class: "Data-driven Z-recovery on \u03BA\u0302_Q's PIT residuals via SIR and FastICA (head-to-head).\
        \ Input covariate matrix: the 4 non-hour_of_week P1 axes (demand_quantile, time_of_day, season, day_type)\
        \ plus lagged demand (lag-1, lag-24). hour_of_week explicitly EXCLUDED from the input matrix \u2014 the\
        \ discriminating empirical test is whether the methods recover an hour_of_week-aligned direction WITHOUT\
        \ being pre-specified. For each method, identify the top component (highest eigenvalue for SIR; highest\
        \ non-Gaussianity for FastICA), project hour_of_week onto a cyclic representation (sin/cos pair at the weekly\
        \ fundamental frequency 2\u03C0/168), compute |Spearman \u03C1| between the top component's loadings and\
        \ the cyclic hour_of_week phase. 1000-rep paired-day bootstrap CIs on each \u03C1.\n"
      outcome_categories:
      - R-A1A': "max(|\u03C1_SIR|, |\u03C1_FastICA|) \u2265 0.5 (P1's hand-specified hour_of_week IS recovered by\
          \ at least one data-driven method; SDR/ICA validates the approach)"
      - R-B1A': "max(|\u03C1_SIR|, |\u03C1_FastICA|) in [0.3, 0.5) (partial recovery; methods sense the social-weekly\
          \ structure but don't dominantly identify it)"
      - R-C1A': "max(|\u03C1_SIR|, |\u03C1_FastICA|) < 0.3 (hour_of_week NOT recovered; P1's hand-specified axis\
          \ is either an artifact or below SDR/ICA's sensitivity floor)"
      skeleton_thresholds_depend_on:
      - field: hour_of_week_cyclic_phase
        rule: "cyclic representation computed at the weekly fundamental frequency 2\u03C0/168; precise sin/cos column\
          \ construction is the phase_a author's call."
        source: P1.result (binding axis = hour_of_week; weekly fundamental from the 21-hour bin structure used in
          P1)
    result: EXHAUSTED-PRE-DATA (FastICA selection-rule design defect; SIR-side science deferred to potential future
      SDR-only thread)
    status: exhausted
  Q1B:
    id: Q1B
    name: Z2-conditioning-second-axis
    notes: 'Predecessor-carryforward from Q1A.R-B1A (arbiter body_sha256 6b49d9136437c1905c6a48f4f8bf6511feeafc4ba7bc01124be6efb14c53ed7c):
      Z1 = Z_c (8-level hour_of_week stratification) is the parsimony-preferred point-estimate winner used as Q1B''s
      cumulative baseline. NEAR-TIE CAVEAT: chi2_diff = +33.5 [-93, +143] straddles zero (paired SE 56.84 > |diff|);
      Z_b (binary weekend carve-out) and Z_c are statistically indistinguishable on the verdict-metric. Q1B''s phase_a
      author should NOT treat Z_c as definitively the right Z1; the head-to-head sub-finding records ''no statistically-discernible
      winner.'' SUBSTANTIVE PROVISO: the Q1A Z lever delivered 0.18% of the gap-to-close (1.3267 out of 725.8433
      chi^2 units). P1 second-strongest axis is time_of_day at range 0.485 (vs hour_of_week 0.575), so the prior
      on Q1B closing the gap via the same within-data sigma-algebra-enrichment lever is even weaker than Q1A''s
      already-weak prior. Q1B''s phase_a should factor this in: either (a) the cumulative-Z1+Z2 multi-Z hypothesis
      becomes the binding test, or (b) the thread approaches EXHAUSTED-UNRESOLVED if Q1B also fires R-B1B/R-C1B
      (R-C1B routes to P2 synthetic calibration per branching_rules.Q1B.R-C1B). The temperature prior (clim-gap-nonstationary)
      remains candidate for the marginal pathology but is not in the thread''s live branches; thread amendment to
      reopen Q1C (or a new thread targeting temperature directly) is a natural next move if Q1B fires R-B1B/R-C1B.

      '
    parent_branch: R-A
    parent_id: P1
    phase_a_path: 2026-05-27_q1b-z2-conditioning-second-axis/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - second_strongest_Z_from_P1_R-A
      metric_class: 'As Q1A but with Z derived from P1''s second-strongest-signal axis. Tests multi-mechanism hypothesis:
        if Q1A delivers R-B1A (Z1 helps but doesn''t close), Z2 may close the gap when combined with Z1.

        '
      outcome_categories:
      - R-A1B: "cumulative-with-Z1 \u03C7\xB2 \u2264 228 (Z1+Z2 close gap together)"
      - R-B1B: in (228, 2284]
      - R-C1B: '> 2284 (Z2 redundant with Z1)'
      skeleton_thresholds_depend_on:
      - field: second_Z_construction
        rule: "Q1B's Z2 is the second-ranked axis from P1; Q1B's cumulative \u03C7\xB2 is computed against Q1A's\
          \ Z1-conditioned baseline."
        source: P1.result AND Q1A.result
    result: R-B1B
    status: settled
  Q1B':
    id: Q1B'
    name: q1b-prime-smc-tightening
    notes: 'Q1B'' is a non-gating empirical CI-tightening run on Q1B''s winning (day_type, Z_c, Z2_c) configuration.
      Single arm: re-run `experiment/q1b_z2_conditioning/__main__.py` with `--n-particles 400` (vs Q1B''s 200).
      All other code paths identical (same library, same fitter, same SMC seed convention, same paired-day bootstrap
      convention, same MIN_CELL_SIZE pool-fallback rule, same dual reproduction-check anchors Q2A 953.84 + Q1A 952.5167).


      Verdict is on the cumulative_chi2_improvement_above_Z_c CI WIDTH, not the point estimate. R-A1B'' fires if
      width narrows to <= 75% of Q1B''s realized 476.358 chi^2 width (i.e., <= 357.27). R-B1B'' = mixed. R-C1B''
      = widens OR point shift > 50 chi^2.


      Reproduction-check semantics at N=400: the existing BLOCKING assertions in `__main__.py` lines 1424/1454 call
      SMC with M=args.n_particles. At N=400 the SMC trajectories diverge from the seed-exact N=200 path; drift could
      be within the existing tol=50 chi^2 or above it. Phase_a treats drift as part of the measurement: if repro
      passes within 50, the dual-anchor framing survives; if it FAILS, that itself is empirical evidence that SMC
      variance at N=200 was non-trivial in the parent fits -- informative side-channel, not a failed gate. The script''s
      existing assert will halt execution if drift > 50; phase_a may carve out a catch-and-report rather than carve
      out the assert itself (preregister''s call when filling phase_a).


      Non-gating: branching_rules.Q1B'' = {R-A1B'': null, R-B1B'': null, R-C1B'': null}. Q1B''''s settlement does
      NOT advance current_node_id. Q1B'' informs the user adjudication of the (a)/(b)/(c) paths surfaced by Q1B''s
      S4 advance but does not itself pick one.



      SETTLED 2026-05-28 per arbiter body_sha256 1ee09afa...: verdict R-B1B'' (mechanical = substantive; ALIGNED
      on R-B1B'', no suffix). Realized cumulative_chi2_improvement_above_Z_c CI95 = [-34.576, +471.622]; CI WIDTH
      = 506.198 chi^2 in registered band (357.27, 524.0]. Realized better_chi2 = 679.128; |point_shift from Q1B''s
      662.223| = 16.905 << tol 50. Both point-stability and CI-width R-B1B'' conjuncts cleared unambiguously. Realized
      direction is +29.84 chi^2 WIDENING (+6.3% vs Q1B''s 476.358), OPPOSITE both forecasters'' narrowing predictions:
      proponent R-A1B'' (width 338 [290, 395], 25%+ narrowing) and DA R-B1B'' (width 419 [370, 480], ~12% narrowing)
      BOTH FALSIFIED on direction-of-magnitude; the registered R-B1B'' band is the unfalsifiability zone for direction
      errors on the verdict-metric. DA wins on outcome category (R-B1B'' mechanical match); proponent''s R-A1B''
      falsified. Both forecasters got point-stability right (16.905 << 50). Substantive finding: Q1B''s wide CI
      is INTRINSIC TO DATA, not estimator -- eval-window-noise dominates; within-data SMC-tightening is empirically
      EXHAUSTED as a CI-narrowing mechanism. Joint S9+S10+S11+S12+S13+Q1B'' is now a three-layer corroboration of
      the identifiability obstruction (distributional-class via S9+S10; sigma-algebra-enrichment via S11+S12+S13;
      methodological tightening via Q1B''). 7th named-failure-mode instance, new shape variant: outcome-category
      mechanical match for ONE side (DA), BOTH sides falsified on direction-of-magnitude. PROVENANCE-GRADE INSPECTION-ONLY
      (.txt artifact collision with Q1B; result.yaml + pickle ARE the durable record, both produced by audited PRODUCTION-PATH
      code with all BLOCKING gates passed including dual reproduction checks Q2A |diff|=5.225 and Q1A |diff|=44.595
      within tol=50). Reproduction checks at both anchors PASS. Q1B'' is non-gating per amendment A2; branching_rules.Q1B''.R-B1B''
      = null; settlement does NOT advance current_node_id (remains null per S4 -- the main Q1B branch''s (a)/(b)/(c)
      three-way amendment decision is now INFORMED by Q1B'' but not auto-decided).'
    parent_branch: R-A
    parent_id: Q1B
    phase_a_path: 2026-05-29_q1b-prime-smc-tightening/phase_a.yaml
    phase_a_skeleton:
      candidate_set:
      - SMC_particle_count_change
      metric_class: 'Empirical CI-tightening on Q1B''s settled cumulative_chi2_improvement_above_Z_c statistic.
        Single arm: re-run Q1B''s winning (day_type, Z_c, Z2_c) configuration with N_PARTICLES=400 (vs Q1B''s 200).
        All other methodology identical (library, fitter, SMC seed convention, paired-day bootstrap convention,
        dual reproduction-check anchors). Verdict metric is the realized 95% CI WIDTH on cumulative_chi2_improvement_above_Z_c.
        Q1B''s realized width was 476.358 chi^2 ([+8.064, +484.423]).

        '
      outcome_categories:
      - R-A1B': CI width <= 357.27 (<= 75% of Q1B's 476.358; SMC noise IS the dominant variance component -- tightening
          lever works; user can adjudicate (a)/(b)/(c) on the narrower CI)
      - R-B1B': CI width in (357.27, 524.0] (mixed; SMC noise contributes but eval-window-noise is non-trivial;
          user accepts wide CI and adjudicates (a)/(b)/(c) on substantive grounds)
      - R-C1B': 'CI width > 524.0 OR |better_chi2 point shift| > 50 chi^2 (widens, OR SMC point estimate shifts
          more than Monte-Carlo noise allows -- anomaly: SMC seed dependence or methodological issue worth diagnosing
          before any further amendment)'
      skeleton_thresholds_depend_on:
      - field: ci_width_cuts
        rule: 'R-A1B'' / R-B1B'' / R-C1B'' cuts are derived from Q1B''s realized better_chi2 CI95 width (476.358
          chi^2 from result.yaml). 75%-cut (357.27) discriminates V_smc/V_total >= 0.875 from below; 110%-cut (524.0)
          admits bootstrap noise without making R-C1B'' trivially unfireable.

          '
        source: Q1B.result (primary_result.chi2_Z2_c_ci95 width)
    result: R-B1B'
    status: settled
  Q1C:
    id: Q1C
    name: temperature-fallback-prior-supported-Z
    notes: 'Requires exogenous data source. ECCC (Environment and Climate Change Canada) historical hourly weather
      is free, but the data acquisition + alignment is a pre-experiment infrastructure cost that must land before
      Q1C''s phase_a is filled.

      '
    parent_branch: R-C
    parent_id: P1
    phase_a_path: null
    phase_a_skeleton:
      candidate_set:
      - temperature
      metric_class: "If P1 returns R-C (constant \u03B1\u0302_L across all natural strata), test the prior-supported\
        \ Z anyway: temperature. clim-gap-nonstationary and postcovid-probe both name temperature as the strongest\
        \ a priori candidate. If R-A1C fires, P1's signal was a false null (temperature orthogonal to all five sketched\
        \ stratification axes); if R-C1C fires, the missing content is not temperature and (P2 calibration is the\
