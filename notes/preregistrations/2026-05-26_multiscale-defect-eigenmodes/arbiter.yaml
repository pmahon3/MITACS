verdict_reasoning: "The mechanical verdict is O2 (h-localized): one or more day_types\nshow the dominant mode INDEX changing with h, which fires O2 under\nthe pre-registered criterion. But \"dominant\" here is between\nmodes whose shares cluster at 0.50-0.53; the argmax flip is noise\non a near-tie, not the mechanism O2 was intended to capture.\n\nSubstantively, the picture is closer to O3 (diffuse across two\nmodes): every weekday/saturday cell has dominant_mode_share between\n0.50 and 0.53, well below O1's 0.70 threshold; sunday cells sit\nat 0.52-0.58 with the slow real mode consistently dominant but\nagain not by O1-grade margin.\n\nTwo Phase A criterion defects made this hole possible:\n\n  (1) O2's \"dominant_mode_index CHANGES with h\" condition lacks\n      a \"clearly above tie\" share threshold. Should have required\n      a dominant-share margin (e.g. > 0.55) before the index-change\n      criterion can bite. Otherwise any near-tie set of shares\n      produces argmax noise that\
  \ mimics genuine h-localization.\n\n  (2) O3's even-split band for sunday was specified as [0.30, 0.50]\n      assuming 3 equally-weighted blocks. But sunday's blocks are\n      mixed: a 1D real fast mode (real_0), a 2D complex pair, and a\n      1D real slow mode (real_3). The \"even-split\" point should\n      account for block-dimension weighting \u2014 under which sunday's\n      observed 0.52-0.58 dominant shares are PRECISELY at the even-\n      split point (1+2 vs 1, i.e. about 0.50 for the slow mode vs\n      the combined fast subspace). v2 of this experiment with\n      corrected sunday band would likely deliver verdict O3\n      substantively and mechanically.\n\nForecast comparison: proponent forecast O1 with dominant_mode_share\n~0.85; observed 0.50-0.58. Proponent forecast empirically wrong on\nmagnitude (off by a large margin in the corroboration-direction).\nDevil's-advocate forecast O3 with dominant_mode_share ~0.55; observed\n0.50-0.58. DA forecast is approximately correct\
  \ on magnitude (the\nshares cluster near DA's predicted 0.55), but DA's MECHANISM\n(\"rank-1 makes projection ill-posed\") was empirically refuted by\nthe synthetic gate cross-check (synthetic R values ~0.01, three\norders below Ontario's 0.3-20; the projection works cleanly on\nstrict-semigroup data).\n\nCALIBRATION: DA closer on magnitude (proponent's 0.85 vs observed\n0.51 is a 0.34 miss; DA's 0.55 vs 0.51 is a 0.04 miss). But DA's\nmechanism was wrong. Calibration credit goes to DA on the headline\nnumber; both lose on the asymmetry sub-test (both forecast\nlibrary_consistent; reality is NOT \u2014 see below).\n\nTHE INDEPENDENT SUBSTANTIVE FINDING (asymmetry sub-test): R_sat /\nR_wkd ratios are 1.26-2.44 across (h, k); library-noise scaling\nwould predict ~5.0. Observed ratios are ALL below the registered\nband [3, 8]. Direction-of-effect: weekday per-cell defect is\nlarger than library-noise alone would predict (or equivalently,\nsaturday per-cell defect is smaller). This is genuine\
  \ dynamical\nasymmetry, NOT a library-size artifact. It partially RETRACTS one\nreading of v2's marginal-KL pattern, which appeared to show weekend\ncells with larger KL than weekday \u2014 that pattern is now visible\nas a mix of (genuine: weekend operator carries multi-block dynamics\nweekday doesn't) and (library: weekend has 5x fewer days so noise\ninflates Sigma_h estimates more).\n"
