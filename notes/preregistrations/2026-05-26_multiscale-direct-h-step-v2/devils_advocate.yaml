strongest_argument: "v1's actual numerical content already told us the story: at h=12 (weekday),\nthe directly-fit and iterated diffusions sit at Sigma_h[0,0]=0.730 *\niter_Sigma_h[0,0] vs iter_Sigma_h[0,0] respectively \u2014 a ~30% gap. The drift\ndivergence at the same (h, dt) was a v1-metric artifact (the OLS collapses\ntoward zero so the relative norm exploded). On the new metric, the same\nfactor pair will translate to a Gaussian KL of approximately\n  0.5 * (0.73 + (1 - sqrt(0.73))^2 / 0.73 - 1 + log(1/0.73))\n  \u2248 0.5 * (0.73 + 0.03 - 1 + 0.31) \u2248 0.04 nats.\nThe synthetic noise floor for VAR(1) at h=12 with similar effective sample\nsize will be in the 0.01-0.05 nats range. So D_RATIO is somewhere around\n1-3 \u2014 almost certainly in the AMBIGUOUS region, possibly clearing\nfalsification at 2.0. The Ontario divergence is REAL but SMALL on the\nnatural scale, and consistent with what the strict-semigroup picture would\nalso predict within finite-sample noise.\n"
