verdict_reasoning: "Mechanical: the pre-registered AMBIGUOUS criterion fires. The top\nseasonal/top weekly ratio = 0.27, outside O-C's required (0.5, 2.0)\nband, and the top weekly score does not exceed 2x the top other for\nO-B. Per phase_a, this triggers AMBIGUOUS and (per the thread's\nbranching_rules) sends branch_fired = AMBIGUOUS, next_node_id = null.\n\nSubstantive: the AMBIGUOUS verdict is NOT for lack of signal. It is\nfor TAXONOMIC INADEQUACY of the registered O-A/B/C/D categories.\nTwo findings are durable:\n\n  1. Multiple candidates cleared the null baseline at high\n     confidence: all 4 seasonal (cos/sin annual + semi), all three\n     within-cell-residual candidates (he_dev_from_daytype_mean,\n     dow_he_interaction, and year_since_cutoff), plus dow_indicator_mon\n     (borderline p=0.043). DA's \"no candidate clears null\"\n     prediction was empirically wrong.\n\n  2. The two top-scoring candidates (he_dev_from_daytype_mean = 3.43\n     and dow_he_interaction = 3.42)\
  \ are TAUTOLOGICALLY CIRCULAR.\n     Each is a near-monotone function of z_actual within cells, and\n     the PIT residual within a cell is also a near-monotone function\n     of z_actual (verified: median within-cell |Spearman| = 0.65).\n     These two candidates measure the metric's input, not exogenous\n     content. PHASE A DESIGN HOLE - candidates constructed from\n     z_actual should have been excluded.\n\nIf the tautological candidates are excluded (post-hoc, informational):\nthe legitimate ranking is year_since_cutoff (1.11) > seasonal class\n(cos/sin tied around 0.7-0.9) > dow_indicator_mon (0.46, borderline).\nSecular drift is the single strongest non-circular signal -\nconsistent with mitacs-clim-gap-nonstationary's finding that\npost-cutoff actuals are growing year-over-year in a way the pre-\ncutoff climatology doesn't capture, NOW VISIBLE in the PIT residual\ntoo.\n\nCalibration on substantive forecasts:\n  Proponent (O-C): wrong outcome label, but partially-right shape\n\
  \    (multiple classes significant). Their multi-source intuition was\n    correct; they did not anticipate the tautology.\n  DA (O-D): wrong outcome label (many candidates significant). BUT\n    their non-Gaussian-residual-inflates-PIT mechanism (failure\n    mode 1) was empirically corroborated by the marginal PIT chi^2.\n    DA wins partial credit for the mechanism even though their\n    headline outcome was wrong.\n\nThe marginal PIT pathology (chi^2 = 22329, 67% extreme) is itself\nthe strongest single empirical finding: the iterated kappa_1\nforecast is catastrophically miscalibrated as a Gaussian. This is\nconsistent with mitacs-rebaseline-facts (innovation strongly\nnon-Gaussian) and elevates that earlier finding to a forward-\nobservable consequence.\n"
