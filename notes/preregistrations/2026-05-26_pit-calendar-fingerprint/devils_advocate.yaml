strongest_argument: 'The eigenmodes-v1 finding was specifically that the defect is DIFFUSE

  across modes - which is mechanically what happens when the missing

  content has NO consistent alignment with the operator''s eigenstructure.

  Calendar variables are precisely the dimensions that DO have aligned

  structure (weekly cycle aligns with C_1''s slow mode; annual cycle has

  a fixed temporal signature). If the defect projected onto these

  calendar axes cleanly, we would expect the defect to be SOMEWHAT

  more aligned with C_1''s eigenmodes too - because calendar-driven

  content typically lives in the slow mode of demand history.


  The diffuse-across-modes finding is more consistent with EITHER (a)

  nonlinearity within the existing embedding (a nonlinear function of

  (z_t-1, z_t-2) that doesn''t project cleanly onto C_1''s eigenbasis

  OR onto smooth calendar functions); OR (b) high-frequency exogenous

  content (weather noise rather than seasonal trend; or schedule SHOCKS

  rather than DoW averages). Both of these would defeat the

  cell-aggregated explanatory_score because the signal is fine-grained

  within cells, not across-cell-mean-aligned.


  Additionally: the analytic PIT here is computed against the iterated

  Gaussian forecast, which assumes Gaussianity of the residual.

  mitacs-rebaseline-facts established that residuals are STRONGLY

  non-Gaussian (excess kurtosis ~24-33). A heavy-tailed residual

  produces U-shaped marginal PIT but the conditional PIT residual

  has additional structure that has nothing to do with calendar

  variables - it has to do with the residual law being wrong. This

  may inflate PIT residuals UNIFORMLY (no calendar pattern) and

  produce O-D as an artifact of the metric''s Gaussian assumption.


  Net: O-D is more likely than the proponent thinks. The metric may

  not be sensitive enough to detect the calendar structure even if

  it exists.

  '
