  node_id: Q1A
  parent_branch: R-A
  thread_body_sha256: 9a5647a5f7ea6b3ee44d53e95c23e165e9d706d105db9afbf2c4f0cc25a3c6ba
  thread_topic: resolution-paths-thread
  threshold_derivations: 'Numeric thresholds (R-A1A: better_chi^2 <= 228; R-B1A: in (228,
    2284]; R-C1A: > 2284) are inherited verbatim from the thread skeleton''s Q1A.phase_a_skeleton.outcome_categories.
    The skeleton''s integers are rounded versions of Q2A''s gate-validated thresholds R-A2_cut
    = 228.44 and R-C2_cut = 2284.44 (see notes/preregistrations/2026-05-26_q2a-richer-family-mixture-or-nonparametric/phase_a.yaml
    threshold_derivations). The rounding is conservative on R-A1A (228 < 228.44 tightens the
    cut by 0.44) and trivially conservative on R-C1A (2284 < 2284.44 tightens by 0.44). Q1A
    uses the integer values to match the skeleton exactly for phase-fidelity Check P L1.


    Q1A''s Z construction (the binding axis identification and the two operationalizations)
    is DERIVED FROM P1.result per the thread''s Q1A.skeleton_thresholds_depend_on.binding_axis_and_Z_construction
    rule, source = P1.result. P1 SETTLED R-A at landslide strength with binding_axis = hour_of_week,
    hot zone = bins 5/6/7 (Fri 10:00 - Sun 23:00). The arbiter''s notes_for_thread_coordinator
    pre-flagged three Z constructions (i) binary indicator of bin >= 5, (ii) 8-level categorical
    (bins 0..7), (iii) continuous hour-of-week-mod-168 phase. Per user direction, Q1A registers
    a head-to-head between (i) and (ii); (iii) is NOT in scope for Q1A.


    MIN_CELL_SIZE = 200 (the pool-to-parent fallback threshold) is NOT a verdict-bearing threshold;
    it is a procedural decision pre-registered before data to prevent degenerate mixture fits
    in sparse cells. 200 is chosen to give EM at least ~30 effective draws per mixture component
    at the typical w1 = 0.85 / w2 = 0.15 from Q2A''s settled M3, with sufficient margin for
    the tail component to be identifiable. The empirical post-cutoff row counts per (day_type,
    bin) cell range 213-1506; the only cell at risk of pooling is sunday bin 6 (n=213); all
    others comfortably exceed 200. The pooling fallback log is in the result artifact for
    arbiter inspection.'
