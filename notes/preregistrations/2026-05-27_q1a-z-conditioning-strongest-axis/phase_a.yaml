hypothesis:
  counter: 'See devils_advocate.yaml. R-C1A or R-B1A: hour_of_week-derived Z conditioning
    is a coarse proxy for an underlying continuous structure (temperature, demand regime,
    weekly social rhythm) and per-(day_type, bin) cell mixture fits will not close the marginal
    gap because they cannot capture within-bin tail heterogeneity; expected chi^2 either lands
    in the R-B1A band (Z helps but doesn''t close) or R-C1A (Z is the wrong axis after all
    and S9+S10 identifiability obstruction is binding).'
  proponent: See proponent.yaml. R-A1A fires (better-candidate chi^2 <= 228) at landslide
    strength. M3-Z_c (the 8-bin categorical) wins over M3-Z_b (binary) because the within-weekend
    tail heterogeneity (Saturday vs Sunday vs Sun-late-evening) is itself non-trivial in the
    P1 hot-zone strata ranking; the 8-bin granularity captures it where the binary collapses
    it. P1's landslide reading at hour_of_week range 0.5750 directly maps to a chi^2 reduction
    sufficient to clear the 228 bar.
metric: "PRIMARY: head-to-head between two M3-with-Z candidates against a SINGLE verdict cut.\
  \ Both candidates re-fit M3 (production fitter mixture_2_gaussian_mle_fit in processing/innovations/estimator.py:424)\
  \ with the conditioning sigma-algebra enriched from sigma(day_type) to sigma(day_type, Z),\
  \ where Z is derived from hour_of_week per P1 R-A's binding axis. The verdict metric is\
  \ the marginal post-cutoff PIT chi^2 (10-bin equiprobable Pearson, same convention as Q1,\
  \ Q2A, Q2B):\n\n  chi^2_Z_b = marginal PIT chi^2 under M3 with Z = Z_b (binary)\n  chi^2_Z_c\
  \ = marginal PIT chi^2 under M3 with Z = Z_c (8-level categorical)\n\nTHE TWO Z CONSTRUCTIONS\
  \ (PRE-LOCKED, per user direction; the third option (iii) continuous phase variable from\
  \ the P1 arbiter notes is NOT in scope for Q1A):\n\n  Z_b (BINARY, weekend indicator): Z_b\
  \ = 1 if hour_of_week bin >= 5 else 0. With bin = (weekday*24 + (h-1)) // 21 and weekday\
  \ in {0=Mon..6=Sun}, h in {1..24}, Z_b = 1 maps to the Fri 10:00 - Sun 23:00 weekend window\
  \ (P1 hot zone, bins 5/6/7). Z_b = 0 maps to Mon 01:00 - Fri 09:00 (P1 cold zone start).\
  \ Empirical post-cutoff distribution: Z_b = 0 has 7488 rows (entirely weekday day_type);\
  \ Z_b = 1 has 4512 rows (1080 weekday late-Fri + 1728 saturday + 1704 sunday).\n\n  Z_c\
  \ (8-LEVEL CATEGORICAL): Z_c = bin (0..7) directly. Preserves the full P1 stratification\
  \ granularity. Empirical post-cutoff distribution per (day_type, bin) shows only 10 of 24\
  \ nominal cells non-empty: weekday spans bins 0-5; saturday spans bins 5-6; sunday spans\
  \ bins 6-7. Per-cell row counts range from 213 (sunday bin 6) to 1506 (weekday bin 2).\n\
  \nFIT PROCEDURE (BOTH CANDIDATES):\n  1. Per (day_type, Z) cell with n >= MIN_CELL_SIZE\
  \ = 200 in the pre-cutoff library, run mixture_2_gaussian_mle_fit(X_cell, Y_cell) to obtain\
  \ per-cell (C_cell, params_cell, resid_cell). C_cell is the local OLS drift, params_cell\
  \ = {weights: (w1, w2), scales: (s1, s2)}.\n  2. For (day_type, Z) cells with n < MIN_CELL_SIZE\
  \ in the pre-cutoff library, POOL to the parent day_type (use Q2A's existing day_type-only\
  \ M3 fit) for that cell's post-cutoff propagation. The pooling fallback is recorded per-cell\
  \ in the result artifact; no silent re-stratification.\n  3. SMC propagation: M = 200 particles\
  \ per state (same as Q2A), seed = Q2A's _TAG_SEED_OFFSET_M3 = 31 for paired comparison.\
  \ Residual sampler uses the per-(day_type, Z) cell mixture parameters of the cell the propagated\
  \ state belongs to.\n  4. Marginal PIT: aggregate u over all post-cutoff (day, hour) pairs;\
  \ 10-bin equiprobable Pearson chi^2.\n\nHEAD-TO-HEAD VERDICT RULE (PRE-LOCKED):\n\n  The\
  \ verdict fires on the BETTER (lower) of the two candidates' point estimate chi^2:\n  -\
  \ better_chi2 = min(chi2_Z_b, chi2_Z_c)\n  - if better_chi2 <= 228:                    \
  \ R-A1A (Z conditioning closes the gap; routes to thread RESOLVED per branching_rules.Q1A.R-A1A\
  \ = null)\n  - if better_chi2 in (228, 2284]:                R-B1A (Z helps but doesn't\
  \ close; routes to Q1B per branching_rules.Q1A.R-B1A)\n  - if better_chi2 > 2284:      \
  \                 R-C1A (Z doesn't help; routes to P2 per branching_rules.Q1A.R-C1A)\n\n\
  TIE / NEAR-TIE HANDLING: candidates are NEAR-TIE if |chi2_Z_b - chi2_Z_c| < 1.0 * paired-bootstrap\
  \ SE of the difference (1 sigma of the paired difference distribution). On NEAR-TIE: the\
  \ verdict uses min(chi2_Z_b, chi2_Z_c) as above (mechanical), AND the head-to-head sub-finding\
  \ records 'no ranking' between Z_b and Z_c, AND the lower CI bound landslide check uses\
  \ the candidate with the lower point estimate. On NOT-NEAR-TIE: the head-to-head sub-finding\
  \ records which candidate won and by how much (chi^2 difference and its CI).\n\nVERDICT-CUT\
  \ TRACEABILITY: the integer cuts 228 and 2284 are inherited from the thread skeleton (resolution-paths-thread\
  \ Q1A node). They are the rounded versions of Q2A's gate-validated cuts R-A2_cut = 228.44\
  \ and R-C2_cut = 2284.44 (see Q2A phase_a's threshold_derivations). Q1A uses the thread\
  \ skeleton's rounded integer values to honor phase-fidelity Check P L1 exact-skeleton-match;\
  \ a chi^2 falling in (228, 228.44] is treated as R-B1A per the thread, even though under\
  \ Q2A's gate it would be R-A2 \u2014 this is a deliberate conservative tightening of the\
  \ R-A1A cut by 0.44.\n\nSECONDARY / informational:\n  - Per-(day_type, Z) cell mixture parameters\
  \ (w1, w2, s1, s2) reported for each candidate, with paired-bootstrap CIs.\n  - Per-cell\
  \ chi^2 contribution decomposition.\n  - Pooling-fallback log: which cells dropped below\
  \ MIN_CELL_SIZE = 200 and pooled to parent day_type.\n  - chi^2 difference (chi2_Z_b - chi2_Z_c)\
  \ and its 95% paired-bootstrap CI (for the head-to-head sub-finding).\n  - Reproduction\
  \ check: re-running M3 with no Z conditioning (same fitter, same seed) on the pre-cutoff\
  \ library reproduces Q2A's chi^2 = 953.84 within paired-bootstrap noise \u2014 this is the\
  \ unconditioned baseline, verified within the same script.\n"
