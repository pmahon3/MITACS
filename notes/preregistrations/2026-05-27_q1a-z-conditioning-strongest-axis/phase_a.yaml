research_question: Does enriching the M3 conditioning sigma-algebra from sigma(day_type) to
  sigma(day_type, Z), with Z derived from hour_of_week per P1 R-A's binding axis, reduce the
  post-cutoff marginal PIT chi^2 from Q2A's settled M3 baseline of 953.84 to <= 228 (Q2A R-A2
  cut, integer-rounded per thread skeleton)? The head-to-head between Z_b (binary weekend
  indicator) and Z_c (8-level categorical) ranks the two pre-locked operationalizations of
  hour_of_week under one verdict cut.
schema: phase_a
shape_outcomes:
  R-A1A:
    criterion: min(chi2_Z_b, chi2_Z_c) <= 228 (better candidate's point estimate clears the
      Q2A R-A2 cut at integer-rounded 228)
    interpretation: 'hour_of_week-derived Z closes the marginal chi^2 gap. The head-to-head
      sub-finding records which candidate won (with paired-bootstrap CI on the difference).
      Per thread branching_rules.Q1A.R-A1A = null, the resolution-paths-thread is RESOLVED
      (with the sub-finding documenting which Z construction is preferred). LANDSLIDE qualifier:
      if BOTH the better candidate''s point AND lower-bound 95% CI clear 228, the substantive
      reading is "the better Z is a sufficient conditioning sigma-algebra"; if only the point
      clears (CI straddles), mechanical R-A1A fires with "landslide-not-met" recorded.'
  R-B1A:
    criterion: min(chi2_Z_b, chi2_Z_c) in (228, 2284] (better candidate's point estimate is
      between cuts)
    interpretation: Z helps but does not close. Per thread branching_rules.Q1A.R-B1A, routes
      to Q1B with Z2 = second-strongest axis from P1 (time_of_day at range 0.485 per P1 arbiter,
      with overnight 0.1125 / morning_ramp 0.5825 / afternoon 0.5975 / evening 0.4750 strata).
      The head-to-head sub-finding still records which candidate won; the better Z is carried
      forward as Z1 in Q1B's cumulative computation per thread Q1B.skeleton_thresholds_depend_on.
  R-C1A:
    criterion: min(chi2_Z_b, chi2_Z_c) > 2284 (BOTH candidates fall beyond the Q2A R-C2 cut)
    interpretation: 'Z doesn''t help. Per thread branching_rules.Q1A.R-C1A, routes to P2 (synthetic
      Gaussian-DGP calibration). The head-to-head sub-finding records which candidate was
      less-bad (still informative for P2''s framing) but neither cleared. Substantive reading:
      P1''s landslide reading at hour_of_week range 0.575 IS a real localization signal, but
      the chi^2 metric is sensitive to mass assignment that the per-(day_type, Z) cell mixture
      fit cannot capture (e.g., within-cell tail heterogeneity that requires a finer or different
      axis).'
stopping_criterion:
  reasoning: Pre-registration complete; verdict determined by realized chi^2 values against
    pre-locked cuts. No iteration, no parameter tuning, no Z construction revision after seeing
    data. The head-to-head structure is locked at two candidates; adding a third (e.g., continuous
    phase variable) after seeing the results would require a new dated entry per the append-only
    rule.
  rule: Run synthetic recovery gate (per baselines.secondary); load pre-cutoff library + post-cutoff
    actuals; derive Z_b and Z_c from (delivery_day, h); fit M3 per (day_type, Z_b) and per
    (day_type, Z_c) with MIN_CELL_SIZE = 200 pool-to-parent fallback; SMC-propagate post-cutoff
    under each candidate; compute marginal PIT chi^2 per candidate; paired-bootstrap CIs and
    difference CI; verdict R-A1A / R-B1A / R-C1A per better_chi2 = min(chi2_Z_b, chi2_Z_c);
    emit result. STOP.
