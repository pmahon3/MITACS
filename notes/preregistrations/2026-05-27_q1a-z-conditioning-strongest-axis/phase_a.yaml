affects_registered_spec: true
ambiguous_region:
  action: 'R-B1A fires: the better candidate''s chi^2 falls in (228, 2284]. The Z conditioning
    helps but does not close the marginal gap. Per branching_rules.Q1A.R-B1A the thread advances
    to Q1B (second-strongest axis from P1; per the P1 arbiter''s ranking, that is time_of_day
    at range 0.485, with binding overnight-vs-rest contrast). No claim that the head-to-head
    winner''s Z is the "right" Z; only that it is the one we can detect with the candidate
    axes we have.'
  range: better_chi2 in (228, 2284] (R-B1A, per thread skeleton)
baselines:
  primary: 'M3 unconditioned-on-Z baseline = Q2A''s settled M3 chi^2 = 953.84 (effective_chi2
    point estimate, paired-day bootstrap 95%% CI [685, 1357]). This is the cut anchor: the
    R-A1A bar at 228 corresponds to the > 80% explained-share floor relative to the M0->M3
    reduction (M0 chi^2 = 22329, M3 chi^2 = 953.84; gap to close = 953.84 - 228 = 725.84).
    The head-to-head candidates must reduce M3''s chi^2 from 953.84 toward 228 by adding Z
    to the conditioning sigma-algebra. M0 (raw, no kernel) = 22329 and M1 (Student-t kernel,
    no Z) = 1371 are inspection-only context, not the primary baselines for the verdict; the
    M3 -> M3+Z reduction is what is being measured.'
  secondary: 'Synthetic recovery gate (METHOD/DESIGN). Generate synthetic data with a known
    Z-conditional mixture DGP: pre-specified Z_true distribution with mixture parameters (w1,
    s1, s2) varying by Z stratum (e.g., Z=0 cell mixes 0.9 N(0,1) + 0.1 N(0,3); Z=1 cell mixes
    0.6 N(0,1) + 0.4 N(0,4)). Run the production stratified mixture_2_gaussian_mle_fit per
    (day_type, Z) cell. Two recovery checks: (i) per-cell fitted (w, s1, s2) within tolerance
    of ground truth; (ii) PIT u_PIT under the Z-conditional model is approximately Uniform[0,1]
    (chi^2 << R-A1A cut at 228). Confirm BOTH before the Ontario diagnostic runs. ~30 sec
    wall-clock; runs every invocation as in-script self-test. The gate validates that adding
    Z as a stratification variable closes a known gap; if it cannot, any null result on Ontario
    data is consistent with implementation defect rather than a true substantive null. Companion
    gate: under FALSE Z (random labels orthogonal to mixture parameters), the per-stratum
    fits collapse back to the marginal mixture and chi^2 ~ baseline; this confirms the per-stratum
    fit is not artificially shrinking chi^2 by overfitting.'
body_sha256: a2b13f6d8bcd6d2e4206322fc056c9b4388e761c5b5d651282e0f34d634e6d63
ci_method:
  details: '1000 paired-day bootstrap resamples of post-cutoff days (pair = (delivery_day,
    day_type) preserving within-day correlation; same scheme as Q1, Q2A, P1). Per resample:
    refit M3 per (day_type, Z) cell on the resampled rows for EACH of the two head-to-head
    candidates (M3-Z_b and M3-Z_c) sharing one resample for paired comparison; recompute the
    marginal post-cutoff PIT chi^2 per candidate. Report 95% percentile CI on chi2_Z_b, chi2_Z_c,
    and the difference (chi2_Z_b - chi2_Z_c).'
  type: paired_day_bootstrap
  width: 95 percent percentile interval
corroboration_criterion:
  numeric: 'R-A1A fires AT LANDSLIDE STRENGTH on at least one candidate: better candidate''s
    chi^2 point estimate <= 228 AND lower bootstrap 95% CI bound <= 228 (both clearing the
    cut simultaneously, analogous to P1 R-A landslide reading where point 0.5750 and lower
    CI 0.4475 both cleared 0.20).'
  reasoning: 'A single point estimate <= 228 with a CI straddling the cut is mechanical R-A1A
    but substantively borderline. Requiring the lower CI bound also clearing 228 is the landslide
    reading: hour_of_week-derived Z conditioning is the dominant Z driving the residual non-Gaussianity,
    and the M3+Z conditioning sigma-algebra is sufficient for marginal calibration. If only
    the point estimate clears (CI straddles), arbiter records mechanical R-A1A with the "landslide-not-met"
    qualifier and the resolution rule (closure_rule in the thread artifact: "share > 0.80")
    is evaluated on the point estimate. The substantive bar is the landslide.'
data:
  cutoff_handling: "Q1A re-fits M3 with the conditioning sigma-algebra enriched from sigma(day_type)\
    \ to sigma(day_type, Z). Pre-cutoff library is used to fit per-cell mixture parameters\
    \ (w, s1, s2) \u2014 same library Q2A's M3 used, identical SMC propagation seed (_TAG_SEED_OFFSET_M3\
    \ = 31) so the unconditioned baseline reproduces Q2A's 953.84. Post-cutoff is used only\
    \ for PIT chi^2 evaluation. No leakage: post-cutoff rows do not enter the per-cell mixture\
    \ fits. The Z derivation is purely from the time index (delivery_day -> weekday, h ->\
    \ hour) so no exogenous data is introduced; Q1A is on the same data footprint as Q1/Q2A/Q2B/P1."
  partition:
    dev: not used
    test: post-cutoff 2025-01-01 .. 2026-05-16 (same population as Q1, Q2A, Q2B, P1)
    train: pre-cutoff library for per-(day_type, Z) M3 mixture refits; same library Q2A used
  source: 'Ontario IESO demand (cfg.paths.historical_csvs) + Q1''s post-cutoff PIT population.
    Specifically: (a) pre-cutoff library rebuilt via the same loaders Q2A used to fit M3 per
    day_type (`load_actuals`, day_anchor 07:00, all rows up to spec.data_cutoff); (b) post-cutoff
    actuals for SMC particle propagation and PIT evaluation. The Z column is derived inline
    from the timestamp index. P1''s pickle (`pit_M1`) is loaded only for sanity confirmation
    that the Z stratification derived from `delivery_day` + `h` matches the bin labels P1
    used in its hot-zone ranking (cross-check; not an input to the fit).'
falsification_criterion:
  numeric: 'R-C1A fires on BOTH candidates: chi^2_Z_b > 2284 AND chi^2_Z_c > 2284.'
  reasoning: 'R-C1A is the localization-hypothesis falsification: hour_of_week-derived Z conditioning
    does NOT close the gap (either point estimate falls beyond the R-C cut 10x the R-A bar).
    Per branching_rules.Q1A.R-C1A this routes to P2 (synthetic Gaussian-DGP calibration),
    which interprets the persistent chi^2 as either a legitimate identifiability obstruction
    (no Z within reach closes the gap) or a P1 false-positive (the localization signal was
    an artifact of the marginal PIT pathology rather than a real Z-conditional structure).
    Both candidates must fall in R-C1A; if only one does, the verdict is the better candidate''s
    outcome (head-to-head verdict rule, see shape_outcomes).'
git_clean: true
