strongest_argument: The localize-first-identify-next workflow has succeeded at localization
  (P1 R-A at landslide) but the identification leg requires PARAMETER CAPTURE on the
  marginal PIT chi^2 metric, not just localization on the alpha_L metric. A 4.18x
  further chi^2 reduction from M3's 953.84 to 228 within a single sigma-algebra enrichment
  step is structurally larger than the most recent step in the reduction sequence
  (M1->M3 = 1.44x) and would require the within-cell mixture-2-Gaussian to capture
  heterogeneity that the same family at M3 baseline could not (the M3=M4=M5 chi^2-indistinguishability
  result says distributional flexibility within a stratum is bounded). The hour_of_week-flat
  clim-gap (~+1000 MW, growing, hour-independent) is orthogonal to Z = hour_of_week,
  so the clim-gap component of the marginal chi^2 - which Q2B identified as the under-dispersion
  signature pointing at exogenous content - is not absorbed by Z, putting a hard floor
  on what Q1A can clear.
