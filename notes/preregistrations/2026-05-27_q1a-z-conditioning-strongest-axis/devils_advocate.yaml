    the 8-level partition captures within-bin heterogeneity the centred mixture can
    fit even at n=213. The proponent's R-A1A on Z_c is correct.
- condition: chi2_Z_b >= 900 (within paired-bootstrap noise of the M3 baseline 953.84)
  interpretation: Fri-late carve-out adds essentially nothing on top of the day_type
    sigma-algebra; my Z_b-as-modest-improvement picture is wrong. R-B1A may still
    fire (via Z_c if it cleared the gap or via no-improvement) but the head-to-head
    winner story flips and my rationale needs a re-read.
- condition: chi2_diff = chi2_Z_b - chi2_Z_c 95%% CI excludes zero on the positive
