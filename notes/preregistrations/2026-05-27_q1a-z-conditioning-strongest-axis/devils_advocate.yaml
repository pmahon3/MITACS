opportunity_cost: If Q1A fires R-B1A (as forecast), one week of analyst time advances
  the thread to Q1B (Z2 = time_of_day per thread branching_rules) but does not exit
  the resolution-paths thread. The faster alternative would be a parallel-track Q1C-style
  temperature-Z probe (would require ECCC ingest scaffolding, ~3-5 analyst-days new)
  which is currently closed-sibling-not-fired by the thread but is the most-cited
  exogenous candidate per clim-gap-nonstationary and postcovid-probe. If R-C1A fires
  (low DA probability), the thread exits cleanly via P2 (synthetic calibration); if
  R-A1A fires (high proponent probability), thread RESOLVED with sub-finding on Z_b
  vs Z_c.
outcome: R-B1A
rationale_summary: The Q2B (S10) ensemble UNDER-disperses everywhere and routes the
  residual ~954 chi^2 to missing exogenous content (weather, state-space coverage)
  rather than to within-data sigma-algebra enrichment; hour_of_week partitions the
  existing data but does not inject exogenous information, so the clim-gap component
  of the marginal pathology (which is hour-flat and weeks-flat per clim-gap-nonstationary)
  is not absorbed by Z. The reduction curve (M0->M1 = 16x, M1->M3 = 1.44x) is asymptoting;
  a 4.18x further reduction from M3=953.84 to 228 within a single sigma-algebra enrichment
  step would invert the curve's shape. P1's alpha_L range 0.575 is a necessary condition
  (localized non-Gaussian mass exists) but not sufficient (the marginal chi^2 metric
  requires the per-cell mixture fit to capture the heterogeneity, which the 3-parameter
  centred-mixture EM cannot do in cells like sunday bin 6 at n=213 without bleeding
  variance back into the bootstrap CI).
