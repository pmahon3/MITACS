notes_for_arbiter: "Check R: PASS. All 15 phase_a dependent variables present in the\nresult artifact (result.yaml sidecar\
  \ + experiment/results/q1a_z_conditioning.txt).\nPrimary verdict statistic better_chi2 = 952.5166666666667 matches phase_a\
  \ metric\ndefinition exactly. ci_method matches (paired_day_bootstrap n=1000, 95% percentile).\nShape outcomes evaluable:\
  \ R-B1A fires unambiguously (better_chi2 in (228, 2284],\nboth CI bounds inside the same band). Code-path PRODUCTION-PATH;\
  \ inline synthetic\ngate cleared; reproduction check exact to 4 decimal places.\n\nSubstantively notable content the arbiter\
  \ should surface (all derivable from\nreported numerics alone):\n\n  1. R-B1A fires unambiguously - this is the registered\
  \ ambiguous band, NOT the\n     R-C1A falsification cut. better_chi2 = 952.5 is ~4x clear of R-A1A (228) and\n     ~2.4x\
  \ clear of R-C1A (2284). Even the lower CI bound (625) is above the\n     R-A1A cut, and the upper CI bound (1342) is well\
  \ below R-C1A. The verdict is\n     not borderline R-B1A; it is comfortably inside the ambiguous band.\n\n  2. NEAR-TIE\
  \ between Z_b and Z_c. chi2_diff = +33.5 with CI [-93.2, +142.6] straddling\n     zero. Paired SE ~= 56.8 (user-reported\
  \ expansion of the bootstrap interval);\n     |diff| < 1-sigma. Z_c is the point-estimate winner but the head-to-head\n\
  \     sub-finding records 'no statistically significant ranking between Z_b and\n     Z_c'. NEITHER forecaster's signed-margin\
  \ prediction is statistically\n     distinguishable from zero (proponent: Z_c wins by +220; DA: Z_b wins by\n     -150).\
  \ The point estimate happens to favor Z_c by +33.5 (consistent with\n     proponent's directional call but the magnitude\
  \ is ~7x smaller than\n     proponent's forecast).\n\n  3. Z CONDITIONING DELIVERS ESSENTIALLY NO MARGINAL REDUCTION. The\
  \ unconditioned\n     baseline (Q2A's settled M3) reproduces at q1a_no_z_chi2 = 953.84 within\n     paired-bootstrap noise.\
  \ The better Z-conditioned candidate sits at 952.5,\n     a reduction of just 1.3 chi^2 units out of the 725.84 gap-to-close\
  \ to clear\n     R-A1A. The Z conditioning lever - the central premise of the resolution-paths\n     thread - moves the\
  \ needle by 0.18% of the gap. The reduction curve\n     (M0->M1 = 16x, M1->M3 = 1.44x, M3->M3+Z = 1.001x) has not asymptoted\
  \ to\n     1.0 but is very close. This is a stronger negative reading than the R-B1A\n     category alone suggests.\n\n\
  \  4. PER-CELL chi^2 contributions for Z_c are concentrated in the hot-zone\n     bins identified by P1 (S11). saturday__z6\
  \ chi^2 = 1634 (n=1296) is the\n     single dominant contribution, exceeding the pooled marginal chi^2.\n     sunday__z6\
  \ chi^2 = 267 and sunday__z7 chi^2 = 440 are also above the R-A1A\n     cut. This corroborates P1's binding hot-zone identification\
  \ (bins 5/6/7 =\n     Fri 10:00 - Sun 23:00) but reveals that the per-(day_type, bin) mixture-2-\n     Gaussian fit CANNOT\
  \ absorb the within-cell heterogeneity: even after\n     stratifying by hour-of-week bin, the binding cell's chi^2 (1634)\
  \ is\n     comparable to the full unconditioned chi^2 (954). The mixture family within\n     a stratum is at its capacity.\n\
  \n  5. PER-CELL MIXTURE PARAMETERS are consistent with P1's hot-zone reading:\n     hot cells (saturday__z6, sunday__z6,\
  \ sunday__z7) have w2 (tail weight)\n     = 0.20, 0.38, 0.40 respectively, vs cold cells (weekday__z2/3/4/5 cluster\n  \
  \   at w2 ~ 0.10-0.13). The mixture is doing what P1's alpha_L predicted -\n     larger tail-component weight in the weekend\
  \ strata - but the chi^2 metric\n     is not closed by this granularity. Per phase_a \xA7metric.SECONDARY this is\n    \
  \ informational decomposition; verdict statistic is the pooled marginal.\n\n  6. THE SUBSTANTIVE READING (the arbiter's\
  \ job to render): mechanical R-B1A\n     fires; both proponent and DA missed the point forecast (proponent CI\n     [130,\
  \ 320] under-shot 952.5 by 4x; DA CI [540, 1080] missed 952.5 by\n     uppper-bound 1080 < observed 1342 upper CI; central\
  \ call 800 vs observed\n     952.5). DA's outcome CATEGORY (R-B1A) is mechanically correct; proponent's\n     (R-A1A) is\
  \ falsified. But neither side's point forecast nor CI brackets\n     the realized 952.5. This is the fourth-named-failure-mode\
  \ pattern AGAIN\n     (mechanical matches one side's outcome category; within-bucket forecasts\n     match neither side),\
  \ now firing for the FIFTH time in the workflow's\n     history (after Q1, eigenmodes-v1, missing-content P1, Q2B, resolution-paths\n\
  \     P1 - this Q1A is the fifth).\n\n  7. ROUTING: per phase_a.shape_outcomes.R-B1A.interpretation + branching_rules.\n\
  \     Q1A.R-B1A, R-B1A routes to Q1B (second-strongest axis from P1; per the P1\n     arbiter's ranking, time_of_day at\
  \ range 0.485, with overnight-vs-rest as\n     the binding contrast). The thread does NOT resolve; Q1B is the next live\n\
  \     node. The 'no ranking' head-to-head sub-finding means NEITHER Z_b NOR Z_c\n     becomes a 'preferred Z1' carried forward;\
  \ Q1B's cumulative chi^2 is computed\n     against the better point estimate Z_c (which is what the verdict\n     statistic\
  \ better_chi2 already records).\n\nArbiter precondition fidelity_coverage_passed: true.\n\n\nProvenance note: this phase_fidelity_check_r.yaml\
  \ carries git_clean: false\nbecause the result.yaml sidecar and experiment/results/q1a_z_conditioning.txt\nare freshly written\
  \ (untracked) at the time this file is stamped. Same\ninline-stamp pattern documented in Q2B's and P1's Check R artifacts.\
  \ The\ncanonical cleanliness witness for the underlying run is the .txt's own\nmake_result() header which records git_clean:\
  \ true at git_sha\nb1336475ec21d8ba6507bde1be2c8a42fdb5e4c1. The result artifact's\ninputs_fingerprint 355df31367a5d7e0...\
  \ and frozen_spec_hash\nf0dd9c8795fda781... pin the run state. Registry verify will report chain\nverified once both files\
  \ are tracked. The git_clean: false in this Check\nR yaml is the inline-stamp pattern, not a tree-state defect. Arbiter\
  \ records\nresult_from_clean_tree: true with this caveat.\n"
