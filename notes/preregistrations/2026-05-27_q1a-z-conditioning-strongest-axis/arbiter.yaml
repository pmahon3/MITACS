verdict_reasoning: 'Mechanical verdict per phase_a.shape_outcomes: R-B1A fires unambiguously (better_chi2 = min(986.02, 952.52)
  = 952.52, CI [625.34, 1342.33]; both point estimate and the full CI sit inside the registered (228, 2284] ambiguous band,
  ~4x clear of R-A1A and ~2.4x clear of R-C1A). proponent forecast R-A1A; DA forecast R-B1A. R-B1A wins on the registered
  outcome category; this matches DA. Per arbiter.md taxonomy mapping, this would be labelled DEVILS-ADVOCATE-CONFIRMED on
  the outcome-category criterion (DA''s R-B1A category cleared the realized data against proponent''s R-A1A), but per workflow
  precedent (Q2A R-B2, Q2B R-C3) the verdict label is the registered outcome category itself: R-B1A.


  Substantive findings (the verdict is R-B1A + the below; the within-bucket detail is what makes outcome_substantive = R-B1A_unforecast_with_DA_category_match):


  1. R-B1A FIRES UNAMBIGUOUSLY, NOT BORDERLINE. Point estimate (952.5) and full CI ([625, 1342]) sit inside (228, 2284]. The
  verdict is not borderline R-B1A; the result is comfortably inside the ambiguous band, ~4x clear of R-A1A on the low side
  and ~2.4x clear of R-C1A on the high side. proponent''s R-A1A is decisively falsified: chi2_min point 200 (forecast) vs
  952.5 (realized) is a 4.8x overshoot relative to forecast, and the entire forecast CI [130, 320] sits entirely below the
  realized lower CI bound 625.


  2. THE Z CONDITIONING LEVER DELIVERED ESSENTIALLY NO MARGINAL REDUCTION. This is the strongest negative reading in the result.
  The unconditioned baseline (Q2A''s settled M3, reproduced to 4 decimal places at q1a_no_z_chi2 = 953.8433) drops to 952.5167
  under the better Z-conditioned candidate. Reduction = 1.3267 chi^2 units. Gap-to-close to clear R-A1A = 953.8433 - 228 =
  725.8433. Share of gap closed by Z = 1.3267 / 725.8433 = 0.001827 = 0.18%. The Z conditioning lever - the central premise
  of the resolution-paths thread - moved the verdict statistic by 0.18% of the gap-to-close. The remaining 99.82% of the gap
  is outside the (day_type, Z=hour_of_week-derived) sigma-algebra enrichment. This is more informative than R-B1A alone: even
  within the ambiguous band, the realization sits at the HIGH end of the band (952.5 is much closer to R-C1A 2284 than to
  R-A1A 228 in absolute chi^2 units; on the log-scale that defines the gate, it sits ~24% of the way from R-A1A to R-C1A).


  3. THE HEAD-TO-HEAD IS A NEAR-TIE. chi2_diff = 33.5 with paired SE = 56.84 and CI [-93, +143] straddling zero. Z_c is the
  point-estimate winner (favored by 33.5 chi^2 units) but the difference is below 1-sigma. Per phase_a.metric NEAR-TIE handling,
  the head-to-head sub-finding records "NO STATISTICALLY-DISCERNIBLE WINNER between Z_b and Z_c." The 8-level granularity
  (Z_c) and the binary collapse (Z_b) are empirically indistinguishable on the verdict-metric; parsimony favors Z_b but the
  data does not discriminate. Both forecasters'' signed-margin predictions (proponent: Z_c by +220; DA: Z_b by -150) are statistically
  indistinguishable from no-ranking at 95%. proponent''s what_would_change_my_mind condition #2 ("chi2_Z_b - chi2_Z_c < 50,
  near-tie at head-to-head") is TRIGGERED at realized diff = 33.5.


  4. PER-CELL chi^2 CORROBORATES P1 BUT REVEALS A FAMILY-CAPACITY CEILING. The per-(day_type, Z_c) cell chi^2 decomposition
  aligns exactly with P1 (S11): saturday__z6 (P1''s hottest stratum, alpha_L = 0.61) contributes 1634 chi^2 units in a single
  cell (n=1296). This single hot-zone cell exceeds the pooled marginal chi^2 (952.5) by ~70%. sunday__z6, sunday__z7 contribute
  267 and 440 - all above R-A1A cut on a per-cell basis. weekday cold strata (bins 0-4 in weekday day_type) all sit below
  R-A1A within cell (chi^2 = 37-78). The hot-zone alpha_L signal P1 detected is REAL and concentrated where P1 said it was.
  But the per-(day_type, Z_c) mixture-2-Gaussian fit has tail weights w2 = 0.20-0.40 in the hot cells and CANNOT absorb the
  within-cell heterogeneity on the chi^2 metric. The same-family lever within a finer sigma-algebra is at capacity: P1''s
  identifier was a real signal, but the localization is sufficient to RANK strata, not sufficient to CLOSE the gap via same-family
  mixture refinement.


  5. THE SUBSTANTIVE PICTURE STRENGTHENS S9 + S10 IDENTIFIABILITY OBSTRUCTION EVIDENCE. Q2A (S9) bounded the distributional-class
  lever (M3 = M4 = M5 chi^2-indistinguishable; 1.44x reduction floor). Q2B (S10) bounded the same-Q non-distributional candidates
  (all shares below 15% null; two sign-determined NEGATIVE). Q1A is the first test of the sigma-algebra enrichment lever (with
  within-data Z from time index alone, no exogenous Z). The 0.18% reduction is empirically very close to ZERO marginal improvement.
  Joint S9+S10+S11+Q1A picture: (a) distributional family flexibility within a stratum is bounded; (b) same-Q non-distributional
  mechanisms are bounded; (c) hour_of_week-derived sigma-algebra enrichment is bounded (0.18% of gap); (d) the residual chi^2
  mass is concentrated where P1 localized it but cannot be absorbed by any within-data lever tested to date. The identifiability
  obstruction (disintegration_diagnostic.md: structured-noise vs noisy-structure indistinguishable from kappa_Q alone) is
  corroborated by the chi^2-side metric, not just by Patra-Sen alpha_L. Resolution requires auxiliary information BEYOND the
  time index - the candidate paths are temperature (the clim-gap-nonstationary prior, untested), genuinely-finer stratification
  (cross-axis joint Z), or synthetic Gaussian-DGP calibration (P2 path).


  6. DA''s Z_c POINT FORECAST WAS NEARLY EXACT. DA''s pre-registered chi2_Z_c point = 950; realized 952.5. Residual 2.5 chi^2
  units (0.3% of point estimate). This is the single best point forecast in either forecaster''s registered numerics across
  the workflow''s history. DA''s rationale (Z_c wastes granularity on small-cell EM variance; the reduction curve has asymptoted)
  is the pre-registered story that matches the data. DA gets the outcome category AND the magnitude AND the CI bracket; only
  the head-to-head direction is point-wrong (but realized direction is within paired SE so this is unfalsified at 95%).


  7. PROPONENT''s HEAD-TO-HEAD DIRECTION IS POINT-CORRECT but the magnitude is 6.6x too large. Proponent forecast Z_c wins
  by +220; realized +33.5 (same sign, 6.6x smaller). At the point estimate, proponent''s call (Z_c is the better candidate)
  IS the correct direction; the magnitude prediction was scaled to what would have been required for an R-A1A landslide, not
  to the realized near-tie regime. Proponent''s alpha_L-localization-implies-chi^2-closure premise was wrong; localization
  (necessary) does not imply closure (sufficient), exactly as DA registered.


  8. THE FIFTH INSTANCE OF FOURTH-NAMED-FAILURE-MODE, NEW SHAPE VARIANT. Mechanical matches DA on outcome category; within-bucket
  point forecasts also closer to DA; but the head-to-head sub-finding direction is point-correct for proponent (statistically
  indistinguishable from no-ranking). The pattern shape: the realized data sits in a near-tie regime where neither forecaster''s
  sub-finding is empirically discriminable at 95%. The arbiter handles this via mechanical-verdict-plus-substantive-content;
  no engineering fix needed (per CLAUDE.md applied-audit workflow). Prior instances (eigenmodes-v1 O2-vs-O3, pit-calendar
  P1 tautology, Q2B mech_2/mech_3 negative shares, resolution-paths P1 hour_of_week-not-season) all had distinct shapes; this
  is the FIFTH with a NEW SHAPE.


  9. ROUTING: per phase_a.shape_outcomes.R-B1A.interpretation + thread branching_rules.Q1A.R-B1A, R-B1A routes to Q1B (second-strongest
  axis from P1). Per P1 arbiter ranking, the second-strongest axis is time_of_day at range 0.485, with binding overnight-vs-rest
  contrast (overnight 0.1125 vs afternoon/morning_ramp/evening 0.475-0.598). Q1B''s cumulative-with-Z1 computation uses Z_c
  (the better point-estimate Z, even though the head-to-head is a near-tie) as the carryforward baseline. The thread does
  NOT resolve at Q1A; the next live node is Q1B. Q1B''s phase_a must factor in finding #2 above: with Z1 (hour_of_week) delivering
  0.18% of the gap, the prior on Q1B closing the gap via time_of_day (range 0.485 < P1''s 0.575 for hour_of_week) should be
  even weaker - time_of_day has roughly 84% the localizing signal of hour_of_week but is also re-partitioning information
  already in the time index. R-A1B firing is empirically possible but requires time_of_day to be capturing signal orthogonal
  to hour_of_week, which P1 did not test for. Q1B is the registered next step; the arbiter does not extend the pre-registration
  to a cross-axis joint Z test (that would require thread amendment).'
