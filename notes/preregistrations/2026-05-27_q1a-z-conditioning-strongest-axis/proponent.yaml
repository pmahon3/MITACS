what_would_change_my_mind:
- condition: "Q2A's pre-cutoff M3 fit reproduction (the in-script reproduction check\
    \ at metric.SECONDARY) reads chi\xB2_unconditioned \u2260 953.84 \xB1 paired-bootstrap\
    \ noise."
  interpretation: Baseline-unconditioned reproduction has drifted; the M3 fit under
    per-cell stratification is not directly comparable to Q2A's settled baseline and
    the R-A1A bar would be re-interpreted under the new baseline. If reproduction
    is ~10% high (say 1050), my chi2_Z_c point shifts to ~250 and the R-A1A landslide
    becomes implausible.
- condition: "chi\xB2_Z_b - chi\xB2_Z_c < 50 (near-tie at the head-to-head)."
  interpretation: The bin-5/6/7 internal gradient I'm betting on (sat 0.61 vs Fri-late
    0.55 vs sun 0.55) is small enough that Z_b's collapse doesn't meaningfully degrade
    the fit. Z_c's extra parameters would be paying for noise, not signal. I'd update
    toward R-B1A on the better candidate and accept the binary as the parsimony-preferred
    winner.
- condition: Per-cell M3 fits in the hot-zone cells (saturday bin 6, sunday bin 6/7)
    produce weights w1 < 0.5 (i.e. the 'tail' component is the majority).
  interpretation: "If the hot-zone is dominated by the tail component rather than\
    \ having a small heavy tail, the 2-component centred-Gaussian mixture is itself\
    \ misspecified at the cell level \u2014 flexibility is being used to absorb structure\
    \ the mixture family can't capture. \u03C7\xB2_Z_c would be expected in R-B1A\
    \ and the head-to-head would still favor Z_c but not at landslide strength."
- condition: "Pooling-fallback fires on \u22652 cells (not just sunday bin 6)."
  interpretation: "Per phase_a.threshold_derivations only sunday bin 6 at n=213 is\
    \ at risk. If a second cell falls under 200 in the bootstrap resamples (paired-day\
    \ resampling can drop cells below threshold) the per-stratum fits collapse back\
    \ toward the day_type-pooled M3 baseline, and chi\xB2_Z_c shifts toward Q2A's\
    \ 954 rather than below 228."
