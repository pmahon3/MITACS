rationale_summary: "P1 (S11) identified hour_of_week as the binding axis at landslide\n\
  strength: range 0.575 [0.4475, 0.6475] with hot-zone strata (bins\n5/6/7, Fri 10:00\
  \ - Sun 23:00) carrying \u03B1\u0302_L 0.55/0.61/0.55 and the\ncold-zone bin 0 at\
  \ \u03B1\u0302_L = 0.035. This is structural per-stratum\ncontamination mass that\
  \ the day_type-only \u03C3-algebra in Q2A's M3\ncannot absorb; enriching to \u03C3\
  (day_type, Z_c) lets each hot-zone\ncell fit its own mixture tail and the cold-zone\
  \ cells fit nearly\nGaussian cores, which is exactly the \u03C3-algebra-enrichment\
  \ lever\nQ2B (S10) failed to test (Q2B was \u03C3-algebra-preserving). Q2A's\nper-day-type\
  \ decomposition (saturday \u03C7\xB2 = 1184 dominating the\npooled 954) confirms\
  \ the \u03C7\xB2 mass is concentrated where P1's \u03B1\u0302_L\nis largest, so\
  \ the per-cell M3 refits should cut saturday's\ncontribution by ~3\xD7 and drop\
  \ the pooled chi\xB2 near or below\nthe 228 cut. Z_c (8-level) preferred over Z_b\
  \ (binary) because\nthe binary collapses the bin-5/6/7 gradient (sat at \u03B1\u0302\
  _L 0.61 vs\nFri-late at 0.55 vs sun at 0.55) that drives the saturday-specific\n\
  dominance.\n"
