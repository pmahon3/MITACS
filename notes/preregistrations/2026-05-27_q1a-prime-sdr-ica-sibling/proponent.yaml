rationale_summary: |
  P1 settled R-A at landslide strength, locating the missing-Z structure
  on a social-weekly grid with hour_of_week range 0.575 [0.448, 0.648]
  and a sharp hot-zone (Fri 10:00 - Sun 23:00, bins 5/6/7) vs cold-zone
  (Mon 01:00-21:00, bin 0) signature. The Q1A' X matrix contains
  day_type indicators, time_of_day sin/cos, and lag-1/lag-24 demand —
  these jointly proxy the social-weekly grid as a linear combination.
  SIR's central subspace should pick up that combination as a top
  direction; FastICA, designed to isolate maximally non-Gaussian
  components and operating on residuals with excess kurtosis ~25-33,
  should exploit the heavy-tailed mixture structure that lives ON the
  social-weekly grid (Q1 S8 + P1 hot/cold pattern). FastICA wins by
  ~0.15 because non-Gaussian-mixture structure is FastICA's direct
  target, whereas SIR sees it indirectly through a non-monotone link
  function (sliced regression on residuals against a 10-slice grid).
  R-A1A' at landslide strength is the predicted outcome; the
  permutation null should sit near 0.06-0.10 (chance-level for n=12000
  paired rows).

