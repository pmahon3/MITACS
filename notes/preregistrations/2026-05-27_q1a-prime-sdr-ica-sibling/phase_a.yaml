research_question: 'Do data-driven Z-recovery methods — Sliced Inverse Regression (SIR; Li 1991) and FastICA (Hyvärinen &
  Oja 2000) — recover hour_of_week as a top non-Gaussian / dimension-reducing component of κ̂_Q''s PIT residuals when hour_of_week
  is EXPLICITLY EXCLUDED from the input covariate matrix, validating P1''s hand-specified binding axis via independent methods?
  Verdict statistic: max(|ρ_SIR|, |ρ_FastICA|) against the cyclic weekly-fundamental hour_of_week phase (sin/cos at 2π/168),
  pre-locked cuts at 0.5 (R-A1A'' recovered) / 0.3 (R-B1A'' partial) / under-0.3 (R-C1A'' not recovered).'
schema: phase_a
shape_outcomes:
  R-A1A':
    criterion: max(|ρ_SIR|, |ρ_FastICA|) ≥ 0.5 (at least one data-driven method's top component aligns with the weekly-cyclic
      hour_of_week phase at conventional 'strong' effect size)
    interpretation: 'hour_of_week IS recovered. The head-to-head sub-finding records which method (SIR or FastICA) scored
      higher (with paired-bootstrap CI on the difference). Substantive reading: data-driven Z-recovery methods validate P1''s
      hand-specified axis without pre-specification — the approach generalizes for future Z-discovery when the candidate set
      is less obvious (e.g., the framework note disintegration_diagnostic.md §(f)). LANDSLIDE qualifier: if BOTH the point
      estimate AND the lower 95% CI bound of max(|ρ|) clear 0.5, substantive reading is ''robust independent recovery''; if
      only the point clears (CI straddles), mechanical R-A1A'' fires with ''landslide-not-met'' recorded. PHASE CEILING: a
      realized max(|ρ|) ≈ 0.707 (worst-case phase under Spearman against sin/cos separately) is still landslide-class; the
      0.5 cut is phase-robust. Per thread branching_rules.Q1A''.R-A1A'' = null, this verdict is INDEPENDENT and NON-GATING
      with respect to thread state — Q1A''s χ²-based verdict drives thread advancement.'
  R-B1A':
    criterion: max(|ρ_SIR|, |ρ_FastICA|) in [0.3, 0.5) (better method's top component partially aligns with hour_of_week phase,
      at conventional 'medium' effect size)
    interpretation: 'Partial recovery. Both methods sense the social-weekly structure to some degree but neither dominantly
      identifies it. Substantive reading: P1''s hand-specified axis captures a real signal, but the linear central-subspace
      (SIR) and non-Gaussianity-maximizing (FastICA) views of the residuals only partially align with it — the underlying
      structure may be discrete-categorical (bin-like) in a way that doesn''t reduce cleanly to a single cyclic direction.
      The head-to-head sub-finding records which method scored higher. Per thread branching_rules.Q1A''.R-B1A'' = null, INDEPENDENT
      and NON-GATING.'
  R-C1A':
    criterion: max(|ρ_SIR|, |ρ_FastICA|) < 0.3 (neither method recovers an hour_of_week-aligned direction at the conventional
      'medium' effect-size floor)
    interpretation: 'hour_of_week NOT recovered. Two non-exclusive readings: (a) P1''s hand-specified hour_of_week axis is
      an artifact of the marginal PIT pathology rather than a genuine non-Gaussian latent component, or (b) the effect is
      below SDR/ICA sensitivity at n=12000. The arbiter cannot mechanically distinguish (a) from (b) — both are substantive
      readings consistent with R-C1A''. The head-to-head sub-finding records which method scored higher (still informative;
      in (b) the higher score is closer to the floor, in (a) both are at chance level). Per thread branching_rules.Q1A''.R-C1A''
      = null, INDEPENDENT and NON-GATING.'
stopping_criterion:
  reasoning: Pre-registration complete; verdict determined by realized max(|ρ|) against pre-locked cuts. No iteration, no
    parameter tuning post-data, no swap of the cyclic-ρ rule. The head-to-head structure is locked at two methods (SIR, FastICA);
    adding a third (e.g., MAVE, LiNGAM, FCI from the disintegration_diagnostic.md §(f) menu) after seeing Q1A' results would
    require a new dated entry per the append-only rule. The Q1A' verdict is INDEPENDENT of Q1A's outcome — the arbiter renders
    against R-A1A'/R-B1A'/R-C1A' regardless of whether Q1A fires R-A1A, R-B1A, or R-C1A.
  rule: Run synthetic recovery gate (per baselines.secondary); load post-cutoff X (9 columns per metric) and Y (u_PIT from
    pit_M1); standardize X column-wise; fit SIR via sliced_inverse_regression_fit(X, Y, n_slices=10); fit FastICA via sklearn.decomposition.FastICA(n_components=10,
    fun='logcosh', whiten='unit-variance', random_state=42).fit_transform(np.hstack([X, Y[:, None]])); extract top component
    per the pre-locked rule for each method; compute |ρ_method| = max(|Spearman(scores, cyc_sin)|, |Spearman(scores, cyc_cos)|);
    1000-rep paired-day bootstrap on (|ρ_SIR|, |ρ_FastICA|, max(|ρ|)); 1000-rep permutation null for chance-level baseline;
    verdict R-A1A'/R-B1A'/R-C1A' per max(|ρ_SIR|, |ρ_FastICA|); emit result. STOP.
thread:
  independence_clause: 'Q1A'' is a NON-GATING sibling of Q1A under P1.R-A. The Q1A'' arbiter renders its verdict against R-A1A''/R-B1A''/R-C1A''
    INDEPENDENTLY of Q1A''s χ²-based verdict (R-A1A/R-B1A/R-C1A). Per thread.branching_rules.Q1A'' = {R-A1A'': null, R-B1A'':
    null, R-C1A'': null}, no Q1A'' outcome advances or closes the thread state machine — Q1A''s verdict is the thread-state-advancing
    reading. Q1A and Q1A'' run in parallel; they share the SAME u_PIT residual series (Q1''s M1 PIT) as input but apply different
    reading methods (Q1A: stratified M3 re-fit with Z = hour_of_week-derived plus χ² recompute; Q1A'': linear-SDR and non-Gaussianity-maximizing-ICA
    on residuals with hour_of_week EXCLUDED from X). The Q1A'' verdict provides a consistency-check reading on whether P1''s
    hand-specified hour_of_week axis is recoverable by data-driven methods, validating (or not) the approach for future Z-discovery
    in less-obvious candidate-set contexts. A divergence between Q1A and Q1A'' (e.g., Q1A R-A1A but Q1A'' R-C1A'') is itself
    substantively informative and is captured in the arbiter''s cross-experiment note.'
