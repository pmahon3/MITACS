  threshold_derivations: 'Numeric thresholds (R-A1A'': max_rho ≥ 0.5; R-B1A'': max_rho in [0.3, 0.5); R-C1A'': max_rho < 0.3)
    are inherited VERBATIM from the thread skeleton''s Q1A''.phase_a_skeleton.outcome_categories (post-amendment A1, thread
    body_sha256 21a8bb20b6e9e19c8536fa664dc8978749c19c0d1c21dee3f239c59781d3f6d6). They are NOT derived from prior-node data
    — they are pre-locked at thread-amendment time. Conventional rationale: in social-science effect-size literature (Cohen
    1988 and successors), |ρ| ≥ 0.5 is ''strong'', |ρ| in [0.3, 0.5) is ''medium'', |ρ| < 0.3 is ''weak-to-negligible''. The
    thread amendment chose these conventional cuts rather than gate-derived (data-dependent) cuts because Q1A''s metric (|Spearman
    ρ|) is not on the χ² scale of Q1A/Q2A/Q2B and has no Q1A''-internal gate (the synthetic recovery gate validates implementation,
    not threshold calibration).


    The cyclic-ρ rule (max(|ρ_top_vs_sin|, |ρ_top_vs_cos|)) is the phase_a author''s pre-locked specification of the thread
    skeleton''s informal phrase ''|Spearman ρ| between the top component''s loadings and the cyclic hour_of_week phase.''
    The thread skeleton''s skeleton_thresholds_depend_on.hour_of_week_cyclic_phase rule explicitly designates this construction
    as the phase_a author''s call. The max-of-both rule respects Spearman literally while accommodating the circularity of
    hour_of_week (a single Spearman against either sin OR cos alone has known non-monotonicity issues — see metric.CYCLIC-ρ
    RULE for the rationale).


    SIR PRODUCTION HELPER: SIR is not currently in the .venv (no `dimred`, no `sliced` package). A new production helper `sliced_inverse_regression_fit(X,
    Y, n_slices=10)` will be added to `processing/innovations/estimator.py` as a one-time pre-data build step, mirroring the
    `patra_sen_fit` pattern. The helper is whitelisted in `experiment/audit/code_path.py` PRODUCTION_SYMBOLS as `processing.innovations.estimator.sliced_inverse_regression_fit`.
    The helper''s recovery gate is `baselines.secondary` (synthetic with known cyclic structure must yield max(|ρ|) ≥ 0.70).
    This build step is PRE-REGISTERED here (not a deviation): it is part of the experiment infrastructure required to execute
    Q1A'' via production paths. Without it, the SIR fit would be inline in the experiment script and trigger /audit code-path
    REIMPLEMENTED. FastICA is whitelisted as `sklearn.decomposition.FastICA` (already in .venv, sklearn 1.7.0).'
