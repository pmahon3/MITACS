  excluded:
  - reasoning: hour_of_week is the candidate Z whose recoverability is being tested WITHOUT pre-specification. Including it
      in X would defeat the experiment's purpose (the verdict statistic would trivially fire R-A1A' if hour_of_week is in
      X). Its cyclic representation (cyc_sin, cyc_cos at 2π/168) appears ONLY as the reference target for the |ρ| computation,
      NOT as an input to SIR or FastICA.
    variable: hour_of_week
  - reasoning: Higher harmonics of the weekly cycle (2π/84, 2π/56, ...) are not in scope for the reference target. P1's 8-bin
      structure corresponds to the lowest-resolution consistent fundamental; testing higher harmonics would be a post-hoc
      multiplication of comparisons. If R-C1A' fires, a follow-up exploring higher harmonics could be a new dated entry.
    variable: higher_harmonics_of_hour_of_week
  - reasoning: Temperature requires exogenous data (ECCC hourly weather) and is the domain of Q1C (closed by P1 R-A firing).
      Including temperature in X for Q1A' would conflate the data-driven-recovery-of-P1's-axis question with the candidate-Z-test
      question; the two are distinct experiments by design.
    variable: temperature_or_exogenous_Z
  - reasoning: Other data-driven Z-recovery methods (MAVE, SAVE, LiNGAM, FCI; per disintegration_diagnostic.md §(f)) are not
      in the head-to-head. The thread skeleton pins candidate_set to ['SIR', 'FastICA']. Adding a third method after seeing
      Q1A' results would violate the append-only rule. If R-C1A' fires, a new thread node testing MAVE or LiNGAM is a natural
      follow-up.
    variable: additional_data_driven_methods_MAVE_SAVE_LiNGAM_FCI
  - reasoning: Cross-axis joint stratification (e.g., (day_type, hour_of_week, demand_quantile)) is the domain of Q1B and
      cross-axis Z amendments; Q1A' is a SINGLE-Z recovery diagnostic on the same data footprint as P1.
    variable: cross_axis_joint_Z_constructions
  independent:
  - method
  - X_column_subset
  - Z_construction
