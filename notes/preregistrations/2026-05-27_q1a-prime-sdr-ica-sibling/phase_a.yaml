hypothesis:
  counter: 'See devils_advocate.yaml. R-B1A'' or R-C1A'': hour_of_week is a discrete bin label (P1''s 8-bin construction;
    bin = (weekday·24 + (h-1)) // 21) whose effect on residuals concentrates in a small number of strata (hot zone bins 5/6/7
    are 37.6% of post-cutoff rows; cold zone bin 0 is ~12.5%). A linear SDR via SIR with 10 slices will mix this categorical-like
    signal with the continuous-noise structure of demand_lag1/lag24 and ramp-out-the-day time_of_day; FastICA''s non-Gaussianity
    contrast (logcosh) is most sensitive to heavy-tailed marginals, not to social-weekly periodicities. Expected max(|ρ|)
    lies in [0.2, 0.45], straddling the 0.3 cut. The substantive picture is that P1''s discretized-axis approach finds signal
    that the linear/non-Gaussianity-maximizing data-driven tools cannot.'
  proponent: See proponent.yaml. R-A1A' fires (max(|ρ_SIR|, |ρ_FastICA|) ≥ 0.5) at landslide strength. The hot-zone vs cold-zone
    α̂_L gap of 0.575 in P1 corresponds to ~57% of mass in the non-Gaussian mixture component varying across hour_of_week
    bins; FastICA's non-Gaussianity contrast is specifically designed to isolate this type of structure, and SIR with 10 slices
    recovers cyclic central subspaces robustly on n=12000. Expected max(|ρ|) ≥ 0.6 (likely with FastICA scoring higher than
    SIR because the social-weekly signal is non-Gaussian-mixture rather than dimension-reducing).
metric: "PRIMARY: head-to-head between two data-driven Z-recovery methods (SIR, FastICA) against a SINGLE verdict cut. The\
  \ verdict statistic is:\n\n  max_rho = max(|ρ_SIR|, |ρ_FastICA|)\n\nwhere each |ρ_method| is the top-component-vs-cyclic-hour_of_week\
  \ alignment computed per the cyclic-ρ rule below.\n\nX MATRIX CONSTRUCTION (PRE-LOCKED; d_X = 9 columns):\n\n  Col 1 (demand_quantile_continuous):\
  \ empirical CDF rank of z_actual within the post-cutoff pool, mapped to [0, 1]. Continuous (NOT P1's tercile).\n  Col 2\
  \ (time_of_day_sin):   sin(2π · h / 24), h ∈ {1..24}.\n  Col 3 (time_of_day_cos):   cos(2π · h / 24).\n  Col 4 (season_sin):\
  \        sin(2π · day_of_year / 365.25).\n  Col 5 (season_cos):        cos(2π · day_of_year / 365.25).\n  Col 6 (day_type_saturday):\
  \ 1 if day_type==saturday else 0.\n  Col 7 (day_type_sunday):   1 if day_type==sunday else 0.\n                        \
  \     (day_type==weekday is the dropped baseline for identifiability.)\n  Col 8 (demand_lag1):       raw demand at lag-1\
  \ (MW), z-scored over the post-cutoff pool.\n  Col 9 (demand_lag24):      raw demand at lag-24 (MW), z-scored over the post-cutoff\
  \ pool.\n\n  Total d_X = 9. hour_of_week is EXPLICITLY EXCLUDED. day_of_week is implicitly captured by (day_type_saturday,\
  \ day_type_sunday); finer than day-type resolution (e.g., Friday-vs-Monday within weekday) is NOT in X, mirroring the absence\
  \ of hour_of_week. Per-column standardization: SIR receives X with each column z-scored over post-cutoff rows (standard\
  \ SIR preprocessing); FastICA whitens internally (sklearn's default whiten='unit-variance').\n\nRESPONSE Y (PRE-LOCKED):\
  \ Y = u_PIT, the per-row PIT value from Q1's M1 predictor (Student-t kernel), the SAME series P1 was run on. Y is a scalar\
  \ in [0, 1].\n\nCYCLIC HOUR_OF_WEEK REFERENCE (PRE-LOCKED):\n\n  hour_of_week = weekday · 24 + (h-1)    ∈ {0, 1, ..., 167},\
  \ weekday ∈ {0=Mon, ..., 6=Sun}, h ∈ {1..24}.\n  cyc_sin = sin(2π · hour_of_week / 168)   (weekly fundamental).\n  cyc_cos\
  \ = cos(2π · hour_of_week / 168)\n\nThis is a TWO-COLUMN representation; the weekly fundamental frequency 2π/168 is the\
  \ lowest non-trivial harmonic consistent with the P1 8-bin (21-hour) structure. Higher harmonics (2π/84, 2π/56, ...) are\
  \ NOT in the reference — the pre-registered test is alignment with the fundamental.\n\nSIR FIT PROCEDURE (PRE-LOCKED; production\
  \ helper required):\n\n  Production path: processing.innovations.estimator.sliced_inverse_regression_fit(X, Y, n_slices=10)\n\
  \  Returns: {'directions': (d_X, d_X) array ordered by decreasing eigenvalue; 'eigenvalues': (d_X,) vector from the SIR\
  \ generalized eigenproblem}.\n  Top component = first column of 'directions' (largest eigenvalue).\n  Top-component projection\
  \ of X onto Y: scores = X_standardized @ directions[:, 0]  — a length-n vector.\n  n_slices = 10 (Li 1991 default; chosen\
  \ pre-data; not tunable post-data).\n\nFASTICA FIT PROCEDURE (PRE-LOCKED):\n\n  Production path: sklearn.decomposition.FastICA(n_components=10,\
  \ algorithm='parallel', fun='logcosh', whiten='unit-variance', random_state=42).fit_transform(np.hstack([X, Y[:, None]])).\n\
  \  Y is appended to X as the LAST column so FastICA can decompose the joint (X, Y) space and identify non-Gaussian directions\
  \ that load on Y; standard usage of FastICA for residual-driven Z recovery (Hyvärinen & Oja 2000).\n  n_components = d_X\
  \ + 1 = 10 (preserves full dimensional information).\n  FAST_ICA_SEED = 42 (pre-locked).\n  Top non-Gaussian component selection:\
  \ post-fit, compute |excess_kurtosis_j| = |E[(s_j - mean)^4]/var^2 - 3| for each recovered source s_j; the top component\
  \ is the one with MAX |excess_kurtosis_j|. Top-component scores = the corresponding source vector (length n).\n\nCYCLIC-ρ\
  \ RULE (PRE-LOCKED; THE LOAD-BEARING DECISION):\n\n  For each method, compute:\n    ρ_sin = Spearman(top_component_scores,\
  \ cyc_sin)\n    ρ_cos = Spearman(top_component_scores, cyc_cos)\n    |ρ_method| = max(|ρ_sin|, |ρ_cos|)\n\n  RATIONALE &\
  \ PHASE CEILING: hour_of_week is a circular variable; a single Spearman against either sin OR cos alone cannot recover a\
  \ perfectly aligned cyclic component because Spearman is rank-based and sinusoids are non-monotone over their full period.\
  \ Taking the max captures alignment under ARBITRARY PHASE φ: a top component proportional to sin(ωt + φ) gives max(|ρ_sin|,\
  \ |ρ_cos|) in [~0.707, 1.0] depending on φ (worst-case at φ = π/4 + kπ/2; best-case at φ in {0, π/2, π, 3π/2}). This is\
  \ the DESIGN CEILING under the Spearman rule: a realized max(|ρ|) ≈ 0.71 must be read as 'R-A1A' at worst-case phase' (still\
  \ landslide-class), not as ambiguous. The 0.5 R-A1A'/R-B1A' boundary sits comfortably below 0.707 so the rule is phase-robust\
  \ there; the 0.3 R-B1A'/R-C1A' boundary is phase-robust because no cyclic alignment of any phase falls below 0.3 unless\
  \ the component is genuinely poorly aligned.\n\n  Alternative considered and rejected: phase-invariant circular-R² from\
  \ regressing the top component on (cyc_sin, cyc_cos) jointly. Rejected to honor the thread skeleton's literal wording ('|Spearman\
  \ ρ|'); the max-of-both rule respects Spearman exactly while accommodating circularity.\n\nHEAD-TO-HEAD VERDICT RULE (PRE-LOCKED):\n\
  \n  The verdict fires on max(|ρ_SIR|, |ρ_FastICA|):\n    - if max_rho >= 0.5:                          R-A1A' (hour_of_week\
  \ recovered; at least one method validates P1's axis)\n    - if max_rho in [0.3, 0.5):                   R-B1A' (partial\
  \ recovery; methods sense but don't dominantly identify)\n    - if max_rho < 0.3:                           R-C1A' (not\
  \ recovered; P1's axis artifactual or below sensitivity floor)\n\n  All three verdicts route to null in thread branching_rules.Q1A'\
  \ — the verdict is INDEPENDENT and NON-GATING with respect to thread state. The head-to-head sub-finding records which method\
  \ (SIR or FastICA) scored higher and by how much (|ρ| difference and its 95% paired-bootstrap CI), even though the verdict\
  \ statistic max() does not depend on the ranking.\n\nTIE / NEAR-TIE HANDLING: methods are NEAR-TIE if ||ρ_SIR| - |ρ_FastICA||\
  \ < 1.0 · paired-bootstrap SE of the difference (1σ of the paired difference distribution). On NEAR-TIE: verdict uses max()\
  \ as above (mechanical), AND the sub-finding records 'no ranking' between SIR and FastICA, AND the landslide CI bound check\
  \ uses the method with the higher point estimate. On NOT-NEAR-TIE: the sub-finding records which method won and by how much.\n\
  \nVERDICT-CUT TRACEABILITY: the cuts 0.5 and 0.3 are inherited VERBATIM from the thread skeleton (resolution-paths-thread\
  \ Q1A' node, post-amendment A1, body_sha256 21a8bb20...). They are NOT derived from a prior node's data; they are pre-locked\
  \ at thread-amendment time. The 0.5 cut is the conventional 'strong recovery' threshold for |ρ| (any |ρ| >= 0.5 is conventionally\
  \ 'strong' in social-science effect-size literature, e.g., Cohen 1988); the 0.3 cut is the conventional 'medium' threshold.\n\
  \nSECONDARY / informational:\n  - Per-method top-component loadings on each of the 9 X columns (which X columns the top\
  \ component most resembles), reported with paired-bootstrap CIs.\n  - Per-method eigenvalue / excess-kurtosis spectrum (informational;\
  \ for diagnosing whether the top component is well-separated from runners-up).\n  - Permutation-null distribution of max_rho\
  \ (1000 reps; reported as 'chance-level baseline').\n  - |ρ_SIR| - |ρ_FastICA| difference and its 95% paired-bootstrap CI\
  \ (head-to-head sub-finding).\n  - Cross-check: confirm P1's pickle (pit_M1) and the (delivery_day, h) -> hour_of_week derivation\
  \ give the same hot-zone assignment as P1's bin labels (no input-substitution defect)."
