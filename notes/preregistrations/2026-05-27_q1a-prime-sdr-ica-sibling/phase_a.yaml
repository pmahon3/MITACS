  rinen & Oja 2000) \u2014 recover hour_of_week as a top non-Gaussian / dimension-reducing component of \u03BA\u0302_Q's PIT\
  \ residuals when hour_of_week is EXPLICITLY EXCLUDED from the input covariate matrix, validating P1's hand-specified binding\
  \ axis via independent methods? Verdict statistic: max(|\u03C1_SIR|, |\u03C1_FastICA|) against the cyclic weekly-fundamental\
  \ hour_of_week phase (sin/cos at 2\u03C0/168), pre-locked cuts at 0.5 (R-A1A' recovered) / 0.3 (R-B1A' partial) / under-0.3\
  \ (R-C1A' not recovered)."
