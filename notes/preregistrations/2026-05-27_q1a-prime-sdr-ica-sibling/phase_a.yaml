      \ higher (with paired-bootstrap CI on the difference). Substantive reading: data-driven Z-recovery methods validate\
      \ P1's hand-specified axis without pre-specification \u2014 the approach generalizes for future Z-discovery when the\
      \ candidate set is less obvious (e.g., the framework note disintegration_diagnostic.md \xA7(f)). LANDSLIDE qualifier:\
      \ if BOTH the point estimate AND the lower 95% CI bound of max(|\u03C1|) clear 0.5, substantive reading is 'robust independent\
      \ recovery'; if only the point clears (CI straddles), mechanical R-A1A' fires with 'landslide-not-met' recorded. PHASE\
      \ CEILING: a realized max(|\u03C1|) \u2248 0.707 (worst-case phase under Spearman against sin/cos separately) is still\
      \ landslide-class; the 0.5 cut is phase-robust. Per thread branching_rules.Q1A'.R-A1A' = null, this verdict is INDEPENDENT\
      \ and NON-GATING with respect to thread state \u2014 Q1A's \u03C7\xB2-based verdict drives thread advancement."
  R-B1A':
    criterion: "max(|\u03C1_SIR|, |\u03C1_FastICA|) in [0.3, 0.5) (better method's top component partially aligns with hour_of_week\
      \ phase, at conventional 'medium' effect size)"
    interpretation: "Partial recovery. Both methods sense the social-weekly structure to some degree but neither dominantly\
      \ identifies it. Substantive reading: P1's hand-specified axis captures a real signal, but the linear central-subspace\
      \ (SIR) and non-Gaussianity-maximizing (FastICA) views of the residuals only partially align with it \u2014 the underlying\
      \ structure may be discrete-categorical (bin-like) in a way that doesn't reduce cleanly to a single cyclic direction.\
      \ The head-to-head sub-finding records which method scored higher. Per thread branching_rules.Q1A'.R-B1A' = null, INDEPENDENT\
      \ and NON-GATING."
  R-C1A':
    criterion: "max(|\u03C1_SIR|, |\u03C1_FastICA|) < 0.3 (neither method recovers an hour_of_week-aligned direction at the\
      \ conventional 'medium' effect-size floor)"
    interpretation: "hour_of_week NOT recovered. Two non-exclusive readings: (a) P1's hand-specified hour_of_week axis is\
      \ an artifact of the marginal PIT pathology rather than a genuine non-Gaussian latent component, or (b) the effect is\
      \ below SDR/ICA sensitivity at n=12000. The arbiter cannot mechanically distinguish (a) from (b) \u2014 both are substantive\
      \ readings consistent with R-C1A'. The head-to-head sub-finding records which method scored higher (still informative;\
      \ in (b) the higher score is closer to the floor, in (a) both are at chance level). Per thread branching_rules.Q1A'.R-C1A'\
      \ = null, INDEPENDENT and NON-GATING."
stopping_criterion:
  reasoning: "Pre-registration complete; verdict determined by realized max(|\u03C1|) against pre-locked cuts. No iteration,\
    \ no parameter tuning post-data, no swap of the cyclic-\u03C1 rule. The head-to-head structure is locked at two methods\
    \ (SIR, FastICA); adding a third (e.g., MAVE, LiNGAM, FCI from the disintegration_diagnostic.md \xA7(f) menu) after seeing\
    \ Q1A' results would require a new dated entry per the append-only rule. The Q1A' verdict is INDEPENDENT of Q1A's outcome\
    \ \u2014 the arbiter renders against R-A1A'/R-B1A'/R-C1A' regardless of whether Q1A fires R-A1A, R-B1A, or R-C1A."
  rule: "Run synthetic recovery gate (per baselines.secondary); load post-cutoff X (9 columns per metric) and Y (u_PIT from\
    \ pit_M1); standardize X column-wise; fit SIR via sliced_inverse_regression_fit(X, Y, n_slices=10); fit FastICA via sklearn.decomposition.FastICA(n_components=10,\
    \ fun='logcosh', whiten='unit-variance', random_state=42).fit_transform(np.hstack([X, Y[:, None]])); extract top component\
    \ per the pre-locked rule for each method; compute |\u03C1_method| = max(|Spearman(scores, cyc_sin)|, |Spearman(scores,\
    \ cyc_cos)|); 1000-rep paired-day bootstrap on (|\u03C1_SIR|, |\u03C1_FastICA|, max(|\u03C1|)); 1000-rep permutation null\
    \ for chance-level baseline; verdict R-A1A'/R-B1A'/R-C1A' per max(|\u03C1_SIR|, |\u03C1_FastICA|); emit result. STOP."
thread:
  independence_clause: "Q1A' is a NON-GATING sibling of Q1A under P1.R-A. The Q1A' arbiter renders its verdict against R-A1A'/R-B1A'/R-C1A'\
    \ INDEPENDENTLY of Q1A's \u03C7\xB2-based verdict (R-A1A/R-B1A/R-C1A). Per thread.branching_rules.Q1A' = {R-A1A': null,\
    \ R-B1A': null, R-C1A': null}, no Q1A' outcome advances or closes the thread state machine \u2014 Q1A's verdict is the\
    \ thread-state-advancing reading. Q1A and Q1A' run in parallel; they share the SAME u_PIT residual series (Q1's M1 PIT)\
    \ as input but apply different reading methods (Q1A: stratified M3 re-fit with Z = hour_of_week-derived plus \u03C7\xB2\
    \ recompute; Q1A': linear-SDR and non-Gaussianity-maximizing-ICA on residuals with hour_of_week EXCLUDED from X). The\
    \ Q1A' verdict provides a consistency-check reading on whether P1's hand-specified hour_of_week axis is recoverable by\
    \ data-driven methods, validating (or not) the approach for future Z-discovery in less-obvious candidate-set contexts.\
    \ A divergence between Q1A and Q1A' (e.g., Q1A R-A1A but Q1A' R-C1A') is itself substantively informative and is captured\
    \ in the arbiter's cross-experiment note."
  node_id: Q1A'
  parent_branch: R-A
  thread_body_sha256: 21a8bb20b6e9e19c8536fa664dc8978749c19c0d1c21dee3f239c59781d3f6d6
  thread_topic: resolution-paths-thread
  threshold_derivations: "Numeric thresholds (R-A1A': max_rho \u2265 0.5; R-B1A': max_rho in [0.3, 0.5); R-C1A': max_rho <\
    \ 0.3) are inherited VERBATIM from the thread skeleton's Q1A'.phase_a_skeleton.outcome_categories (post-amendment A1,\
    \ thread body_sha256 21a8bb20b6e9e19c8536fa664dc8978749c19c0d1c21dee3f239c59781d3f6d6). They are NOT derived from prior-node\
    \ data \u2014 they are pre-locked at thread-amendment time. Conventional rationale: in social-science effect-size literature\
    \ (Cohen 1988 and successors), |\u03C1| \u2265 0.5 is 'strong', |\u03C1| in [0.3, 0.5) is 'medium', |\u03C1| < 0.3 is\
    \ 'weak-to-negligible'. The thread amendment chose these conventional cuts rather than gate-derived (data-dependent) cuts\
    \ because Q1A's metric (|Spearman \u03C1|) is not on the \u03C7\xB2 scale of Q1A/Q2A/Q2B and has no Q1A'-internal gate\
    \ (the synthetic recovery gate validates implementation, not threshold calibration).\n\nThe cyclic-\u03C1 rule (max(|\u03C1\
    _top_vs_sin|, |\u03C1_top_vs_cos|)) is the phase_a author's pre-locked specification of the thread skeleton's informal\
    \ phrase '|Spearman \u03C1| between the top component's loadings and the cyclic hour_of_week phase.' The thread skeleton's\
    \ skeleton_thresholds_depend_on.hour_of_week_cyclic_phase rule explicitly designates this construction as the phase_a\
    \ author's call. The max-of-both rule respects Spearman literally while accommodating the circularity of hour_of_week\
    \ (a single Spearman against either sin OR cos alone has known non-monotonicity issues \u2014 see metric.CYCLIC-\u03C1\
    \ RULE for the rationale).\n\nSIR PRODUCTION HELPER: SIR is not currently in the .venv (no `dimred`, no `sliced` package).\
    \ A new production helper `sliced_inverse_regression_fit(X, Y, n_slices=10)` will be added to `processing/innovations/estimator.py`\
    \ as a one-time pre-data build step, mirroring the `patra_sen_fit` pattern. The helper is whitelisted in `experiment/audit/code_path.py`\
    \ PRODUCTION_SYMBOLS as `processing.innovations.estimator.sliced_inverse_regression_fit`. The helper's recovery gate is\
    \ `baselines.secondary` (synthetic with known cyclic structure must yield max(|\u03C1|) \u2265 0.70). This build step\
    \ is PRE-REGISTERED here (not a deviation): it is part of the experiment infrastructure required to execute Q1A' via production\
    \ paths. Without it, the SIR fit would be inline in the experiment script and trigger /audit code-path REIMPLEMENTED.\
    \ FastICA is whitelisted as `sklearn.decomposition.FastICA` (already in .venv, sklearn 1.7.0)."
