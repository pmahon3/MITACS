ci_method:
  details: '1000 paired-day bootstrap resamples of post-cutoff days (pair = (delivery_day, day_type) preserving within-day
    correlation; same scheme as Q1, Q2A, P1, Q1A). Per resample: re-fit SIR and FastICA on the resampled rows for the head-to-head
    comparison (both methods see the SAME paired-day resample for paired comparison); recompute top-component-vs-cyclic-hour_of_week
    |ρ| per the cyclic-ρ rule (see metric). Report 95% percentile CIs on |ρ_SIR|, |ρ_FastICA|, max(|ρ_SIR|, |ρ_FastICA|),
    and the difference (|ρ_SIR| - |ρ_FastICA|).'
  type: paired_day_bootstrap
  width: 95 percent percentile interval
corroboration_criterion:
  numeric: 'R-A1A'' fires AT LANDSLIDE STRENGTH: max(|ρ_SIR|, |ρ_FastICA|) point estimate ≥ 0.5 AND the lower bootstrap 95%
    CI bound also ≥ 0.5 (analogous to P1 R-A landslide reading where point 0.575 and lower CI 0.448 both cleared 0.20).'
  reasoning: 'A single point estimate ≥ 0.5 with a CI straddling the cut is mechanical R-A1A'' but substantively borderline
    (one of the methods accidentally crosses the cut on a favorable resample). Requiring the lower CI bound also clearing
    0.5 is the landslide reading: at least one data-driven method robustly recovers a direction aligned with hour_of_week,
    with no pre-specification. The substantive reading ''SDR/ICA validates P1''s hand-specified-axis approach as a method''
    requires landslide; if only the point clears (CI straddles), the arbiter records mechanical R-A1A'' with the ''landslide-not-met''
    qualifier and the substantive picture is ''consistent with recovery, not robust.'''
data:
  cutoff_handling: No leakage. The post-cutoff Y = u_PIT residuals are Q1's already-emitted pickled PIT values (pit_M1); these
    are the same residuals P1 ran on (per the F_b=Uniform methodology amendment + Theorem 1 monotone-invariance). X is constructed
    entirely from the time index (delivery_day, h) and from raw demand at lag-1 and lag-24 (which are pre-cutoff for all post-cutoff
    target rows by construction of the lag). No fitting is performed on data; the SIR and FastICA fits operate ONLY on the
    post-cutoff (X, Y) pairs (this is a diagnostic of κ̂_Q's residuals, not a re-fit of κ̂_Q itself). The pre-cutoff library
    is NOT used (Q1's M1 was already fit on pre-cutoff and its PIT residuals computed once for post-cutoff; that artifact
    is the input). hour_of_week is derived from the time index but is EXPLICITLY EXCLUDED from X — the discriminating test
    is whether SIR/FastICA recover it WITHOUT being given it.
  partition:
    dev: not used
    test: post-cutoff 2025-01-01 .. 2026-05-16 (same population as Q1, Q2A, Q2B, P1, Q1A)
    train: not used (Q1's already-emitted M1 PIT residuals are the diagnostic input; no re-fit of κ̂_Q here)
  source: 'Ontario IESO demand (cfg.paths.historical_csvs) routed through Q1''s already-emitted PIT residuals. Specifically:
    (a) Y = u_PIT from Q1''s M1 predictor (Student-t kernel), the SAME 12000-row post-cutoff residual series P1 was run on;
    (b) X = an n_rows × d_X matrix constructed inline from the post-cutoff time index and raw demand lags, see metric for
    the column list. P1''s pickle is loaded only for cross-checking that the (delivery_day, h) -> hour_of_week derivation
    matches P1''s bin labels; not an input to the SIR/FastICA fits.'
date: '2026-05-27'
falsification_criterion:
  numeric: 'R-C1A'' fires: max(|ρ_SIR|, |ρ_FastICA|) < 0.3.'
  reasoning: 'R-C1A'' is the falsification of ''data-driven methods recover P1''s hand-specified axis'': neither SIR nor FastICA
    finds a top component aligned with the weekly-cyclic hour_of_week phase above the conventional ''medium'' effect-size
    floor. Two non-exclusive interpretations: (a) P1''s hand-specified hour_of_week axis is an artifact of the marginal PIT
    pathology rather than a genuine non-Gaussian latent component (P1 finds the discrete bin granularity, but the underlying
    continuous structure is not picked up by linear SDR or non-Gaussianity-maximizing ICA); (b) hour_of_week''s effect on
    residuals is below SDR/ICA''s sensitivity floor on this sample size (n=12000). The arbiter cannot mechanically distinguish
    (a) from (b); both are substantive readings consistent with R-C1A''. Per branching_rules.Q1A''.R-C1A'' = null, this verdict
    does NOT advance or close the thread state machine — Q1A''s χ²-based verdict (R-A1A / R-B1A / R-C1A) is the thread-state-advancing
    reading.'
