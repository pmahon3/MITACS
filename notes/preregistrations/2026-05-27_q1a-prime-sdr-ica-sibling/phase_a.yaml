ambiguous_region:
  action: 'R-B1A'' fires: max(|ρ_SIR|, |ρ_FastICA|) lies in [0.3, 0.5). Partial recovery — at least one of the two data-driven
    methods senses a social-weekly direction in the κ̂_Q PIT residuals but does not dominantly identify it. Per branching_rules.Q1A''.R-B1A''
    = null in the thread, the verdict is INDEPENDENT and NON-GATING — no thread state transition is triggered. The arbiter
    records the head-to-head sub-finding (which of SIR / FastICA scored higher, with paired-bootstrap CI on the difference)
    and the independent-substantive reading ''data-driven methods sense but do not confirm P1''s hand-specified hour_of_week
    axis as the dominant direction.'''
  range: max(|ρ_SIR|, |ρ_FastICA|) in [0.3, 0.5) (R-B1A', per thread skeleton)
baselines:
  primary: 'Permutation-null distribution of max(|ρ_SIR|, |ρ_FastICA|) under H0 of no relationship between X and Y. Specifically:
    shuffle the post-cutoff Y = u_PIT vector independently of X (preserving the day-paired bootstrap row structure to maintain
    within-day temporal coupling on X but breaking the cross-row Y-X linkage); re-fit SIR and FastICA on each of 1000 permutations;
    record the empirical 95% upper bound on max(|ρ_SIR|, |ρ_FastICA|) under the null. This is the chance-level baseline: if
    the realized max(|ρ|) lies BELOW the permutation-null 95% upper bound, no recovery has occurred regardless of which R-*
    category fires mechanically. The permutation null is INFORMATIONAL (it does not override the pre-locked 0.3 / 0.5 cuts
    from the thread skeleton); it is reported as a calibration anchor on top of the mechanical verdict.'
  secondary: 'METHOD/DESIGN synthetic recovery gate (required by the workflow''s discipline rule — any diagnostic that reimplements
    production logic is a hypothesis, not a finding, until confirmed through the production code path). Construction: (i)
    synthesize a 12000-row X with the same column structure as Ontario''s post-cutoff X (see metric section for the explicit
    column list); (ii) construct synthetic Y = α·sin(2π·hour_of_week/168) + β·cos(2π·hour_of_week/168) + ε with α = β = 1.0
    and ε ~ N(0, σ²) calibrated so the signal-to-noise ratio matches the order-of-magnitude estimate from P1''s hot-zone α̂_L
    ≈ 0.6 (target: SNR ≈ 1.5). hour_of_week is RECOVERABLE in the synthetic by construction but is NOT a column of X; (iii)
    run the production paths (sliced_inverse_regression_fit, sklearn.decomposition.FastICA) on synthetic (X, Y); compute max(|ρ|)
    per the metric''s cyclic-ρ rule. Recovery gate threshold: max(|ρ_SIR_synth|, |ρ_FastICA_synth|) ≥ 0.70 (well above the
    0.5 R-A1A'' cut and at the lower-bound of the phase-ceiling under Spearman). Companion null check: re-run with permuted
    synthetic Y (no signal); confirm max(|ρ_synth_null|) < 0.30. BOTH checks must PASS before the Ontario diagnostic runs.
    The gate validates that the production paths can recover a known cyclic structure when one exists; if it cannot, any null
    result on Ontario data is consistent with implementation defect rather than a true substantive null. ~20-30 sec wall-clock;
    runs every invocation as in-script self-test.'
