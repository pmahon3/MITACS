strongest_argument: "The discriminating-test framing of Q1A' rests on a single load-bearing\npremise \u2014 that the alpha_L\
  \ localization signal P1 detected in\nstratum-mixture-fraction space will reappear as the TOP direction in\nlinear-projection-of-Y-onto-X\
  \ space (SIR) and as the TOP non-Gaussian source\nin independent-component space (FastICA). This premise is empirically\n\
  uncorroborated.\n\nThree concrete reasons it is likely to fail at the TOP-component level:\n\n(1) hour_of_week is a 168-period\
  \ circular variable; its sin/cos\nrepresentation has TWO degrees of freedom and the natural SIR projection of\n(day_type_saturday,\
  \ day_type_sunday, time_of_day_sin, time_of_day_cos,\nlag-1, lag-24) onto Y will distribute the cyclic alignment across\
  \ at least\ntwo SIR directions, so the rho_top-vs-cyc_sin OR rho_top-vs-cyc_cos\nstatistic (the cyclic-rho rule's max-of-two)\
  \ on the FIRST direction captures\nat most ~half of the recoverable cyclic alignment \u2014 a top-direction max_rho\naround\
  \ 0.35-0.45 is the structural ceiling under the SIR top-direction-only\nverdict rule.\n\n(2) FastICA whitens before applying\
  \ the logcosh non-Gaussianity contrast.\nWhitening removes second-moment structure where Q2B's under-dispersion\nsignature\
  \ lives (s^2_iter < s^2_emp at virtually every (h, day_type) cell,\nper mitacs-q2b-non-distributional). The kappa_1 PIT\
  \ residual marginal is\nstrongly heavy-tailed (excess kurtosis 24-33 per mitacs-rebaseline-facts;\nnu ~ 4.2-4.6 per Q1 S8),\
  \ so FastICA's top-by-kurtosis component will load\nprimarily on the heavy-tailed marginal residual rather than on the\n\
  social-weekly phase \u2014 expected rho_FastICA around 0.25-0.35.\n\n(3) The disintegration-diagnostic note flags that Patra-Sen\
  \ targets\nalpha* = sup{alpha : F minus alpha*F_0 is a valid sub-CDF} and the empirical\nalpha_L is a LOWER BOUND, not an\
  \ estimate of true alpha_0; the \"range 0.575\"\nin P1 may reflect the floor of identifiability rather than the actual signal\n\
  strength, so the same underlying signal need not produce |rho| >= 0.5 in\nlinear-projection or ICA space.\n\nThe most likely\
  \ outcome is R-B1A' with SIR winning narrowly on the\nhead-to-head (SIR's slicing of Y captures the (day_type, time_of_day)\n\
  linear-combination version of P1's axis more directly than FastICA's\npre-whitened non-Gaussianity contrast can isolate\
  \ the cyclic phase as an\nindependent component).\n"
