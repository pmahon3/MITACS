  mode: 'SIR top-direction split across cyclic-phase basis. hour_of_week''s sin/cos

    representation has 2 degrees of freedom (cyc_sin, cyc_cos at 2*pi/168) but

    X has no direct cyclic-phase column; SIR''s linear projection of X onto Y

    can capture the social-weekly alignment only by combining

    day_type_saturday, day_type_sunday, time_of_day_sin, time_of_day_cos,

    lag-1, lag-24 into a sum that approximates the cyclic phase. This sum

    will be split across at least 2 SIR directions (one for

    weekday-vs-weekend gradient, one for time-of-day-within-day shape), so

    the TOP direction''s rho-vs-cyc_sin OR rho-vs-cyc_cos statistic captures

    at most ~50-60% of the recoverable cyclic alignment. rho_SIR

    top-direction-only lands around 0.40, not 0.60+.

    '
  rank: 1
- memory_cite: memory/mitacs-q2b-non-distributional.md + memory/mitacs-rebaseline-facts.md
  mode: "FastICA whitening destroys the second-moment structure carrying the\nsocial-weekly signal. Q2B (S10) established\
    \ that the ensemble\nUNDER-disperses at virtually every (h, day_type) cell \u2014 i.e., the\nconditional law has more\
    \ variance than the predicted distribution\nprovides, and that variance modulation by stratum is one signature of\nthe\
    \ missing exogenous content. FastICA's\nsklearn.decomposition.FastICA(whiten='unit-variance') pre-whitens X\nbefore applying\
    \ logcosh; the variance-modulation-by-hour_of_week signal\nis largely a second-moment phenomenon that is removed at pre-whitening\n\
    time. The top-by-|excess_kurtosis| component then loads on the\nheavy-tailed kappa_1 PIT marginal (excess kurtosis 24-33\
    \ per\nrebaseline-facts) \u2014 NOT on the cyclic phase. rho_FastICA lands around\n0.25-0.35.\n"
  rank: 2
- memory_cite: ~/Research/Mathematics/Resolvent_Framework/notes/unsorted/disintegration_diagnostic.md section (a) + memory/mitacs-p1-patra-sen-localization.md
  mode: "alpha_L is a lower bound on a tail-mass fraction, NOT a linear-projection\nor independent-component signal strength.\
