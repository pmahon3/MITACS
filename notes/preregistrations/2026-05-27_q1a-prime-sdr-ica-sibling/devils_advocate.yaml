outcome: R-B1A'
rationale_summary: "P1's social-weekly signal lives in alpha_L space (a stratum-mixture-fraction\nlower bound), a DIFFERENT\
  \ functional of the residual law from the linear-projection\n(SIR) and non-Gaussianity-maximizing (FastICA) functionals\
  \ tested here. The\ncovariate matrix X is dominated by within-day signals (time_of_day_sin/cos,\nlag-1, lag-24) while the\
  \ cyclic hour_of_week target is a 168-period weekly\nfundamental largely captured by the cross-product of (day_type, time_of_day)\n\
  \u2014 SIR's top direction will mix these into a linear combination but the cyclic\nalignment will be split across at least\
  \ two directions, putting the\nTOP-component-only rho_SIR around 0.40; FastICA's pre-whitening removes\nsecond-moment structure\
  \ (variance modulation by stratum, the Q2B\nunder-dispersion signature) where much of the social-weekly signal lives,\n\
  so its top-by-kurtosis component will load primarily on the heavy-tailed\nmarginal residual rather than on the cyclic phase,\
  \ putting rho_FastICA around\n0.30. Net: both methods sense social-weekly structure but the TOP-component-only\nverdict\
  \ statistic lands in R-B1A's [0.3, 0.5) band; substantive picture is that\nP1's discretized-axis approach finds signal that\
  \ linear/non-Gaussianity-maximizing\ndata-driven tools cannot cleanly recover as a SINGLE top component, which is a\nmethodologically\
  \ important null for the \"validates P1's axis via independent\nmethods\" reading.\n"
