purpose: 'Verify that the P1 result artifact (experiment/results/p1_patra_sen.txt; CLAIM-GRADE provenance envelope; .txt suffix per make_result convention) reports what phase_a registered for P1 (patra-sen-per-stratum-localization). BLOCKING precondition (fidelity_coverage_passed) for the arbiter. Same Check R schema established for Q2A/Q2B.

  '
artifact_format_note: 'The result artifact lives at experiment/results/p1_patra_sen.txt rather than result.yaml inside the entry directory. Reason: P1 used the provenance.make_result() emitter (same as C1/C2/C3/C4/C5 CLAIM-GRADE artifacts) which writes a provenance-wrapped text document with a JSON header carrying the inputs dict, then a human-readable body. The header''s "inputs" dict is the structured numeric content of the registered dependent variables; the body is the human-readable rendering. Both are surfaces this Check R can inspect for coverage. phase_a does not pin the artifact suffix; the .txt is consistent with the CLAIM-GRADE convention.

  '
primary_metric_match:
  verdict: PASS
  detail: 'phase_a.metric (verdict-metric definition): for each of 5 stratification axes, range_axis = max(alpha_L_point) - min(alpha_L_point) across that axis''s strata; the verdict metric is max_axis(range_axis); verdict outcome R-A/B/C determined against thresholds 0.20 / 0.10.

    Result inputs.max_axis_range = 0.575 and body line "verdict statistic: max_axis range = 0.5750  (binding axis: stratum_hour_of_week)" report this metric directly. The five per-axis ranges in inputs.per_axis_range_point are the inputs to the max; ranges 0.0750, 0.4850, 0.1350, 0.3450, 0.5750 confirm max selection over the registered 5-axis set.

    '
dependent_variables_coverage:
  registered_count: 7
  located_count: 7
  per_variable:
    alpha_L_per_stratum_per_axis:
      verdict: PASS
      location: 'inputs.per_axis_point (dict, 5 axes -> stratum -> alpha_L_point); body section "per-axis range and per-stratum alpha_L" prints all 21 per-stratum point estimates. Stratum counts match phase_a: demand_quantile=3, time_of_day=4, season=3, day_type=3, hour_of_week=8 (total 21).

        '
    range_alpha_L_per_axis:
      verdict: PASS
      location: 'inputs.per_axis_range_point (dict, 5 axes -> range scalar): demand_quantile=0.0750, time_of_day=0.4850, season=0.1350, day_type=0.3450, hour_of_week=0.5750. Body section prints "range = ..." per axis.

        '
    ci95_alpha_L_per_stratum:
      verdict: PASS
      location: 'inputs.per_stratum_ci (nested dict, 5 axes -> stratum -> [lo, hi]); all 21 strata have percentile CIs from 1000-resample paired-day bootstrap.

        '
    ci95_range_alpha_L_per_axis:
      verdict: PASS
      location: 'inputs.per_axis_range_ci (dict, 5 axes -> [lo, hi]): demand_quantile=[0.0225, 0.1726], time_of_day=[0.3850, 0.5775], season=[0.0550, 0.2400], day_type=[0.2500, 0.4301], hour_of_week=[0.4475, 0.6475]. Body section prints "range = ... [lo, hi]" per axis.

        '
    alpha_L_marginal:
      verdict: PASS
      location: 'inputs.alpha_L_marginal = 0.4125 (scalar). Body section "marginal alpha_L (full pool, INSPECTION-ONLY per phase_a baselines):" reports the same value. Per phase_a baselines.primary this is INSPECTION-ONLY context, not part of the verdict.

        '
    binding_axis:
      verdict: PASS
      location: 'inputs.binding_axis = "stratum_hour_of_week"; body line "binding axis: stratum_hour_of_week" and the inline marker "<- binding" on the hour_of_week block confirm. Matches argmax_axis range_axis (0.5750 over the other four ranges 0.4850, 0.3450, 0.1350, 0.0750).

        '
    binding_axis_strata_ranking:
      verdict: PASS
      location: 'Recoverable from inputs.per_axis_point["stratum_hour_of_week"] sorted by alpha_L value, and EXPLICITLY printed in the body section in descending order: hour-of-week strata 6 (alpha_L=0.6100), 5 (0.5475), 7 (0.5450), 2 (0.2700), 4 (0.2075), 3 (0.1775), 1 (0.1250), 0 (0.0350). Phase_a''s metric note "Per-axis full strata ranking table for use by Q1A''s Z construction" is satisfied: the binding-axis ranking is unambiguously read off the result, and per-axis full rankings for the other four axes are recoverable from per_axis_point (each axis''s strata are sortable by alpha_L_point).

        '
ci_method_match:
  verdict: PASS
  detail: 'phase_a.ci_method: type = paired_day_bootstrap, details = "1000 paired-day bootstraps of post-cutoff days. Per resample: recompute alpha_L per stratum per axis, recompute range_axis. Report 95% percentile CI on each alpha_L and each range." Width = 95 percent percentile interval.

    Result inputs.n_bootstrap = 1000; reproducibility.seeds carries paired_day_bootstrap = 20260527; body header line "bootstrap: n_bootstrap = 1000"; per-stratum CIs and per-axis-range CIs are present as percentile intervals. The "95% percentile" width is implicit in the CI numerics (per_stratum_ci values consistent with percentile bounds, not parametric). MATCH.

    '
independent_variable_stratifications:
  per_variable:
    stratification_axis:
      verdict: PASS
      detail: 'Phase_a declares 5 axes (demand_quantile, time_of_day, season, day_type, hour_of_week). All 5 appear as top-level keys in inputs.per_axis_point, inputs.per_axis_range_point, inputs.per_axis_range_ci, and inputs.per_stratum_ci. Body section prints all 5 axes verbatim.

        '
    stratum:
      verdict: PASS
      detail: 'Phase_a declares per-axis strata: demand_quantile=3 (low/medium/ high), time_of_day=4 (overnight/morning_ramp/afternoon/evening), season=3 (winter/summer/shoulder), day_type=3 (weekday/saturday/ sunday), hour_of_week=8 (168/21=8 bins).

