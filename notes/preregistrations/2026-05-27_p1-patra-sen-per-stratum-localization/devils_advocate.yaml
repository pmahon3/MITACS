opportunity_cost:
  alternative: 'A direct one-shot test of season-as-temperature-proxy: compute the Pearson correlation
    between season (3-level ordinal) and historical Toronto Pearson hourly temperature (free ECCC archive)
    over the post-cutoff window. If the correlation is high (|rho| > 0.7), season is a decent proxy and
    the proponent''s prior translation is defensible. If low (|rho| < 0.3), season is a poor proxy and
    Q1C''s temperature direct test is the only viable detection branch. Pre-registering P1 without this
    number means the proponent''s binding_axis = season forecast is speculative on a quantity easily measured.'
  notes: The pre-registration is well-formed AS WRITTEN. The opportunity cost is a one-shot empirical
