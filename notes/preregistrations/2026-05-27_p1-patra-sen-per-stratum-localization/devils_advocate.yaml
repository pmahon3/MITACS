strongest_argument: 'The proponent''s central claim - that season acts as a temperature proxy with range
  ~0.30 alpha_L variation - rests on a chain of assumptions that the qualifier-exhaustion-memo''s most-cited
  empirical finding directly contradicts. The memo''s reported result is that alpha_L is ORTHOGONAL to
  z-state across the delay-embedding coordinates of the marginal kappa_1 residual. Z-state is a NATURAL
  CONDITIONING AXIS - it is exactly the kind of derived-from-existing-data stratification P1 is testing.
  The natural extension of that orthogonality finding is that alpha_L is orthogonal to ALL natural conditioning
  axes constructible from existing data (time index + actuals), because all such axes are themselves derived
  from the same underlying time series. The proponent''s claim that season acts as a temperature proxy
  assumes that season carries information NOT already in the z-state (or the residual conditioning that
  produces it); but the season variable is a deterministic function of the time index, and the time index
  is already encoded in the z-state via the month-of-year and hour-of-day standardization. Season is therefore
  not a real independent axis - it is a re-encoding of information M1 has already conditioned on (the
  per-(month, hour) climatology mu_{m,h}, sigma_{m,h}).


  Second, the proponent''s hour_of_week ~0.25 forecast is similarly vulnerable: hour-of-week = day-of-week
  x hour-of-day; day-of-week is already partitioned by day_type (weekday / saturday / sunday); hour-of-day
  is already partitioned by time_of_day. The 8-bin hour-of-week collapse re-aggregates information that
  the other natural axes already encode, just on a different grid. Q2A''s saturday 4x weekday pattern
  survived FAMILY-INVARIANT - it is structural, not distributional - so it is structural at the level
  of the conditioning, not at the level of mixture-fraction asymmetry. P1''s alpha_L on hour-of-week strata
  is consequently expected to be small.


  Third, the most-cited candidate Z (temperature) is NOT in any natural axis. Temperature varies within
  a season; temperature varies within a day; temperature varies within an hour. None of P1''s 5 axes carries
  temperature as a separable signal. If the missing Z is temperature, it is orthogonal to ALL 5 natural
  axes by construction, and Q1C is the only branch that can detect it.


  Net: R-C fires with all five axis ranges < 0.10 (point ~0.05 each), max_range ~ 0.07. alpha_L_marginal
  lands at the upper end of the qualifier-exhaustion prior (~0.65) because the marginal mass is high but
  spatially uniform across natural axes.'
what_would_change_my_mind:
- If max_range > 0.25 with binding_axis = season AND CI lower bound > 0.20, season carries a temperature-proxy
  signal that is large enough to survive the noise floor with margin. The proponent's MW-space-to-z-space
  translation of clim-gap-nonstationary holds and my qualifier-exhaustion-memo extension is empirically
  refuted.
- If R-A fires for hour_of_week OR demand_quantile with binding range > 0.25 (not season), the temperature-proxy
  reading is wrong on the proxy choice but R-A as a class is correct - some natural axis does carry localizing
  information. My pure-orthogonality position is refuted.
- If alpha_L_marginal lands at the low end of the qualifier-exhaustion prior (< 0.50) AND R-C still fires,
  the marginal pathology is less severe than the memo prior suggests; the structured-noise vs noisy-structure
  tie may be soluble within the natural-axis candidate set after all, contradicting my position that exogenous
  Z is required.
