verdict: PROPONENT-CONFIRMED
verdict_reasoning: 'Mechanical verdict per phase_a.shape_outcomes: R-A fires unambiguously (max_axis_range = 0.5750, CI [0.4475, 0.6475]; both point and lower CI bound clear the R-A cut at 0.20 by more than 2x). proponent forecast R-A; DA forecast R-C. R-A wins on the registered outcome category. Per arbiter.md taxonomy, this is PROPONENT-CONFIRMED.


  Substantive findings (the verdict is PROPONENT-CONFIRMED + the below; the within-bucket detail is what makes outcome_substantive = R-A_unforecast):


  1. R-A FIRES AT LANDSLIDE STRENGTH, NOT MARGINAL R-A. Three of five per-axis range CIs (hour_of_week, time_of_day, day_type) are entirely above 0.20 at their LOWER CI bound; the max_axis lower CI bound (0.4475) is more than 2x the R-A cut. DA''s R-C is decisively falsified on 4 of 5 per-axis CIs (only demand_quantile''s CI [0.023, 0.173] overlaps the R-C threshold at 0.10). The verdict is not borderline.


  2. BINDING AXIS IS HOUR_OF_WEEK, NOT SEASON. Proponent''s binding-axis forecast was season at range 0.30. Realized: season range 0.1350 with CI [0.055, 0.240], 4th-of-5 by range. hour_of_week binds at range 0.575. The temperature-via-season prior translation is empirically rejected at the 95% CI level (season range CI upper bound 0.240 vs the R-A cut at 0.20 - season barely clears R-A; nothing like the 0.30 proponent predicted). The signal is CYCLICAL (hour_of_week, time_of_day, day_type all fire), not seasonal. This is the substantive downward update on the temperature hypothesis from clim-gap-nonstationary: in the post-cutoff window, the natural axis carrying the missing Z signal is weekly/social structure, not month-of-year climatology.


  3. HOUR_OF_WEEK HOT ZONE = WEEKEND BLOCK. Strata 5/6/7 (bins of 21 hours each, by weekday*24 + (h-1)) carry alpha_L 0.5475/0.6100/0.5450 respectively, spanning Fri 10:00 through Sun 23:00. The coldest bin (0) is Mon 01:00 - Mon 21:00 at alpha_L = 0.035 (essentially Gaussian). Independent corroboration of the saturday-4x-weekday chi^2 signal from Q2A Finding #2 (S9) and the weekday/weekend structural asymmetry from eigenmodes-v1 (S2/S3). The day_type axis at the coarser temporal granularity shows the same ordering: saturday 0.6475 > sunday 0.485 > weekday 0.3025. The hour_of_week axis is essentially day_type plus within-week phase resolution; the phase resolution is where the additional range comes from (weekday 0.303 vs Mon-AM bin 0.035 - within-week heterogeneity is real signal).


  4. TIME_OF_DAY OVERNIGHT-VS-REST CONTRAST IS A CLEAN SECOND STRUCTURAL SIGNAL. afternoon/morning_ramp/evening cluster at alpha_L = 0.4750-0.5975; overnight at 0.1125 (within-day lightest-tail strata mirror the within-week lightest-tail bins). This is independent corroboration that the signal is structural-cyclical at multiple temporal granularities, not a single-axis artifact.


  5. ALPHA_L_MARGINAL = 0.4125 BELOW BOTH PRIORS. INSPECTION-ONLY per phase_a, not verdict-bearing. Interesting fact: both forecasters anchored to qualifier-exhaustion-memo''s 0.49-0.74 prior and both overshot. The marginal alpha_L is meaningfully lower than either anticipated, even as the per-stratum signal is much higher than either anticipated (max per-stratum alpha_L is 0.6475 on saturday, 0.61 on hour_of_week bin 6 - well above marginal 0.4125). Stratification reveals contamination concentrated where the marginal averages it down: the marginal is a misleading single number for what is a strongly heterogeneous non-Gaussian mass.


  6. day_type RANGE 0.345 TRIGGERS PROPONENT''S WHAT_WOULD_CHANGE_MY_MIND CONDITION #4. Proponent registered: ''If day_type range > 0.15, M1''s per-day-type conditioning has not absorbed the day-type asymmetry in non-Gaussian mass. This would be a Q1/Q2A pipeline issue, not a P1 finding; arbiter should flag it.'' Realized day_type range = 0.345 comfortably above 0.15. Arbiter flag (NON-BLOCKING per proponent''s own framing): Q1''s M1 conditioning is per-day-type on nu (the Student-t shape) and on the per-(month, hour) climatology, but the mixture-fraction asymmetry across day-types is not absorbed. This is consistent with eigenmodes-v1 (S2/S3) showing weekday/weekend structural asymmetry at the operator level - the asymmetry is structural, not just shape-of-tails. The flag does not retract Q1/Q2A''s settled findings; it documents that day-type conditioning on Student-t shape alone does not exhaust day-type heterogeneity in the residual law. The natural follow-up is Q1A''s Z construction
  on hour_of_week (the strongest axis), which subsumes day_type at finer resolution.


  7. ROUTING: per phase_a.shape_outcomes.R-A.interpretation, R-A routes to Q1A with the binding axis becoming Q1A''s conditioning variable. Realized binding axis is hour_of_week, not season as proponent expected. Q1A''s Z should be derived from hour_of_week stratification (not from temperature-as-season-proxy, the prior the thread skeleton may have implicitly anticipated). The thread coordinator follows up; this arbiter writes thread_state_update.next_node_id = Q1A and notes_for_thread_coordinator pins hour_of_week as the Z axis.'
