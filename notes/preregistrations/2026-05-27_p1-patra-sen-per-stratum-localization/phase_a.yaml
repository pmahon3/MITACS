ci_method:
  details: '1000 paired-day bootstraps of post-cutoff days. Per resample: recompute alpha_L per stratum
    per axis, recompute range_axis. Report 95% percentile CI on each alpha_L and each range.'
  type: paired_day_bootstrap
  width: 95 percent percentile interval
corroboration_criterion:
  numeric: R-A fires (max range > 0.20)
  reasoning: 'R-A localizes where the missing Z is concentrated. The binding axis becomes Q1A''s conditioning
    variable. Most likely binding axes per priors: season (temperature proxy without temperature data)
    or hour-of-week (Q2A Finding #2 saturday 4x weekday is consistent with hour-of-week structure).'
data:
  cutoff_handling: Standard; P1 uses Q1's already-standardized residuals (residuals divided by M1's per-anchor
    Student-t scale parameter). Stratification axes are computed from the existing time index + actuals
    (no exogenous data, no leakage).
  partition:
    dev: not used
    test: post-cutoff 2025-01-01 .. 2026-05-16 (same population as Q1/Q2A/Q2B)
    train: pre-cutoff library was used by Q1 to fit M1; P1 does NOT refit. P1 operates on Q1's already-fit
      residuals.
  source: 'Q1''s M1 (Student-t kernel) residuals on post-cutoff Ontario data. Loaded from scratch/data/distributional_class_q1/q1.pkl
    (per Q1''s run); falls back to refit via the production fitter if the pickle is insufficient. Same
    post-cutoff population as Q1/Q2A/Q2B: all delivery days from 2025-01-01 through 2026-05-16.'
falsification_criterion:
  numeric: R-C fires (max range < 0.10 across all 5 axes)
  reasoning: R-C is the substantive falsification of the noisy-structure hypothesis under the natural
    stratifications we have. If none of demand / time / season / day-type / hour-of-week shows systematic
    alpha_L variation, the missing content is orthogonal to all these natural axes - either intrinsic
    structured noise OR Z that requires data we don't have (temperature, weather, grid events). This makes
    the next step less informed and increases P2's relevance.
