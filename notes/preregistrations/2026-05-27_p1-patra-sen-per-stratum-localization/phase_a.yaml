hypothesis:
  counter: 'See devils_advocate.yaml. R-C: alpha_L is approximately constant (range < 0.10) across ALL
    five natural axes. The missing Z is exogenous and orthogonal to time/calendar/demand stratifications;
    only temperature (Q1C) can detect it because no natural axis in P1''s candidate set carries the temperature
    signal cleanly. The qualifier-exhaustion-memo''s z-state-orthogonality finding generalizes to all
    natural conditioning.'
  proponent: R-A fires with the season axis binding at range ~0.30 (max over the five axes), driven by
    temperature being the most plausible missing Z per mitacs-clim-gap-nonstationary and mitacs-postcovid-probe.
    Season acts as a temperature proxy in the absence of exogenous data and concentrates the heavy-tailed
    contamination at winter/summer extremes vs shoulder months. alpha_L_marginal lands in the qualifier-exhaustion-memo's
    0.49-0.74 prior (point ~0.60); binding axis identifies the conditioning variable Q1A uses to construct
    its Z.
metric: "PRIMARY: for each of 5 stratification axes, compute per-stratum alpha_L (lower 95% Patra-Sen\
  \ 2016 bound on non-Gaussian mixture fraction), then range_axis = max(alpha_L_point) - min(alpha_L_point)\
  \ across that axis's strata. The verdict metric is max_axis(range_axis).\n\nStratification axes (5,\
  \ pre-locked, matching thread skeleton candidate_set):\n  1. demand_quantile: terciles of concurrent\
  \ actual demand (low / medium / high). 3 strata.\n  2. time_of_day: 4 bins of hour-of-day: overnight\
  \ (0-5), morning ramp (6-10), afternoon (11-16), evening (17-23). 4 strata.\n  3. season: 3 bins of\
  \ month: winter (Nov-Mar), summer (Jun-Aug), shoulder (Apr-May, Sep-Oct). 3 strata.\n  4. day_type:\
  \ weekday, saturday, sunday. 3 strata. Included as reference (already used as conditioning in M1's fit,\
  \ so any alpha_L variation across these strata is sanity-baseline, not novel signal).\n  5. hour_of_week:\
  \ 168 hours collapsed to 8 bins of 21 hours each. Captures finer temporal structure than day_type+time_of_day\
  \ separately.\n\nFor each (axis, stratum):\n  - Collect M1's standardized residuals u_i = (z_actual\
  \ - z_iter) / s_iter that fall in that stratum.\n  - Apply plain Patra-Sen (2016) two-component mixture\
  \ estimator: treats empirical CDF F_n as alpha F_+ + (1-alpha) F_0 where F_0 is Gaussian(0,1) and F_+\
  \ is unspecified. Returns alpha_L^{95%} = lower 95% confidence bound on alpha.\n  - Bootstrap: 1000\
  \ paired-day resamples; recompute alpha_L per resample; report 95% CI on alpha_L per stratum.\n\nPer\
  \ axis: range_axis = max(alpha_L_point) - min(alpha_L_point) across strata. CI on range_axis via the\
  \ range statistic recomputed on each bootstrap resample.\n\nVerdict: binding_axis = argmax_axis range_axis.\
  \ Verdict outcome (R-A/B/C) determined by max range value vs thresholds 0.20 / 0.10.\n\nSECONDARY /\
  \ informational:\n  - alpha_L_marginal (unstratified Patra-Sen on full residual pool) as sanity check\
  \ against qualifier-exhaustion-memo prior of 0.49-0.74. Large deviation indicates pipeline mismatch.\n\
  \  - Per-axis full strata ranking table for use by Q1A's Z construction.\n"
