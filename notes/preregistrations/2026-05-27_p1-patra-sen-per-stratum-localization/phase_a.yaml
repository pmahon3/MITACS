ambiguous_region:
  action: Q1A still fires using the marginal-strongest axis; the verdict is informative
    but not decisive. A subsequent thread amendment may be needed if Q1A's R-A1A doesn't
    fire.
  range: R-B fires (max range in (0.10, 0.20])
baselines:
  primary: alpha_L_marginal on the full residual pool (unstratified Patra-Sen on u_PIT
    against F_b = Uniform[0,1]) is reported as INSPECTION-ONLY context for the range
    statistic. Under the corrected method (Patra-Sen 2016 Theorem 1 reparameterization
    to PIT scale + Uniform null) there is no anchored prior value for alpha_L_marginal;
    the qualifier-exhaustion-memo's 0.49-0.74 was stamped under a different null and
    is non-load-bearing here. The verdict depends on range_axis values, not the marginal
    level.
  secondary: 'Synthetic recovery gate (METHOD/DESIGN). Generate synthetic data with
    two known true-alpha settings: (i) alpha_true = 0.0 (pure Gaussian, expect alpha_L
    = 0 within Patra-Sen CI); (ii) alpha_true = 0.50 (50/50 Gaussian + mixture, expect
    alpha_L = 0.45-0.55 within Patra-Sen CI). The existing cells validate the estimator
    under F_b = N(0,1) (standard form). A parallel cell validates the estimator under
    F_b = Uniform[0,1] on PIT-transformed data (the form P1 actually uses), confirming
    the Theorem-1 reparameterization is implemented correctly and the same alpha_0
    is recovered on both nulls. Confirm the production fitter recovers all cells before
    the Ontario diagnostic runs. ~30 sec wall-clock; runs every invocation as in-script
    self-test.'
