  threshold_derivations: "Numeric thresholds (R-A: range > 0.20; R-C: < 0.10) are NOT derived from a synthetic\
    \ gate (unlike Q2A's gate-derived 228/2284). They are set on non-data principled bases:\n  - 0.20:\
    \ substantive variation threshold. alpha_L spanning 20 percentage points across strata of a single\
    \ axis is large enough that the binding stratum carries meaningfully more non-Gaussian mass than the\
    \ lightest stratum; small enough to be detectable at n ~ 1000-3000 per stratum.\n  - 0.10: noise floor.\
    \ Bootstrap CI width on alpha_L at the sample sizes we have is ~0.05-0.10 per stratum (extrapolating\
    \ from Patra-Sen 2016 paper's reported behavior at n ~ 2000); range < 0.10 is within sampling noise.\n\
    The qualifier-exhaustion-memo alpha_L >= 0.49-0.74 marginal range provides the prior for what unstratified\
    \ alpha_L looks like; the stratified variation question is orthogonal."
