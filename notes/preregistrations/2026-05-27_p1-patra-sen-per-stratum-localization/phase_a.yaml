baselines:
  primary: qualifier-exhaustion-memo's alpha_L >= 0.49-0.74 prior for marginal (unstratified) sanity check.
    P1's alpha_L_marginal should land in or near this range; large deviation indicates pipeline mismatch.
  secondary: 'Synthetic recovery gate (METHOD/DESIGN). Generate synthetic data with two known true-alpha
    settings: (i) alpha_true = 0.0 (pure Gaussian, expect alpha_L = 0 within Patra-Sen CI); (ii) alpha_true
    = 0.50 (50/50 Gaussian + mixture, expect alpha_L = 0.45-0.55 within Patra-Sen CI). Confirm the production
    fitter recovers both before the Ontario diagnostic runs. ~30 sec wall-clock; runs every invocation
    as in-script self-test.'
