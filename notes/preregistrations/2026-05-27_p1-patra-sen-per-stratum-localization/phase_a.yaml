research_question: Does the non-Gaussian mixture fraction alpha_L in the kappa_1 predictor's residuals
  vary systematically across natural conditioning strata (demand quantile, time-of-day, season, day-type,
  hour-of-week)? If yes, the variation localizes where the missing Z is concentrated, informing which
  exogenous variable to test in Q1A/B.
schema: phase_a
shape_outcomes:
  R-A:
    criterion: max over 5 axes of range(alpha_L) > 0.20
    interpretation: Z detectable from current data; binding axis identifies where missing Z is concentrated.
      Routes to Q1A (Z-conditioning experiment using the strongest axis).
  R-B:
    criterion: max range in (0.10, 0.20]
    interpretation: Marginal variation; Z hint present but not cleanly localized. Routes to Q1A (use the
      marginal-strongest axis anyway).
  R-C:
    criterion: max range < 0.10 (all 5 axes return approximately constant alpha_L)
    interpretation: Z orthogonal to all 5 natural conditioning axes. Routes to Q1C (temperature fallback,
      the prior-supported Z that may be orthogonal to all our current stratifications).
stopping_criterion:
  reasoning: Pre-registration complete; verdict determined by realized range values.
  rule: Run synthetic recovery gate; load Q1 M1 residuals (or refit if pickle insufficient); stratify
    on 5 axes; apply Patra-Sen per stratum; bootstrap; compute range per axis; evaluate R-A/B/C; emit
    result. STOP. No iteration; no parameter tuning; no cross-axis interaction.
