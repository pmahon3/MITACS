  reasoning: CI on max_range [0.18, 0.45] straddles the R-A / R-B boundary (0.20). Central call R-A but
    the lower tail crosses into R-B. CI on season_range matches max_range (season is forecast to be the
    binding axis). hour_of_week_range CI [0.12, 0.40] also straddles the R-A bar; if hour_of_week binds
    instead of season the verdict is still R-A but with different downstream Z construction. alpha_L_marginal
    CI [0.45, 0.78] spans the qualifier-exhaustion-memo prior range.
  width: 0.95
