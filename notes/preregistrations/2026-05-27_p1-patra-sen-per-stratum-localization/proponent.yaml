what_would_change_my_mind:
- If max_range < 0.10 (R-C fires), no natural axis carries a localizing signal. Either the missing Z is
  exogenous (temperature) and orthogonal to all natural axes, or the noisy-structure / structured-noise
  tie leans toward intrinsic structured noise. The temperature prior is still defensible but season being
  a temperature proxy fails.
- If max_range > 0.20 but binding_axis != season (e.g., hour_of_week or time_of_day binds with > 0.25
  range and season is < 0.15), the temperature-via-season interpretation is wrong on the proxy choice.
  R-A still fires but Q1A's downstream Z construction targets a temporal-cycle variable, not temperature.
- If alpha_L_marginal is outside [0.40, 0.85], there is a pipeline mismatch between Q1 M1 residuals and
  the qualifier-exhaustion baseline. The verdict is BLOCKED for diagnosis before proceeding.
- If day_type range > 0.15, M1's per-day-type conditioning has not absorbed the day-type asymmetry in
  non-Gaussian mass. This would be a Q1 / Q2A pipeline issue, not a P1 finding; arbiter should flag it.
