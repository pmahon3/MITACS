forecast:
  reasoning: 'Three lines of evidence point to R-A with season binding at range ~0.30 (max-over-axis).


    (a) The strongest a priori candidate Z is temperature (mitacs-clim-gap-nonstationary''s +1000 MW gap,
    mitacs-postcovid-probe''s ''exogenous info is the lever''). In the absence of exogenous data, the
    only natural axis that correlates strongly with temperature is season; the season axis should therefore
    inherit a temperature signal as a proxy. Winter (Nov-Mar) and summer (Jun-Aug) are high-load, high-volatility
    regimes where heavy-tailed residuals concentrate; shoulder (Apr-May, Sep-Oct) is the quiescent regime
    with closer-to-Gaussian residuals. A 0.30-point spread in alpha_L between winter/summer and shoulder
    is consistent with the magnitude of the climatology-gap effect.


    (b) Q2A''s Finding #2 (saturday chi^2 ~ 4x weekday chi^2, family-invariant across M1/M3/M4/M5) suggests
    day-type or hour-of-week structure. Day-type is already conditioning M1''s fit, so its alpha_L variation
    should be small (predicted range ~0.05). Hour-of-week is the finer-grained axis that captures within-week
    heterogeneity that day-type aggregates over; predicted range ~0.25, second-strongest.


    (c) qualifier-exhaustion-memo''s marginal alpha_L >= 0.49-0.74 sets the unstratified prior; my point
    forecast 0.60 is mid-range and consistent with M1 residuals (which are NOT the corrected predictor
    but the diagnostic-level kappa_1 residual against actuals). Demand quantile (0.10) is intermediate:
    high-demand strata likely have fatter tails than low-demand strata, but the per-stratum sample size
    is reduced (~33%) and bootstrap noise widens the noise floor.'
  units: alpha_L and range dimensionless in [0, 1]; outcome category in {R-A, R-B, R-C}; binding_axis
    is one of {demand_quantile, time_of_day, season, day_type, hour_of_week}.
  value:
    alpha_L_marginal: 0.6
    binding_axis: season
    max_range: 0.3
    outcome: R-A
    range_per_axis:
      day_type: 0.05
      demand_quantile: 0.1
      hour_of_week: 0.25
      season: 0.3
      time_of_day: 0.15
forecast_ci:
  high:
    alpha_L_marginal: 0.78
    hour_of_week_range: 0.4
