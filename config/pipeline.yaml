# MITACS pipeline configuration.
#
# All `paths.*` values are relative to the project root (the directory
# containing this `config/` folder) and are resolved to absolute paths by
# config/__init__.py. Do NOT use leading slashes or `../` here.
#
# This file replaces the old .env / data.convert_to_absolute_path mechanism.

paths:
  # --- data acquisition (stage 1) ---
  historical_csvs:      data/ontario/historical/csv
  pickled_dir:          data/ontario/historical/pickled
  # --- detrend (stage 2) ---
  stationary_candidate: pre_processing/csv/stationary_candidate.csv
  annual_params:        pre_processing/csv/annual_params.csv
  preprocess_plots:     pre_processing/plots
  # --- day-type tagging (stage 3) ---
  clustered_csv:        processing/clustering/csv/stationary_candidate.csv
  clustering_plots:     processing/clustering/plots
  # --- embedding dimension (stage 4) ---
  dimensions_dir:       processing/dimensions/params
  dimensions_plots:     processing/dimensions/plots
  # --- local-linear fits (stage 5) ---
  pointwise_output_dir: processing/locality/pointwise/output
  global_output_dir:    processing/locality/global/params
  # --- stochastic-operator / Pi_Delta estimator (stage 6, rebuilt) ---
  operator_output_dir:  processing/innovations/outputs

data:
  year_range: [2018, 2025]   # inclusive start, exclusive end (range semantics)
  variable_name: zscore
  daytypes: [weekday, saturday, sunday]
  day_anchor_hours: 7        # the "day" starts at 07:00, not midnight

embedding:
  max_dimensions: 10
  # dimension selection from the rho-vs-dim curve. "elbow" = smallest d
  # within elbow_tol (relative) of the plateau max -- principled on flat
  # curves (sunday plateaus from d=3; idxmax wrongly picks d=7).
  # "idxmax" = naive argmax (kept for reproducing pre-2026-05-17 results).
  dim_selection: elbow
  # 0.001 calibrated from the actual curves: weekday's true peak at d=2 has
  # relative prominence 0.00102, so tol must be < that to keep d=2 (not
  # collapse to d=1); still cuts sunday's idxmax=7 artifact to d=4 (the
  # first point on sunday's genuine plateau). 0.005 was too loose (weekday
  # -> d=1, discarding a real peak).
  elbow_tol: 0.001

theta:
  # Bandwidth grids for LocalGLSelector. The GL score has a sharp interior
  # optimum whose location is strongly dimension-dependent: empirically
  # ~theta=1.6 for sunday (d=7) but ~20 (saturday) / ~43 (weekday) for d=2.
  # A linear grid capped at 5.0 rail-pinned the d=2 day-types; the range
  # must reach ~60 and be GEOMETRIC so a single grid resolves both the
  # ~1.6 and the ~40 regions. (See memory: mitacs-theta-rail-pinning.)
  grid_spacing: geometric    # geometric | linear
  # drift-localization bandwidth grid (kernel theta)
  theta_min: 0.5
  theta_max: 60.0
  theta_count: 25
  # diffusion bandwidth grid (residual kernel)
  sigma_min: 0.5
  sigma_max: 60.0
  sigma_count: 25
  # LocalGLSelector global-local penalty constant
  gl_penalty_C: 2.0

sampling:
  sample_frac: 0.8
  random_seed: 42
  num_processes: null   # null -> serial; int -> parallel worker count

# ---------------------------------------------------------------------------
# Run profile. `full` uses the production grids/sample_frac above. `fast` is
# a cheap validation pass (minutes, not hours) that proves the pipeline
# produces sane artifacts before committing to the ~22M-lstsq full run.
# Select via `profile:` here or `--profile` on run_pipeline.py.
# A profile's keys override the matching theta/sampling values above.
# ---------------------------------------------------------------------------
profile: fast

profiles:
  full: {}   # use the values above unchanged
  fast:
    theta_count: 6
    sigma_count: 6
    sample_frac: 0.05
